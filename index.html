        function renderAttendanceTab() {
            const list = getProcessedStudents();
            if (list.length === 0) return `<div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100">แอดมินยังไม่ได้เพิ่มรายชื่อนักเรียนสำหรับห้องนี้</div>`;

            const dateStr = new Date(state.attendanceDate).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            const dayInfo = getAttendanceDayInfo(state.attendanceDate, state.activeClassroomId);
            const advStatus = getAdvanceCheckStatus(state.attendanceDate);
            
            const isGeoMode = state.settings?.geoCheckIn?.[state.activeClassroomId] || false;
            const lateTime = state.geoLateTime || state.settings?.lateTime || '07:30'; 
            const isToday = state.attendanceDate === getTodayString();
            
            const existingRecord = (state.roomData[state.activeClassroomId]?.attendance || []).find(a => a.date === state.attendanceDate);
            
            let isLocked = existingRecord && !state.isEditingMode;
            
            if (isGeoMode && isToday) {
                if (!existingRecord || !existingRecord.teacherConfirmed) {
                    isLocked = false; 
                }
            }

            const [lateH, lateM] = lateTime.split(':').map(Number);
            const unlockDateObj = new Date();
            unlockDateObj.setHours(lateH, lateM + 26, 0, 0); 
            const unlockTimeStr = `${String(unlockDateObj.getHours()).padStart(2, '0')}:${String(unlockDateObj.getMinutes()).padStart(2, '0')}`;

            const now = new Date();
            const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // 1. ดึงข้อมูลจากแอป Geo มาเตรียมไว้ก่อน
            const activeStds = list.filter(s => !s.isTransferred);
            const activeStdsCount = activeStds.length;
            
            let accountedStdsCount = 0;
            activeStds.forEach(s => {
                const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === s.id) : null;
                const hasScannedInTeacherApp = existingRecord && existingRecord.records && existingRecord.records.some(r => r.studentId === s.id);
                const hasLeave = rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === state.attendanceDate;
                
                let hasGeoScanned = false;
                if (rosterItem && rosterItem.assignedUid && window.app.geoUsersData) {
                    const geoUser = window.app.geoUsersData.find(u => u.id === rosterItem.assignedUid);
                    if (geoUser && geoUser.checkedIn && geoUser.checkInDate === state.attendanceDate) {
                        hasGeoScanned = true;
                    }
                }
                
                if (hasScannedInTeacherApp || hasLeave || hasGeoScanned) {
                    accountedStdsCount++;
                }
            });

            const allCheckedIn = accountedStdsCount >= activeStdsCount && activeStdsCount > 0;
            const isPastUnlockTime = !isToday || (isToday && currentTimeStr >= unlockTimeStr);
            const isGeoLocked = isGeoMode && isToday && !isPastUnlockTime && !allCheckedIn;

            if (isGeoMode && isToday && (!existingRecord || !existingRecord.teacherConfirmed) && allCheckedIn) {
                if (!window.isAutoSavingAttendance) {
                    window.isAutoSavingAttendance = true;
                    setTimeout(() => {
                        if (state.activeTab === 'attendance' && state.activeClassroomId) {
                            app.saveAttendance(true).finally(() => { window.isAutoSavingAttendance = false; });
                        } else {
                            window.isAutoSavingAttendance = false;
                        }
                    }, 500); 
                }
            }

            let badgeHtml = '';
            if (dayInfo.status === 'outside') badgeHtml = `<span class="bg-gray-100 text-gray-500 px-3 py-1 rounded-lg text-xs font-bold ml-3 border border-gray-200">ปิดภาคเรียน</span>`;
            else if (!dayInfo.isSchoolDay) badgeHtml = `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-bold ml-3 border border-red-200">${dayInfo.note || 'วันหยุดเสาร์-อาทิตย์'}</span>`;
            else badgeHtml = `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold ml-3 border border-blue-200">ภาคเรียน ${dayInfo.term} (วันที่ ${dayInfo.dayCount}) ${dayInfo.note ? ` - ${dayInfo.note}` : ''}</span>`;

            let blockMsg = '';
            if (dayInfo.status === 'outside') {
                blockMsg = `<div class="w-full bg-gray-100 text-gray-500 p-3 rounded-xl mb-4 text-sm font-semibold flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i> อยู่นอกช่วงเวลาเปิดภาคเรียน ไม่สามารถเช็คชื่อได้</div>`;
            } else if (!dayInfo.isSchoolDay) {
                blockMsg = `<div class="w-full bg-red-50 text-red-500 p-3 rounded-xl mb-4 text-sm font-semibold flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i> เป็นวันหยุด ไม่สามารถเช็คชื่อได้</div>`;
            } else if (!advStatus.allowed && !state.isEditingMode) {
                blockMsg = `<div class="w-full bg-orange-50 text-orange-600 p-3 rounded-xl mb-4 text-sm font-semibold flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i> ${advStatus.msg}</div>`;
            } else if (isGeoLocked) {
                blockMsg = `<div class="w-full bg-purple-50 text-purple-700 p-3 rounded-xl mb-4 text-sm font-semibold flex items-center gap-2 border border-purple-200 shadow-sm"><i data-lucide="smartphone" class="w-5 h-5 animate-pulse"></i> <b>โหมด GeoCheck-In:</b> ระบบจะปลดล็อคให้ครูจัดการย้อนหลัง เมื่อพ้นกำหนดสายไปแล้ว 25 นาที (เวลา ${unlockTimeStr} น.)</div>`;
            } else if (isGeoMode && (!isGeoLocked && isToday)) {
                let unlockReason = '';
                if (existingRecord && existingRecord.teacherConfirmed) {
                    unlockReason = 'บันทึกข้อมูลเสร็จสมบูรณ์แล้ว';
                } else if (allCheckedIn) {
                    unlockReason = 'นักเรียนเช็กชื่อ+แจ้งลาครบทุกคนแล้ว ระบบกำลังบันทึกอัตโนมัติ...';
                } else {
                    unlockReason = 'พ้นกำหนดสาย 25 นาทีแล้ว และได้ดึงคนที่ยังไม่สแกนขึ้นด้านบนแล้ว';
                }
                blockMsg = `<div class="w-full bg-emerald-50 text-emerald-700 p-3 rounded-xl mb-4 text-sm font-semibold flex items-center gap-2 border border-emerald-200"><i data-lucide="unlock" class="w-4 h-4"></i> ปลดล็อคโหมด GeoCheck-In แล้ว (${unlockReason})</div>`;
            }

            const canInteract = !isLocked && advStatus.allowed && dayInfo.isSchoolDay && dayInfo.status !== 'outside' && !isGeoLocked;

            let btnClass = state.isLoading || !canInteract ? 'bg-gray-400 text-white cursor-not-allowed opacity-80' : (existingRecord ? 'bg-[#3b82f6] hover:bg-blue-600 text-white active:scale-95' : 'bg-[#10b981] hover:bg-emerald-600 text-white active:scale-95');
            let btnText = state.isLoading ? '⏳ กำลังบันทึก...' : (isLocked ? '<i data-lucide="lock" class="w-4 h-4"></i> บันทึกแล้ว' : (!canInteract ? '<i data-lucide="slash" class="w-4 h-4"></i> ไม่สามารถเช็คชื่อได้' : (existingRecord ? 'บันทึกการแก้ไข' : 'บันทึกการเช็คชื่อ')));

            const hasLineConfig = !!(state.settings?.lineTokens?.[state.activeClassroomId] && state.settings?.lineGroups?.[state.activeClassroomId]);
            // 🤖 แสดงเครื่องมือ LINE เฉพาะวันที่สามารถเช็คชื่อได้จริงเท่านั้น
            // วันหยุด / ปิดภาคเรียน / วันที่ยังไม่อนุญาตให้เช็คชื่อ / ช่วง Geo ยังล็อกอยู่ จะซ่อนทั้งหมด
            const canUseLineTools = hasLineConfig && dayInfo.isSchoolDay && dayInfo.status !== 'outside' && advStatus.allowed && !isGeoLocked;
            const autoLineEnabled = state.settings?.lineAutoSendEnabledMap?.[state.activeClassroomId] || false;
            const autoLineTime = state.settings?.lineAutoSendTimeMap?.[state.activeClassroomId] || '16:30';

            let studentsWithStatus = list.map(s => {
                // 🌟 1. ดึงข้อมูลใบลาของเด็กคนนี้ (จากแอป GeoCheck-In)
                const rosterItem = app.rosterData ? app.rosterData.find(r => r.id === s.id) : null;
                const manualStatus = rosterItem ? rosterItem.manualStatus : null;
                const manualStatusDate = rosterItem ? rosterItem.manualStatusDate : null;

                // 🌟 2. กำหนดสถานะตั้งต้น (ถ้าเด็กขาดประจำ ให้ตั้งต้นว่าขาด)
                let defaultStatus = s.isRegularlyAbsent ? 'absent' : 'present';
                const isBeforeTransferIn = s.transferInDate && state.attendanceDate < s.transferInDate;

                // 🌟 3. ตรวจสอบใบลาจาก GeoCheck-In ว่ามีผลกับวันนี้ไหม?
                // 🌟 ดึงข้อมูลใบลาของเด็กคนนี้ (จากแอป GeoCheck-In) - อัปเดตรองรับทุกสถานะ
                        let geoLeaveStatus = null;
                        if (manualStatus && manualStatusDate === state.attendanceDate) {
                            if (manualStatus.includes('sick')) geoLeaveStatus = 'sick';
                            else if (manualStatus.includes('leave') || manualStatus === 'other') geoLeaveStatus = 'leave';
                            else if (manualStatus === 'on_time') geoLeaveStatus = 'present';
                        }

                // 🌟 4. ตรวจสอบการเช็คชื่อด้วยระบบ GeoCheck-In ของวันนี้
                let geoCheckInStatus = null;
                let geoCheckInTime = null; 
                if (rosterItem && rosterItem.assignedUid && window.app.geoUsersData) {
                    const geoUser = window.app.geoUsersData.find(u => u.id === rosterItem.assignedUid);
                    if (geoUser && geoUser.checkedIn && geoUser.checkInDate === state.attendanceDate) {
                        if (geoUser.status === 'on_time') geoCheckInStatus = 'present';
                        else if (geoUser.status === 'absent') geoCheckInStatus = 'absent';
                        else if (geoUser.status && geoUser.status.includes('late')) geoCheckInStatus = 'late';
                        
                        if (geoUser.checkInTime) {
                            const rawDate = geoUser.checkInTime.toDate ? geoUser.checkInTime.toDate() : new Date(geoUser.checkInTime);
                            geoCheckInTime = `${String(rawDate.getHours()).padStart(2, '0')}:${String(rawDate.getMinutes()).padStart(2, '0')}`;
                        }
                    }
                }

                // 🌟 5. เข้าสู่กระบวนการตัดสินใจ (ลำดับความสำคัญของสถานะ)
                if (dayInfo.status === 'outside' || !dayInfo.isSchoolDay) {
                    defaultStatus = null; // ปิดเทอม / วันหยุด ไม่ต้องทำอะไร
                } else if (isBeforeTransferIn) {
                    defaultStatus = 'present'; // ยังไม่ย้ายเข้า ให้สิทธิ์มาเรียน
                } else if (geoLeaveStatus) {
                    defaultStatus = geoLeaveStatus; // 🚩 [สำคัญ] ใบลาต้องใหญ่ที่สุด! มีใบลาห้ามปรับเป็นขาดเด็ดขาด
                } else if (geoCheckInStatus) {
                    defaultStatus = geoCheckInStatus; // ถ้าสแกนแล้ว ให้ยึดตามเวลาสแกน
                } else if (isGeoMode) {
                    // ถ้ายังไม่มีอะไรเลย (ยังไม่มา, ยังไม่ลา) ให้ขึ้นสถานะรอสแกน หรือ ปรับขาดเมื่อหมดเวลา
                    const lateTime = state.geoLateTime || state.settings?.lateTime || '07:30'; 
                    const [lateH, lateM] = lateTime.split(':').map(Number);
                    const unlockDateObj = new Date();
                    unlockDateObj.setHours(lateH, lateM + 26, 0, 0); // เผื่อให้สายได้ 25 นาที
                    const now = new Date();
                    const isPastUnlockTime = state.attendanceDate < getTodayString() || (state.attendanceDate === getTodayString() && now >= unlockDateObj);
                    
                    // 🚩 เฉพาะคนที่ "ไม่มีใบลา" และ "หมดเวลาแล้ว" เท่านั้น ถึงจะโดนตบเป็นขาด!
                    defaultStatus = isPastUnlockTime ? 'absent' : 'pending';
                }

                // 🌟 6. เช็คว่าเคยมีประวัติบันทึกลงสมุดของครูแล้วหรือยัง (ถ้ามีให้ยึดสมุดครูเป็นหลัก)
                const currentStatus = state.records[s.id] || defaultStatus;
                
                // 🌟 7. จัดการเรื่องเวลา
                let timeStr = geoCheckInTime;
                if (!timeStr) {
                    const exRec = existingRecord ? existingRecord.records.find(r => r.studentId === s.id) : null;
                    if (exRec && exRec.time) timeStr = exRec.time;
                }

                // 🌟 8. แพ็คข้อมูลส่งออก
                return { ...s, currentStatus, timeStr: timeStr || '-' };
            });

            if (isGeoMode && isToday && isPastUnlockTime && !allCheckedIn) {
                studentsWithStatus.sort((a, b) => {
                    const isAAbsent = a.currentStatus === 'absent';
                    const isBAbsent = b.currentStatus === 'absent';
                    if (isAAbsent && !isBAbsent) return -1;
                    if (!isAAbsent && isBAbsent) return 1;
                    return Number(a.studentNumber) - Number(b.studentNumber);
                });
            }

            // 🚀 คำนวณเปอร์เซ็นต์สำหรับสร้างกล่อง 4 กล่องหน้าเช็คชื่อ (แบบเดียวกับหน้ารายงานเป๊ะๆ)
            let pCount = 0, lCount = 0, aCount = 0, leaveCount = 0, sickCount = 0, pendingCount = 0;
            studentsWithStatus.forEach(s => {
                if (s.isTransferred && state.attendanceDate >= s.transferDate) return;
                
                const status = s.currentStatus;
                if (status === 'present') pCount++;
                else if (status === 'late') lCount++;
                else if (status === 'absent') aCount++;
                else if (status === 'leave') leaveCount++;
                else if (status === 'sick') sickCount++;
                else if (status === 'pending') pendingCount++;
            });

            // 🚀 กล่อง 4 กล่อง (ดึงรูปแบบจากหน้ารายงานมา 100% เป๊ะๆ ตามคำสั่ง)
                const totalPresent = pCount + lCount;
                const totalActive = totalPresent + aCount + leaveCount + sickCount;
                
                // คำนวณเปอร์เซ็นต์ของวันนี้
                const pPct = totalActive ? Math.round((totalPresent / totalActive) * 100) : 0;
                const onTimePct = totalActive ? Math.round((pCount / totalActive) * 100) : 0;
                const latePct = totalActive ? Math.round((lCount / totalActive) * 100) : 0;
                
                const aPct = totalActive ? Math.round((aCount / totalActive) * 100) : 0;
                const leavePct = totalActive ? Math.round((leaveCount / totalActive) * 100) : 0;
                const sickPct = totalActive ? Math.round((sickCount / totalActive) * 100) : 0;

                // 🤖 ปุ่มสร้างภาพล่าสุดจะแสดงเฉพาะกรณีที่วันนั้นมีรายการต้องส่ง LINE จริง
                // ถ้ามาเรียนครบและตรงเวลาครบทุกคน จะซ่อนปุ่ม เพราะไม่ต้องส่งรายงานเข้า LINE
                const hasLineReportItemsForCurrentScreen = lCount > 0 || aCount > 0 || leaveCount > 0 || sickCount > 0;
                const hasSavedAttendanceForLine = !!existingRecord && (!isGeoMode || !!existingRecord.teacherConfirmed);
                const hideCreateLatestLineButton = !hasSavedAttendanceForLine || !hasLineReportItemsForCurrentScreen || shouldHideCreateLatestLineButton(state.activeClassroomId, state.attendanceDate, autoLineTime);
                const createLatestLineButtonHtml = hideCreateLatestLineButton ? '' : `
                            <button 
                                type="button"
                                onclick="app.saveLatestLineImageToDrive()"
                                class="px-4 py-3 rounded-2xl bg-blue-50 text-blue-700 font-bold border border-blue-100 active:scale-95 whitespace-nowrap"
                            >
                                สร้างภาพล่าสุด
                            </button>`;
                const autoLineSettingsHtml = canUseLineTools ? `
                    <div class="bg-white border border-blue-100 rounded-3xl p-4 mb-4 shadow-sm">
                        <div class="flex items-center justify-between gap-3 mb-3">
                            <div>
                                <div class="font-black text-blue-700 text-base flex items-center gap-2">
                                    <i data-lucide="clock" class="w-5 h-5"></i>
                                    ตั้งเวลาส่ง LINE อัตโนมัติ
                                </div>
                                <div class="text-xs text-gray-500 mt-1">
                                    ระบบจะส่งภาพล่าสุดที่สร้างหลังบันทึกเช็คชื่อ ตามเวลาที่ตั้งในช่องนี้
                                </div>
                            </div>
                            <label class="flex items-center gap-2 text-sm font-bold text-gray-700 shrink-0">
                                <input 
                                    type="checkbox" 
                                    ${autoLineEnabled ? 'checked' : ''}
                                    onchange="app.toggleAutoLineSend('${state.activeClassroomId}', this.checked)"
                                    class="w-5 h-5 accent-blue-600"
                                >
                                เปิดใช้
                            </label>
                        </div>

                        <div class="flex items-center gap-3">
                            <input 
                                type="time" 
                                value="${autoLineTime}"
                                onchange="app.updateAutoLineSendTime('${state.activeClassroomId}', this.value)"
                                class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 font-bold text-center text-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                            >
                            ${createLatestLineButtonHtml}
                        </div>

                        <div class="text-xs text-gray-400 mt-2">
                            ตั้งช่วงเวลา Trigger ใน Apps Script ให้ครอบคลุมเวลานี้ แล้วระบบจะตรวจเวลาจากแอป A ก่อนส่ง LINE
                        </div>
                    </div>
                ` : '';

                let presentCardHtml = '';
                
                // 📌 กรณีเปิดโหมด Geo (โชว์ละเอียดในกล่องแรก ไม่ต้องห้อย "คน")
                if (isGeoMode) {
                    presentCardHtml = `
                        <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-emerald-100 text-emerald-500 shadow-sm">
                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col justify-center w-full">
                                <div class="flex justify-between items-end border-b border-gray-50 pb-1 mb-1">
                                    <span class="text-gray-500 text-[10px] sm:text-[11px] font-medium leading-none">มาเรียนรวม</span>
                                    <span class="text-sm sm:text-base font-black text-emerald-600 leading-none">${pPct}%</span>
                                </div>
                                <div class="flex justify-between text-[9px] sm:text-[10px] font-semibold">
                                    <span class="text-emerald-500">ตรงเวลา: ${onTimePct}%</span>
                                    <span class="text-orange-500">สาย: ${latePct}%</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 📌 กรณีปิดโหมด Geo (หน้าตาเหมือนกล่องอื่นเป๊ะ มีห้อย "คน")
                    presentCardHtml = `
                        <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-emerald-100 text-emerald-500 shadow-sm">
                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col justify-center">
                                <p class="text-gray-500 text-[10px] sm:text-xs font-medium leading-none mb-1">มาเรียนรวม ${totalPresent} คน</p>
                                <p class="text-lg sm:text-xl font-black text-gray-800 leading-none">${pPct}%</p>
                            </div>
                        </div>
                    `;
                }

                // 📌 กล่อง ขาด ลา ป่วย (หน้าตาเหมือนเดิม เพิ่มห้อย "คน")
                const otherCardsHtml = [
                    { title: 'ขาดเรียน', value: aPct, count: aCount, color: 'bg-[#ef4444]', text: 'text-red-500', icon: 'alert-circle' },
                    { title: 'ลากิจ', value: leavePct, count: leaveCount, color: 'bg-[#3b82f6]', text: 'text-blue-500', icon: 'file-text' },
                    { title: 'ลาป่วย', value: sickPct, count: sickCount, color: 'bg-[#f59e0b]', text: 'text-orange-500', icon: 'activity' }
                ].map(c => `
                    <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${c.color} bg-opacity-10 ${c.text} shadow-sm">
                            <i data-lucide="${c.icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col justify-center">
                            <p class="text-gray-500 text-[10px] sm:text-xs font-medium leading-none mb-1">${c.title} ${c.count} คน</p>
                            <p class="text-lg sm:text-xl font-black text-gray-800 leading-none">${c.value}%</p>
                        </div>
                    </div>
                `).join('');

                const statCards = presentCardHtml + otherCardsHtml;

            // --- 1. เตรียม HTML สำหรับตารางปกติ ---
            const rows = studentsWithStatus.map(s => {
                const currentStatus = s.currentStatus;
                const interactClass = canInteract ? 'hover:bg-gray-200 cursor-pointer' : 'cursor-default opacity-80';
                
                const getBtn = (type, label, activeClass) => {
                    const isActive = currentStatus === type;
                    const bgClass = isActive ? activeClass + ' text-white shadow-sm ring-1 ring-offset-1' : 'bg-gray-100 text-gray-500';
                    return `<button type="button" ${!canInteract ? 'disabled' : ''} onclick="app.setStatus('${s.id}', '${type}')" class="flex-1 py-1.5 sm:py-2 px-1 sm:px-3 rounded-xl text-xs sm:text-sm font-bold transition-all ${interactClass} ${bgClass}">${label}</button>`;
                };

                let buttonsHtml = '';
                if (s.isTransferred) {
                    buttonsHtml = `<div class="flex items-center w-full"><span class="text-xs font-bold text-gray-500 bg-gray-100 px-4 py-1.5 rounded-lg border border-gray-200 whitespace-nowrap"><i data-lucide="user-x" class="w-3 h-3 inline mr-1"></i>ย้ายออก (${s.transferDate})</span></div>`;
                } else if (isGeoMode && currentStatus === 'pending') {
                    buttonsHtml = `<div class="w-full flex justify-start sm:justify-center"><div class="w-full flex justify-center items-center text-xs sm:text-sm font-bold text-purple-600 bg-purple-100 px-4 py-1.5 sm:py-2 rounded-xl border border-purple-200 whitespace-nowrap ${isGeoLocked ? 'animate-pulse' : ''}"><i data-lucide="scan" class="w-4 h-4 mr-1.5"></i>รอสแกนเข้าเรียน</div></div>`;
                } else {
                    buttonsHtml = `
                        <div class="flex gap-1.5 sm:gap-2 justify-start whitespace-nowrap">
                            ${getBtn('present', 'มา', 'bg-[#10b981] ring-[#10b981]')}
                            ${isGeoMode ? getBtn('late', 'สาย', 'bg-[#f59e0b] ring-[#f59e0b]') : ''} 
                            ${getBtn('absent', 'ขาด', 'bg-[#ef4444] ring-[#ef4444]')}
                            ${getBtn('leave', 'ลา', 'bg-[#8b5cf6] ring-[#8b5cf6]')}
                            ${getBtn('sick', 'ป่วย', 'bg-[#3b82f6] ring-[#3b82f6]')}
                        </div>
                    `;
                }

                let timeCellHtml = isGeoMode ? `<td class="p-3 sm:p-4 text-center whitespace-nowrap"><span class="inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold text-gray-500 bg-gray-100/50 px-2 py-1 rounded-md border border-gray-100 ${s.timeStr !== '-' ? 'text-emerald-600' : ''}"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${s.timeStr}</span></td>` : '';

                const avatarTheme = s.gender === 'F'
                    ? { bg: 'bg-pink-100', ring: 'ring-pink-50', text: 'text-pink-600', icon: '🩷' }
                    : s.gender === 'M'
                        ? { bg: 'bg-blue-100', ring: 'ring-blue-50', text: 'text-blue-600', icon: '🩵' }
                        : { bg: 'bg-gray-100', ring: 'ring-gray-50', text: 'text-gray-500', icon: '🤍' };

                const genderAvatarHtml = `
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full ${avatarTheme.bg} ${avatarTheme.text} ring-4 ${avatarTheme.ring} shadow-sm flex items-center justify-center shrink-0 text-lg sm:text-xl leading-none">
                        <span class="relative top-[1px]">${avatarTheme.icon}</span>
                    </div>
                `;

                return `
                    <tr class="hover:bg-gray-50/50 transition-colors border-b border-gray-50 last:border-0 ${s.isTransferred ? 'opacity-60 bg-gray-50' : ''}">
                        <td class="p-2 sm:p-4 text-center text-sm font-bold text-gray-400">${s.studentNumber || '-'}</td>
                        <td class="p-2 sm:p-4 whitespace-nowrap">
                            <div class="flex items-center gap-3 min-w-[100px]">
                                ${genderAvatarHtml}
                                <div class="flex flex-col items-start gap-1 min-w-0">
                                    <span class="text-sm font-bold text-gray-800 leading-tight">${s.displayName}</span>
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        ${s.isRegularlyAbsent && !s.isTransferred ? `<span class="px-1.5 py-0.5 bg-red-50 text-red-500 border border-red-200 rounded text-[9px] font-bold">ขาดประจำ</span>` : ''}
                                        ${s.isTransferred ? `<span class="px-1.5 py-0.5 bg-gray-500 text-white rounded text-[9px] font-bold shadow-sm">ย้ายออก (${s.transferDate})</span>` : ''}
                                        ${s.transferInDate ? `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded text-[9px] font-bold shadow-sm">ย้ายเข้า (${s.transferInDate})</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="p-2 sm:p-4 whitespace-nowrap">${buttonsHtml}</td>
                        ${timeCellHtml}
                    </tr>
                `;
            }).join('');

            // --- 2. สร้าง HTML สำหรับแสดงผลด้านล่าง (แยกระหว่าง "ตาราง" กับ "กลุ่มกล่อง") ---
            let bottomViewHtml = '';

            if (!isGeoMode && isLocked) {
                // 🌟 โหมดปกติ + บันทึกแล้ว -> แสดงเป็นกลุ่มกล่องสวยงาม 🌟
                let gPresent = [], gAbsent = [], gLeave = [], gSick = [];
                studentsWithStatus.forEach(s => {
                    if (s.isTransferred && state.attendanceDate >= s.transferDate) return;
                    if (s.currentStatus === 'present') gPresent.push(s);
                    else if (s.currentStatus === 'absent') gAbsent.push(s);
                    else if (s.currentStatus === 'leave') gLeave.push(s);
                    else if (s.currentStatus === 'sick') gSick.push(s);
                });

                const renderZone = (title, students, theme) => {
                    if (students.length === 0) return '';
                    const boxes = students.map(std => `
                        <div class="px-3 py-3 rounded-xl border-2 ${theme.bg} ${theme.border} ${theme.text} text-center font-bold text-sm sm:text-base truncate shadow-sm">
                            <span class="relative top-[-2px]">${std.first}</span>
                        </div>
                    `).join('');

                    return `
                        <div class="mb-8 w-full">
                            <div class="flex items-baseline gap-3 mb-4 border-b border-gray-100 pb-2">
                                <h3 class="text-xl sm:text-2xl font-black ${theme.title}">${title}</h3>
                                <span class="text-sm font-bold text-gray-600">${students.length} คน</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 w-full">
                                ${boxes}
                            </div>
                        </div>
                    `;
                };

                bottomViewHtml = `
                    <div class="bg-white rounded-[3rem] shadow-sm border border-gray-100 p-6 sm:p-10 flex-1 mb-10">
                        ${renderZone('มาเรียน', gPresent, { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', title: 'text-emerald-600' })}
                        ${renderZone('ขาดเรียน', gAbsent, { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-700', title: 'text-red-600' })}
                        ${renderZone('ลากิจ', gLeave, { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', title: 'text-blue-600' })}
                        ${renderZone('ลาป่วย', gSick, { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-700', title: 'text-orange-600' })}
                    </div>
                `;
            } else {
                // 🌟 โหมด Geo หรือ กำลังแก้ไข (ยังไม่กดบันทึก) -> แสดงเป็นตารางให้กดปุ่มเช็คชื่อได้ 🌟
                bottomViewHtml = `
                    <div class="bg-white rounded-[3rem] shadow-sm border border-gray-100 overflow-hidden flex-1 mb-10">
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left min-w-[100px]">
                                <thead class="bg-gray-50/50 text-gray-500 text-sm whitespace-nowrap border-b border-gray-100">
                                    <tr>
                                        <th class="py-4 px-2 sm:px-4 font-bold text-center w-12 sm:w-16">เลขที่</th>
                                        <th class="py-4 px-2 sm:px-4 font-bold cursor-pointer select-none hover:opacity-70 transition-opacity" onclick="app.toggleNameDisplay('${state.activeClassroomId}')" title="กดเพื่อสลับรูปแบบชื่อ">${state.settings?.showFullNameMap?.[state.activeClassroomId] ? 'ชื่อ - สกุล' : 'ชื่อ'}</th>
                                        <th class="py-4 px-2 sm:px-4 font-bold text-center min-w-[200px] sm:min-w-[300px]">สถานะ</th>
                                        ${isGeoMode ? '<th class="py-4 px-2 sm:px-4 font-bold text-center w-24 sm:w-32">เวลาเข้า</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-50">
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="${state.skipAnimation ? '' : 'animate-fade-in'} flex flex-col h-full">
                    ${blockMsg}
                    ${autoLineSettingsHtml}
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div class="flex items-center gap-2 flex-wrap">

                            ${canUseLineTools ? `

                        <button onclick="app.saveAttendance()" ${state.isLoading || !canInteract ? 'disabled' : ''} class="flex items-center gap-2 px-8 py-3 rounded-2xl shadow-sm font-bold transition-all whitespace-nowrap ${btnClass}">

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 mb-6">
                        ${statCards}

        function renderUnrecordedTab() {
            const s = state.settings;
            let todayStr = getTodayString();
            
            if (todayStr < s.term1Start) {
                return `
                    <div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100 flex flex-col items-center animate-slide-up">
                        <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-4"><i data-lucide="calendar" class="w-8 h-8"></i></div>
                        <h3 class="text-xl font-bold text-gray-800 mb-1">ยังไม่เปิดภาคเรียน</h3>
                        <p>ระบบจะเริ่มแสดงวันที่ค้างเช็คชื่อเมื่อถึงวันเปิดภาคเรียนที่ 1</p>
                    </div>
                `;
            }

            let checkEnd = todayStr > s.term2End ? s.term2End : todayStr;
            let curr = parseDateLocal(s.term1Start);
            let target = parseDateLocal(checkEnd);
            
            const missingDates = [];
            const recordedDates = new Set((state.roomData[state.activeClassroomId]?.attendance || []).map(a => a.date));
            
            while (curr <= target) {
                let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                if (dStr > s.term1End && dStr < s.term2Start) {
                    curr.setDate(curr.getDate() + 1);
                    continue;
                }
                
                if (isSchoolDay(dStr) && !recordedDates.has(dStr)) {
                    missingDates.push(dStr);
                }
                curr.setDate(curr.getDate() + 1);
            }
            
            missingDates.sort((a,b) => new Date(b) - new Date(a)); 
            
            if(missingDates.length === 0) {
                return `
                    <div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100 flex flex-col items-center animate-slide-up">
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-4"><i data-lucide="check-circle" class="w-8 h-8"></i></div>
                        <h3 class="text-xl font-bold text-gray-800 mb-1">ยอดเยี่ยมมาก!</h3>
                        <p>คุณบันทึกเวลาเรียนครบทุกวันแล้ว ไม่มีวันค้างเช็คชื่อ</p>
                    </div>
                `;
            }

            const rows = missingDates.map(dateStr => {
                const dObj = new Date(dateStr);
                const display = dObj.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                return `
                    <div class="bg-white p-4 rounded-[1rem] shadow-sm border border-red-100 hover:border-red-300 transition-all flex justify-between items-center group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center shrink-0"><i data-lucide="calendar-x" class="w-5 h-5"></i></div>
                            <div>
                                <span class="block text-gray-800 font-bold leading-tight">${display}</span>
                                <span class="text-xs text-red-500 font-medium">ยังไม่ได้บันทึกข้อมูล</span>
                            </div>
                        </div>
                        <button onclick="app.goToAttendance('${dateStr}')" class="px-4 py-2 bg-red-50 hover:bg-red-500 hover:text-white text-red-600 rounded-xl text-sm font-bold transition-colors shadow-sm">
                            ไปบันทึก
                        </button>
                    </div>
                `;
            }).join('');

            return `
                <div class="animate-slide-up space-y-6">
                    <div class="flex items-center gap-2">
                        <h2 class="text-xl font-semibold text-gray-800">วันที่ค้างเช็คชื่อ</h2>
                        <span class="bg-red-100 text-red-600 px-2.5 py-1 rounded-lg text-xs font-bold">${missingDates.length} วัน</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${rows}
                    </div>
                </div>
            `;
        }

        function renderHistoryTab() {
            const currentAttendance = state.roomData[state.activeClassroomId]?.attendance || [];
            const list = getProcessedStudents();
            const isGeoMode = state.settings?.geoCheckIn?.[state.activeClassroomId] === true; 
            const s = state.settings;
            const todayStr = getTodayString();

            // --- 1. เตรียมข้อมูลวันที่ครูเช็คชื่อแล้ว (รวมวันชดเชย) ---
            const recordedStats = currentAttendance.map(day => {
                let p=0, late=0, a=0, l=0, s_stat=0, t=0;
                day.records.forEach(r => {
                    if (r.status === 'present') p++; 
                    else if (r.status === 'late') {
                        late++; 
                        if (!isGeoMode) p++; 
                    }
                    else if (r.status === 'absent') a++; 
                    else if (r.status === 'leave') l++; 
                    else if (r.status === 'sick') s_stat++;
                    t++;
                });

                if (day.date < todayStr) {
                    const recordedIds = new Set(day.records.map(r => r.studentId));
                    let missingCount = 0;
                    
                    list.forEach(std => {
                        if (recordedIds.has(std.id)) return; 
                        if (std.isTransferred && day.date >= std.transferDate) return; 
                        
                        if (std.transferInDate && day.date < std.transferInDate) {
                            p++; t++;
                        } else if (isGeoMode) {
                            missingCount++;
                        }
                    });
                    
                    if (missingCount > 0) {
                        a += missingCount; 
                        t += missingCount; 
                    }
                }

                // 🌟 [เพิ่มโค้ดก้อนนี้ลงไป] เพื่อดึงยอดลากิจ/ลาป่วยที่เด็กแจ้งสดๆ ของวันนี้ มารวมในกล่องสรุป
                if (isGeoMode && day.date === todayStr) {
                    const recordedIds = new Set(day.records.map(r => r.studentId));
                    list.forEach(std => {
                        if (recordedIds.has(std.id)) return; 
                        
                        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                        if (rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === todayStr) {
                            const ms = rosterItem.manualStatus;
                            if (ms.includes('sick')) s_stat++;
                            else if (ms.includes('leave') || ms === 'other') l++;
                            else if (ms === 'on_time') p++;
                            t++;
                        }
                    });
                }

                const dayInfo = getAttendanceDayInfo(day.date, state.activeClassroomId);
                return { 
                    type: 'attendance',
                    id: day.id,
                    records: day.records,
                    date: day.date, 
                    stats: { p, late, a, l, s: s_stat, t }, 
                    pct: t > 0 ? Math.round(((p + (isGeoMode ? late : 0))/t)*100) : 0, 
                    dayInfo 
                };
            });

            // --- 2. เตรียมข้อมูลวันหยุดพิเศษ (กำหนดเอง) ที่ยังไม่ถึงอนาคต ---
            const holidayStats = [];
            const recordedDatesSet = new Set(currentAttendance.map(a => a.date));
            
            if (s && s.holidays) {
                s.holidays.forEach(h => {
                    const hDate = typeof h === 'string' ? h : h.date;
                    const hNote = typeof h === 'string' ? 'วันหยุดพิเศษ' : h.note;

                    if (hDate <= todayStr && hDate >= s.term1Start && !recordedDatesSet.has(hDate)) {
                        const dObj = parseDateLocal(hDate);
                        const dayOfWeek = dObj.getDay();
                        
                        if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                            holidayStats.push({
                                type: 'holiday',
                                date: hDate,
                                note: hNote,
                                dayInfo: getAttendanceDayInfo(hDate, state.activeClassroomId)
                            });
                        }
                    }
                });
            }

            // --- 3. นำข้อมูลทั้งสองแบบมารวมกันและเรียงตามวันที่ ---
            const displayItems = [...recordedStats, ...holidayStats];
            displayItems.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (displayItems.length === 0) return `<div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100 flex flex-col items-center"><i data-lucide="history" class="w-16 h-16 text-gray-300 mb-4"></i>ยังไม่มีข้อมูลประวัติการเช็คชื่อและวันหยุด</div>`;

            // --- 4. การแสดงผลหน้าจอรายละเอียด (เมื่อคลิกเข้าไปดู) ---
            if (state.historySelectedDate) {
                const dayData = recordedStats.find(d => d.date === state.historySelectedDate);
                if (!dayData) return ''; 

                const dateStr = new Date(dayData.date).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                
                let pCount = 0, lCount = 0, aCount = 0, leaveCount = 0, sickCount = 0;
                let rowsHtml = '';

                // คำนวณสถานะนักเรียนทั้งหมด
                const studentRecords = list.map(std => {
                    const record = dayData.records.find(r => r.studentId === std.id);
                    let stat = record ? record.status : null;
                    let time = record && record.time ? record.time : '-';
					
					// 🔥 ดึงเวลาและสถานะสดๆ จาก Geo/Roster กรณีเป็นของวันนี้และยังไม่มีการกดบันทึก
                    if (isGeoMode && state.historySelectedDate === todayStr && !stat) {
                        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                        
                        // 🌟 1. ดักจับสถานะ "ลา" (Manual Status) จาก Roster ก่อน!
                        if (rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === todayStr) {
                            const ms = rosterItem.manualStatus;
                            if (ms === 'sick_leave' || ms === 'sick_confirmed' || ms === 'sick_unconfirmed') stat = 'sick';
                            else if (ms === 'personal_leave' || ms === 'leave_confirmed' || ms === 'leave_unconfirmed') stat = 'leave';
                            else if (ms === 'other') stat = 'leave';
                            else if (ms === 'on_time') stat = 'present';
                        }
                        
                        // 🌟 2. ถ้าไม่ได้ลา ให้เช็คว่า "สแกนแล้ว" หรือยัง
                        if (!stat && rosterItem && rosterItem.assignedUid && window.app.geoUsersData) {
                            const geoUser = window.app.geoUsersData.find(u => u.id === rosterItem.assignedUid);
                            if (geoUser && geoUser.checkedIn && geoUser.checkInDate === todayStr) {
                                if (geoUser.status === 'on_time') stat = 'present';
                                else if (geoUser.status === 'absent') stat = 'absent';
                                else if (geoUser.status && geoUser.status.includes('late')) stat = 'late';
                                
                                if (geoUser.checkInTime) {
                                    const rawDate = geoUser.checkInTime.toDate ? geoUser.checkInTime.toDate() : new Date(geoUser.checkInTime);
                                    time = `${String(rawDate.getHours()).padStart(2, '0')}:${String(rawDate.getMinutes()).padStart(2, '0')}`;
                                }
                            }
                        }
                    }

                    if (stat === 'late' && !isGeoMode) stat = 'present';
                    
                    if (std.isTransferred && dayData.date >= std.transferDate) {
                        stat = 'transferred';
                    } else if (!stat) {
                        if (std.transferInDate && dayData.date < std.transferInDate) {
                            stat = 'present';
                        } else if (isGeoMode && dayData.date < todayStr) {
                            stat = 'absent';
                        }
                    }

                    return { student: std, status: stat, time: time };
                });

                // เรียงตามเลขที่
                studentRecords.sort((a, b) => Number(a.student.studentNumber) - Number(b.student.studentNumber));

                studentRecords.forEach((item, index) => {
                    const s = item.student;
                    const status = item.status;
                    const time = item.time;

                    if (status === 'present') pCount++;
                    else if (status === 'late') lCount++;
                    else if (status === 'absent') aCount++;
                    else if (status === 'leave') leaveCount++;
                    else if (status === 'sick') sickCount++;

                    let statusBadge = '';
                    // 🌟 เพิ่มเงื่อนไข ถ้าเปิด Geo ให้โชว์ "มาตรงเวลา" ถ้าปิดให้โชว์ "มาเรียน"
                    let presentText = isGeoMode ? 'มาตรงเวลา' : 'มาเรียน';
                    
                    if (status === 'present') statusBadge = `<span class="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="check-circle-2" class="w-4 h-4 inline mb-0.5 mr-1"></i>${presentText}</span>`;
                    else if (status === 'late') statusBadge = `<span class="bg-yellow-100 text-yellow-700 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="clock" class="w-4 h-4 inline mb-0.5 mr-1"></i>มาสาย</span>`;
                    else if (status === 'absent') statusBadge = `<span class="bg-red-100 text-red-700 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="x-circle" class="w-4 h-4 inline mb-0.5 mr-1"></i>ขาดเรียน</span>`;
                    else if (status === 'leave') statusBadge = `<span class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="file-text" class="w-4 h-4 inline mb-0.5 mr-1"></i>ลากิจ</span>`;
                    else if (status === 'sick') statusBadge = `<span class="bg-orange-100 text-orange-700 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="plus-square" class="w-4 h-4 inline mb-0.5 mr-1"></i>ลาป่วย</span>`;
                    else if (status === 'transferred') statusBadge = `<span class="bg-gray-200 text-gray-500 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap"><i data-lucide="log-out" class="w-4 h-4 inline mb-0.5 mr-1"></i>ย้ายออก</span>`;
                    else statusBadge = `<span class="bg-gray-100 text-gray-500 px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap">ไม่มีข้อมูล</span>`;

                    // การสร้างตารางแถวนักเรียน
                let timeHtml = isGeoMode ? `<td class="p-3 sm:p-4 text-center whitespace-nowrap"><span class="inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold text-gray-500 bg-gray-100/50 px-2 py-1 rounded-md border border-gray-100"><i data-lucide="clock" class="w-3 h-3"></i> ${time}</span></td>` : '';

                rowsHtml += `
                    <tr class="hover:bg-gray-50/50 transition-colors border-b border-gray-50 last:border-0 ${s.isTransferred ? 'opacity-60 bg-gray-50' : ''}">
                        <td class="p-3 sm:p-4 text-center text-sm font-bold text-gray-400">${s.studentNumber || '-'}</td>
                        <td class="p-2 sm:p-4 whitespace-nowrap">
                            <div class="flex flex-col items-start gap-1">
                                <span class="text-sm font-bold text-gray-800">${s.displayName}</span>
                                <div class="flex items-center gap-1.5">
                                    ${s.isRegularlyAbsent && !s.isTransferred ? `<span class="px-1.5 py-0.5 bg-red-50 text-red-500 border border-red-200 rounded text-[9px] font-bold">ขาดประจำ</span>` : ''}
                                    ${s.isTransferred ? `<span class="px-1.5 py-0.5 bg-gray-500 text-white rounded text-[9px] font-bold shadow-sm">ย้ายออก (${s.transferDate})</span>` : ''}
                                    ${s.transferInDate ? `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded text-[9px] font-bold shadow-sm">ย้ายเข้า (${s.transferInDate})</span>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="p-3 sm:p-4 text-center whitespace-nowrap">${statusBadge}</td>
                        ${timeHtml}
                    </tr>
                `;
            });

                // 🚀 กล่อง 4 กล่อง (ดึงรูปแบบจากหน้ารายงานมา 100% เป๊ะๆ ตามคำสั่ง)
                const totalPresent = pCount + lCount;
                const totalActive = totalPresent + aCount + leaveCount + sickCount;
                
                // คำนวณเปอร์เซ็นต์ของวันนี้
                const pPct = totalActive ? Math.round((totalPresent / totalActive) * 100) : 0;
                const onTimePct = totalActive ? Math.round((pCount / totalActive) * 100) : 0;
                const latePct = totalActive ? Math.round((lCount / totalActive) * 100) : 0;
                
                const aPct = totalActive ? Math.round((aCount / totalActive) * 100) : 0;
                const leavePct = totalActive ? Math.round((leaveCount / totalActive) * 100) : 0;
                const sickPct = totalActive ? Math.round((sickCount / totalActive) * 100) : 0;

                let presentCardHtml = '';
                
                // 📌 กรณีเปิดโหมด Geo (โชว์ละเอียดในกล่องแรก ไม่ต้องห้อย "คน")
                if (isGeoMode) {
                    presentCardHtml = `
                        <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-emerald-100 text-emerald-500 shadow-sm">
                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col justify-center w-full">
                                <div class="flex justify-between items-end border-b border-gray-50 pb-1 mb-1">
                                    <span class="text-gray-500 text-[10px] sm:text-[11px] font-medium leading-none">มาเรียนรวม</span>
                                    <span class="text-sm sm:text-base font-black text-emerald-600 leading-none">${pPct}%</span>
                                </div>
                                <div class="flex justify-between text-[9px] sm:text-[10px] font-semibold">
                                    <span class="text-emerald-500">ตรงเวลา: ${onTimePct}%</span>
                                    <span class="text-orange-500">สาย: ${latePct}%</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 📌 กรณีปิดโหมด Geo (หน้าตาเหมือนกล่องอื่นเป๊ะ มีห้อย "คน")
                    presentCardHtml = `
                        <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-emerald-100 text-emerald-500 shadow-sm">
                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col justify-center">
                                <p class="text-gray-500 text-[10px] sm:text-xs font-medium leading-none mb-1">มาเรียนรวม ${totalPresent} คน</p>
                                <p class="text-lg sm:text-xl font-black text-gray-800 leading-none">${pPct}%</p>
                            </div>
                        </div>
                    `;
                }

                // 📌 กล่อง ขาด ลา ป่วย (หน้าตาเหมือนเดิม เพิ่มห้อย "คน")
                const otherCardsHtml = [
                    { title: 'ขาดเรียน', value: aPct, count: aCount, color: 'bg-[#ef4444]', text: 'text-red-500', icon: 'alert-circle' },
                    { title: 'ลากิจ', value: leavePct, count: leaveCount, color: 'bg-[#3b82f6]', text: 'text-blue-500', icon: 'file-text' },
                    { title: 'ลาป่วย', value: sickPct, count: sickCount, color: 'bg-[#f59e0b]', text: 'text-orange-500', icon: 'activity' }
                ].map(c => `
                    <div class="bg-white rounded-2xl p-3 sm:px-4 sm:py-3 shadow-sm border border-gray-100 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${c.color} bg-opacity-10 ${c.text} shadow-sm">
                            <i data-lucide="${c.icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col justify-center">
                            <p class="text-gray-500 text-[10px] sm:text-xs font-medium leading-none mb-1">${c.title} ${c.count} คน</p>
                            <p class="text-lg sm:text-xl font-black text-gray-800 leading-none">${c.value}%</p>
                        </div>
                    </div>
                `).join('');

                const statCards = presentCardHtml + otherCardsHtml;

                // ป้ายกำกับบนหน้าดูรายละเอียด
                let badgeHtml = '';
                if(dayData.dayInfo.status === 'outside') badgeHtml = `<span class="bg-gray-100 text-gray-500 px-3 py-1 rounded-lg text-[10px] font-bold">ปิดภาคเรียน</span>`;
                else if (!dayData.dayInfo.isSchoolDay) badgeHtml = `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-[10px] font-bold border border-red-200">${dayData.dayInfo.note || 'วันหยุดเสาร์-อาทิตย์'}</span>`;
                else {
                    const termBadge = `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-[10px] font-bold border border-blue-200">ภาคเรียน ${dayData.dayInfo.term} (วันที่ ${dayData.dayInfo.dayCount})</span>`;
                    if (dayData.dayInfo.note) {
                        badgeHtml = `<div class="flex items-center gap-2">${termBadge}<span class="bg-indigo-50 text-indigo-600 border border-indigo-200 px-2 py-1 rounded-lg text-[10px] font-bold shadow-sm">${dayData.dayInfo.note}</span></div>`;
                    } else {
                        badgeHtml = termBadge;
                    }
                }

                const lateTime = state.geoLateTime || state.settings?.lateTime || '07:30';
                const [lateH, lateM] = lateTime.split(':').map(Number);
                const unlockDateObj = new Date();
                unlockDateObj.setHours(lateH, lateM + 26, 0, 0);
                const unlockTimeStr = `${String(unlockDateObj.getHours()).padStart(2, '0')}:${String(unlockDateObj.getMinutes()).padStart(2, '0')}`;
                const now = new Date();
                const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                // 🌟 นับยอดเด็กที่มีสถานะครบแล้ว (ไม่ว่าเป็นข้อมูลดิบจากฐานข้อมูล หรือดึงสดๆ จากแอป Geo)
                const validRecordsCount = studentRecords.filter(item => item.status && item.status !== 'transferred').length;
                const activeStdsCount = list.filter(std => !std.isTransferred || dayData.date < std.transferDate).length;
                const allCheckedIn = validRecordsCount >= activeStdsCount && activeStdsCount > 0;
                const isLockedRecord = isGeoMode && dayData.date === todayStr && currentTimeStr < unlockTimeStr && !allCheckedIn;

                let actionBtnsHtml = '';
                if (isLockedRecord) {
                    actionBtnsHtml = `<span class="bg-purple-50 text-purple-600 px-4 py-2 rounded-xl text-xs font-bold border border-purple-200 flex items-center gap-1 shadow-sm"><i data-lucide="lock" class="w-4 h-4"></i> ล็อกโดย GeoCheck-In</span>`;
                } else {
                    actionBtnsHtml = `
                        <button onclick="app.openPrompt('edit', '${dayData.date}')" class="flex items-center gap-1.5 px-3 py-2 bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white rounded-xl font-bold text-sm transition-all border border-blue-100 shadow-sm">
                            <i data-lucide="edit-2" class="w-4 h-4"></i> แก้ไข
                        </button>
                        <button onclick="app.openPrompt('delete', '${dayData.id}')" class="flex items-center gap-1.5 px-3 py-2 bg-red-50 text-red-600 hover:bg-red-500 hover:text-white rounded-xl font-bold text-sm transition-all border border-red-100 shadow-sm">
                            <i data-lucide="trash-2" class="w-4 h-4"></i> ลบ
                        </button>
                    `;
                }

                return `
                    <div class="animate-fade-in flex flex-col h-full">
                        <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
                            <div class="flex items-center gap-4">
                                <button onclick="app.backToHistoryList()" class="p-2 bg-white hover:bg-gray-100 rounded-xl text-gray-600 transition-colors shadow-sm border border-gray-100"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                                <div>
                                    <h2 class="text-xl font-bold text-gray-800">รายละเอียดวันที่ ${dateStr}</h2>
                                    <div class="mt-1">${badgeHtml}</div>
                                </div>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                ${actionBtnsHtml}
                            </div>
                        </div>

                        <!-- 4 กล่องสรุป -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 mb-6">
                            ${statCards}
                        </div>

                        <!-- ตาราง 4-5 คอลัมน์ -->
                        <div class="bg-white rounded-[1.5rem] shadow-sm border border-gray-100 overflow-hidden flex-1">
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-left min-w-[100px]">
                                    <thead class="bg-gray-50/50 text-gray-500 text-[13px] border-b border-gray-100">
                                        <tr>
                                            <th class="py-4 px-4 font-bold text-center w-12 sm:w-16">เลขที่</th>
                                            <th class="py-4 px-4 font-bold cursor-pointer select-none hover:opacity-70 transition-opacity" onclick="app.toggleNameDisplay('${state.activeClassroomId}')" title="กดเพื่อสลับรูปแบบชื่อ">${state.settings?.showFullNameMap?.[state.activeClassroomId] ? 'ชื่อ - สกุล' : 'ชื่อ'}</th>
                                            <th class="py-4 px-4 font-bold text-center w-32 sm:w-40">สถานะ</th>
                                            ${isGeoMode ? `<th class="py-4 px-4 font-bold text-center w-24 sm:w-32">เวลาเข้า</th>` : ''}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- 5. วาดกล่องทั้งหมดในหน้ารวมประวัติ (LIST VIEW แบบเดิมของคุณครู) ---
            const cards = displayItems.map(item => {
                const dateStr = new Date(item.date).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                
                // 🛑 กรณีวันหยุดพิเศษที่สร้างกล่องจำลองขึ้นมา
                if (item.type === 'holiday') {
                    return `
                        <div class="bg-red-50 p-4 rounded-[1rem] shadow-sm border border-red-200 flex flex-col gap-3 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-16 h-16 bg-red-100 rounded-bl-full opacity-50"></div>
                            <div class="flex justify-between items-start relative z-10">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-10 h-10 rounded-xl bg-red-100 text-red-500 flex items-center justify-center shrink-0"><i data-lucide="calendar-x" class="w-5 h-5"></i></div>
                                    <div class="flex flex-col gap-0.5">
                                        <span class="block text-red-900 font-bold text-sm leading-tight">${dateStr}</span>
                                        <span class="text-[10px] text-red-500 font-semibold leading-none">วันหยุดพิเศษ</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-center items-center bg-white/70 px-3 py-3 rounded-xl border border-red-100 mt-1 relative z-10 shadow-inner">
                                <span class="text-red-600 font-bold text-[13px] text-center">${item.note}</span>
                            </div>
                        </div>
                    `;
                }

                // ✅ กรณีวันเรียนปกติและวันชดเชย
                const badgeClass = item.pct >= 80 ? 'bg-emerald-100 text-emerald-700' : item.pct >= 50 ? 'bg-orange-100 text-orange-700' : 'bg-red-100 text-red-700';
                
                let dayNoteHtml = '';
                if(item.dayInfo.status === 'outside') dayNoteHtml = `<span class="text-[10px] text-gray-400 font-semibold leading-none">ปิดภาคเรียน</span>`;
                else if (!item.dayInfo.isSchoolDay) dayNoteHtml = `<span class="text-[10px] text-red-400 font-semibold leading-none">${item.dayInfo.note || 'หยุดเสาร์-อาทิตย์'}</span>`;
                else {
                    const termHtml = `<span class="text-[10px] text-gray-400 font-semibold leading-none">เทอม ${item.dayInfo.term} วันที่ ${item.dayInfo.dayCount}</span>`;
                    if (item.dayInfo.note) {
                        dayNoteHtml = `
                            <div class="flex items-center gap-1.5 mt-0.5">
                                ${termHtml}
                                <span class="text-[9px] text-[#3b82f6] bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 font-bold leading-none">${item.dayInfo.note}</span>
                            </div>
                        `;
                    } else {
                        dayNoteHtml = termHtml;
                    }
                }

                const lateDisplay = (isGeoMode && item.stats.late > 0) ? `<span class="text-orange-500 font-bold ml-1">(สาย ${item.stats.late})</span>` : '';
                const presentCountDisplay = isGeoMode ? (item.stats.p + item.stats.late) : item.stats.p;

                return `
                    <div onclick="app.selectHistoryDate('${item.date}')" class="bg-white p-4 rounded-[1rem] shadow-sm border border-gray-100 hover:border-[#3b82f6] hover:shadow-md transition-all cursor-pointer group flex flex-col gap-3">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-2.5">
                                <div class="w-10 h-10 rounded-xl bg-[#3b82f6]/10 text-[#3b82f6] flex items-center justify-center shrink-0"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                                <div class="flex flex-col gap-1.5 items-start">
                                    <span class="block text-gray-800 font-bold text-sm leading-tight">${dateStr}</span>
                                    ${dayNoteHtml}
                                </div>
                            </div>
                            <div class="px-2 py-1 rounded-lg text-xs font-bold ${badgeClass}">${item.pct}%</div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] sm:text-xs font-medium text-gray-500 bg-gray-50 px-3 py-2 rounded-xl">
                            <span>มา <b class="text-emerald-600">${presentCountDisplay}</b>${lateDisplay}</span>
                            <span>ขาด <b class="text-red-600">${item.stats.a}</b></span>
                            <span>ลา <b class="text-blue-600">${item.stats.l}</b></span>
                            <span>ป่วย <b class="text-orange-600">${item.stats.s}</b></span>
                        </div>
                    </div>
                `;
            }).join('');

            return `<div class="animate-slide-up space-y-6"><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">${cards}</div></div>`;
        }

        function renderReportTab() {
            const list = getProcessedStudents();
            const currentAttendance = state.roomData[state.activeClassroomId]?.attendance || [];
            const isGeoMode = state.settings?.geoCheckIn?.[state.activeClassroomId] === true; 
            
            const s = state.settings;
            let todayStr = getTodayString();
            if (todayStr > s.term2End) todayStr = s.term2End;
            else if (todayStr > s.term1End && todayStr < s.term2Start) todayStr = s.term1End;
            
            const todayInfo = getAttendanceDayInfo(todayStr, state.activeClassroomId);
            const passedDays = todayInfo.dayCount > 0 ? todayInfo.dayCount : 1; 

            const logic = state.settings?.logic?.[state.activeClassroomId] || 'cont';
            let targetDays = 200; 
            if(logic === 'split') targetDays = 100;

            const recordedDays = currentAttendance.length;

            if (list.length === 0 || currentAttendance.length === 0) {
                return `<div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100">ยังไม่มีข้อมูลการเช็คชื่อ</div>`;
            }

            let totalP = 0, totalLate = 0, totalL = 0, totalS = 0, totalA = 0; 
            const studentStats = {};
            list.forEach(std => { studentStats[std.id] = { p: 0, late: 0, l: 0, s: 0, a: 0, t: 0, student: std }; });

            currentAttendance.forEach(day => {
                const recordedIds = [];
                day.records.forEach(r => {
                    recordedIds.push(r.studentId); // จำว่าวันนี้มีใครสแกนหรือมีบันทึกบ้าง
                    if (!studentStats[r.studentId]) return;
                    studentStats[r.studentId].t++;
                    
                    if (r.status === 'present') { totalP++; studentStats[r.studentId].p++; }
                    else if (r.status === 'late') { totalLate++; studentStats[r.studentId].late++; }
                    else if (r.status === 'absent') { totalA++; studentStats[r.studentId].a++; }
                    else if (r.status && (r.status === 'sick' || r.status.includes('sick'))) { totalS++; studentStats[r.studentId].s++; }
                    else if (r.status && (r.status === 'leave' || r.status.includes('leave') || r.status === 'other')) { totalL++; studentStats[r.studentId].l++; }
                });

                // 🌟 AUTO-STATUS เช็คว่าวันนั้นใครหายไปบ้าง
                if (day.date < getTodayString()) {
                    list.forEach(std => {
                        if (recordedIds.includes(std.id) || !studentStats[std.id]) return;
                        if (std.isTransferred && day.date >= std.transferDate) return;

                        if (std.transferInDate && day.date < std.transferInDate) {
                            studentStats[std.id].t++;
                            studentStats[std.id].p++;
                            totalP++;
                        }
                        else if (isGeoMode) {
                            studentStats[std.id].t++;
                            studentStats[std.id].a++;
                            totalA++;
                        }
                    });
                }
                // 🌟 [เพิ่มโค้ดก้อนนี้ลงไป] ดึงสถานะการลาดิบของวันนี้มาคิดเป้าหมายและคำนวณในหลอดสีด้วย!
                else if (day.date === getTodayString() && isGeoMode) {
                    list.forEach(std => {
                        if (recordedIds.includes(std.id) || !studentStats[std.id]) return;
                        
                        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                        if (rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === getTodayString()) {
                            studentStats[std.id].t++;
                            const ms = rosterItem.manualStatus;
                            if (ms.includes('sick')) { totalS++; studentStats[std.id].s++; }
                            else if (ms.includes('leave') || ms === 'other') { totalL++; studentStats[std.id].l++; }
                            else if (ms === 'on_time') { totalP++; studentStats[std.id].p++; }
                        }
                    });
                }
            });

            const allPresent = totalP + totalLate;
            const total = allPresent + totalL + totalS + totalA;
            
            const pPct = total ? Math.round((allPresent/total)*100) : 0; 
            const onTimePct = total ? Math.round((totalP/total)*100) : 0; 
            const latePct = total ? Math.round((totalLate/total)*100) : 0; 
            const lPct = total ? Math.round((totalL/total)*100) : 0;
            const sPct = total ? Math.round((totalS/total)*100) : 0;
            const aPct = total ? Math.round((totalA/total)*100) : 0;
            
            const stdArray = Object.values(studentStats).sort((a,b) => Number(a.student.studentNumber) - Number(b.student.studentNumber));

            if (state.reportSelectedStudentId) {
                const sData = stdArray.find(d => d.student.id === state.reportSelectedStudentId);
                if(!sData) return '';
                const std = sData.student;
                
                const historyList = currentAttendance.map(day => {
                    const record = day.records.find(r => r.studentId === std.id);
                    let stat = record ? record.status : null;
                    if(stat === 'late' && !isGeoMode) stat = 'present'; 

                    // 🌟 [เพิ่มโค้ดก้อนนี้ลงไป] ดึงสถานะลาของวันนี้ มาแสดงแทนคำว่า "ไม่มีข้อมูล"
                    if (isGeoMode && day.date === todayStr && !stat) {
                        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                        if (rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === todayStr) {
                            const ms = rosterItem.manualStatus;
                            if (ms.includes('sick')) stat = 'sick';
                            else if (ms.includes('leave') || ms === 'other') stat = 'leave';
                            else if (ms === 'on_time') stat = 'present';
                        }
                    }

                    if (!stat && day.date < getTodayString()) {
                        // 🌟 วันที่เกิดก่อนย้ายเข้า ให้สิทธิ์ "มา"
                        if (std.transferInDate && day.date < std.transferInDate) {
                            stat = 'present';
                        } 
                        // 🚩 ต้องดักไว้ว่า ถ้าไม่มีบันทึกว่าลา ถึงจะจับเป็นขาด (ป้องกันประวัติย้อนหลังเพี้ยน)
                        else if (isGeoMode && (!std.isTransferred || day.date < std.transferDate)) {
                            // เช็คอีกรอบเผื่อมีใบลาค้างในระบบ Geo
                            const rItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                            if (rItem && rItem.manualStatus && rItem.manualStatusDate === day.date) {
                                const ms = rItem.manualStatus;
                                if (ms.includes('sick')) stat = 'sick';
                                else if (ms.includes('leave') || ms === 'other') stat = 'leave';
                            } else {
                                stat = 'absent';
                            }
                        }
                    }

                    return { date: day.date, status: stat };
                }).filter(h => h.status !== null);

                const getStatusDisplay = (status) => {
                    // 🌟 เพิ่มเงื่อนไข ถ้าเปิด Geo ให้โชว์ "มาตรงเวลา" ถ้าปิดให้โชว์ "มาเรียน"
                    let presentText = isGeoMode ? 'มาตรงเวลา' : 'มาเรียน';
                    
                    if (status === 'present') return `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-xl text-sm font-semibold">${presentText}</span>`;
                    if (status === 'late') return `<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-xl text-sm font-semibold">มาสาย</span>`;
                    if (status === 'absent') return `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-xl text-sm font-semibold">ขาดเรียน</span>`;
                    if (status && (status === 'sick' || status.includes('sick'))) return `<span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-xl text-sm font-semibold">ลาป่วย</span>`;
                    if (status && (status === 'leave' || status.includes('leave') || status === 'other' || status === 'personal_leave')) return `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-xl text-sm font-semibold">ลากิจ</span>`;
                    return `<span class="bg-gray-100 text-gray-500 px-3 py-1 rounded-xl text-sm font-semibold">ไม่มีข้อมูล</span>`;
                };

                const hRows = historyList.map(h => `
                    <tr class="hover:bg-gray-50/50 transition-colors whitespace-nowrap">
                        <td class="px-6 py-4 font-medium text-gray-700">${new Date(h.date).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</td>
                        <td class="px-6 py-4 text-right pr-10">${getStatusDisplay(h.status)}</td>
                    </tr>
                `).join('');

                const avatarColor = std.gender === 'M' ? 'bg-blue-500' : std.gender === 'F' ? 'bg-pink-500' : 'bg-gray-500';
                const dobInfo = getAgeAndDayText(std.dob);
                const totalPresentStudent = sData.p + sData.late;

                return `
                    <div class="animate-fade-in flex flex-col h-full">
                        <div class="flex items-center gap-4 mb-6">
                            <button onclick="app.backToReportList()" class="p-2 bg-white hover:bg-gray-100 rounded-xl text-gray-600 transition-colors shadow-sm border border-gray-100"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                            <h2 class="text-xl font-bold text-[#2563eb]">ข้อมูลและประวัติการเข้าเรียน</h2>
                        </div>
                        <div class="bg-white rounded-[1.5rem] shadow-sm border border-gray-100 p-6 mb-6 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-24 h-24 rounded-bl-full opacity-20 ${avatarColor}"></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-4 gap-x-8 text-sm sm:text-base relative z-10">
                                <div class="flex flex-col"><span class="text-gray-400 text-xs font-semibold uppercase">เลขที่</span><span class="font-bold text-[#2563eb] text-xl">${std.studentNumber}</span></div>
                                <div class="flex flex-col"><span class="text-gray-400 text-xs font-semibold uppercase">ชื่อ-นามสกุล</span><span class="font-bold text-gray-800 text-lg">${std.fullName} ${std.nickname ? `(${std.nickname})` : ''} ${std.isTransferred ? `<span class="ml-1 px-1.5 py-0.5 bg-gray-500 text-white rounded text-[10px] shadow-sm whitespace-nowrap">ย้าย (${std.transferDate})</span>` : ''}</span></div>
                                <div class="flex flex-col"><span class="text-gray-400 text-xs font-semibold uppercase">รหัสนักเรียน</span><span class="font-semibold text-gray-700">${std.studentIdCode || '-'}</span></div>
                                <div class="flex flex-col"><span class="text-gray-400 text-xs font-semibold uppercase">เลขประจำตัวประชาชน</span><span class="font-semibold text-gray-700">${std.nationalId || '-'}</span></div>
                                
                                <div class="flex flex-col sm:col-span-2">
                                    <span class="text-gray-400 text-xs font-semibold uppercase">วันเกิด</span>
                                    <span class="font-semibold text-gray-700">${dobInfo.dob !== '-' ? `${dobInfo.dob} (อายุ ${dobInfo.age})` : '-'}</span>
                                </div>
                            </div>
                            
                            <div class="mt-6 pt-6 border-t border-gray-100 grid grid-cols-4 gap-2 text-center">
                                <div class="bg-emerald-50 rounded-xl p-2 flex flex-col justify-center items-center">
                                    <span class="block text-emerald-600 font-bold text-lg leading-none">${totalPresentStudent}</span>
