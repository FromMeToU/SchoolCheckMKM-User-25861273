        // --- 3. Global State & Settings ---

        function getTodayString() {

            // 👇 เพิ่มส่วนนี้ต่อท้ายเข้าไปด้านใน state

                activeTab: 'play', // 'play' หรือ 'settings'
                duration: 3,       // เวลาสุ่มเริ่มต้น 3 วินาที
                selectedRooms: [], // ห้องที่ถูกเลือก
                openRooms: [],     // ห้องที่กด Dropdown กางออก
                unselectedStudents: {}, // เก็บ id เด็กที่ถูกติ๊กออก { 'id': true }
                drawnStudents: {}, // 🌟 NEW: เก็บ id เด็กที่โดนสุ่มไปแล้วเพื่อไม่ให้ซ้ำ
                allStudents: [],   // ข้อมูลเด็กทั้งหมดที่ดึงมา
                dataYear: null,    // ปีที่ดึงข้อมูลมา
                isSpinning: false, // กำลังสุ่มอยู่หรือไม่

            }
        };

        let globalUnsubscribers = [];
        let yearUnsubscribers = [];
        let roomUnsubscribers = {}; 

        // --- 4. Helper Functions ---
        function toggleLoading(loading) {
            state.savedScrollY = window.scrollY; // 🌟 จำตำแหน่งหน้าจอ
            state.skipAnimation = true; // 🌟 สั่งระงับการกะพริบ
            state.isLoading = loading;
            render();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const id = 'toast-' + Date.now();
            const colorClass = type === 'success' ? 'bg-[#10b981]' : 'bg-[#ef4444]';
            const iconStr = type === 'success' ? '<i data-lucide="check-circle" class="mr-3 w-5 h-5"></i>' : '<i data-lucide="alert-circle" class="mr-3 w-5 h-5"></i>';
            
            const toastHtml = `
                <div id="${id}" class="flex items-center px-6 py-4 rounded-2xl shadow-lg transform transition-all duration-300 animate-slide-left pointer-events-auto text-white ${colorClass}">
                    ${iconStr}
                    <span class="font-medium">${message}</span>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', toastHtml);
            lucide.createIcons();
            
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300); 
                }
            }, 1000);
        }

        function getDisplayClassrooms() {
            return PREDEFINED_CLASSES.map(preset => {
                const dbRoom = state.classrooms.find(c => c.id === preset.id);
                return dbRoom ? { ...preset, ...dbRoom } : { ...preset, password: '1234' };
            });
        }

        function getProcessedStudents(roomId = state.activeClassroomId) {
            if (!roomId || !state.roomData[roomId]) return [];
            
            // 🌟 ลบเงื่อนไขการซ่อนเด็กย้ายรูปแบบแยกเทอมออก ให้ดึงนักเรียนทั้งหมดมาแสดง
            let currentStudents = state.roomData[roomId].students || [];

            const list = currentStudents.map(s => {
                let gender = 'U'; 
                let first = '';
                let last = '';
                let stripped = (s.name || '').trim();

                const prefixes = [
                    { p: 'เด็กชาย', g: 'M' }, { p: 'เด็กหญิง', g: 'F' },
                    { p: 'นาย', g: 'M' }, { p: 'นางสาว', g: 'F' },
                    { p: 'ด.ช.', g: 'M' }, { p: 'ด.ญ.', g: 'F' }
                ];

                for (let prefix of prefixes) {
                    if (stripped.startsWith(prefix.p)) {
                        gender = prefix.g;
                        stripped = stripped.substring(prefix.p.length).trim();
                        break;
                    }
                }

                const parts = stripped.split(/\s+/);
                first = parts[0];
                last = parts.slice(1).join(' ');

                return { ...s, gender, first, last, fullName: s.name };
            });

            const counts = {};
            list.forEach(s => {
                const key = `${s.first}_${s.gender}`;
                counts[key] = (counts[key] || 0) + 1;
            });

            return list.map(s => {
                const key = `${s.first}_${s.gender}`;
                const fullNameStr = `${s.first} ${s.last}`.trim(); // 🌟 เตรียมชื่อ-สกุล (ที่ตัดคำนำหน้าออกแล้ว)
                
                // 🌟 อ่านค่าการตั้งค่าจาก Firebase Settings แทน (ถ้ายังไม่มีค่า ให้ตั้งต้นเป็น false/ซ่อน)
                const showFull = state.settings?.showFullNameMap?.[roomId] || false;

                return {
                    ...s,
                    // 🌟 ถ้าระบบของห้องนี้ตั้งให้โชว์เต็ม หรือมีคนชื่อตัวซ้ำกัน ให้โชว์นามสกุลด้วย
                    displayName: showFull ? fullNameStr : (counts[key] > 1 ? fullNameStr : s.first)
                };
            });
        }

        function loadAttendanceRecords() {
            if (!state.activeClassroomId || !state.roomData[state.activeClassroomId]) return;
            const existing = (state.roomData[state.activeClassroomId].attendance || []).find(a => a.date === state.attendanceDate);
            state.records = {};
            if (existing) {
                existing.records.forEach(r => { state.records[r.studentId] = r.status; });
            }
        }

        function getGenderClass(gender) {
            if (gender === 'M') return 'bg-blue-100 text-blue-800';
            if (gender === 'F') return 'bg-pink-100 text-pink-800';
            return 'bg-gray-100 text-gray-800';
        }

        function getAgeAndDayText(dobStr) {
            if (!dobStr) return { dob: '-', age: '-' };
            const parts = dobStr.split('/');
            if (parts.length !== 3) return { dob: dobStr, age: '-' };
            let d = parseInt(parts[0]), m = parseInt(parts[1]), y = parseInt(parts[2]);
            if (y > 2500) y -= 543;
            const dobDate = new Date(y, m - 1, d);
            if (isNaN(dobDate)) return { dob: dobStr, age: '-' };
            
            const days = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
            const dayName = days[dobDate.getDay()];
            
            const today = new Date();
            let ageY = today.getFullYear() - dobDate.getFullYear();
            let ageM = today.getMonth() - dobDate.getMonth();
            if (ageM < 0 || (ageM === 0 && today.getDate() < dobDate.getDate())) {
                ageY--;
                ageM += 12;
            }
            if (today.getDate() < dobDate.getDate()) ageM--;
            if (ageM < 0) ageM += 12; 
            
            // เปลี่ยนรูปแบบให้เป็น วันพุธ 01/05/2556 (ตัดคำว่า 'ที่' ออก)
            return { dob: `วัน${dayName} ${dobStr}`, age: `${ageY} ปี ${ageM} เดือน` };
        }

        // --- Calendar & School Day Logic ---
        function parseDateLocal(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return new Date(y, m - 1, d);
        }

        function isSchoolDay(dateStr) {
            const isHoliday = state.settings.holidays.some(h => (typeof h === 'string' ? h : h.date) === dateStr);
            if (isHoliday) return false;
            
            const isMakeup = state.settings.makeups.some(m => (typeof m === 'string' ? m : m.date) === dateStr);
            if (isMakeup) return true;
            
            const d = parseDateLocal(dateStr);
            const day = d.getDay();
            if (day === 0 || day === 6) return false; 
            return true;
        }

        function getAttendanceDayInfo(targetDateStr, roomId) {
            const s = state.settings;
            if (!s) return { term: 0, dayCount: 0, isSchoolDay: false, status: 'outside', note: '' };
            
            let note = '';
            const holObj = s.holidays.find(h => (typeof h === 'string' ? h : h.date) === targetDateStr);
            if (holObj) note = typeof holObj === 'string' ? 'วันหยุดพิเศษ' : holObj.note;
            else {
                const mkObj = s.makeups.find(m => (typeof m === 'string' ? m : m.date) === targetDateStr);
                if (mkObj) note = typeof mkObj === 'string' ? 'วันชดเชย' : mkObj.note;
            }

            const isTargetSchoolDay = isSchoolDay(targetDateStr);
            let logic = s.logic[roomId] || 'cont';

            if (targetDateStr >= s.term1Start && targetDateStr <= s.term1End) {
                let count = 0;
                let curr = parseDateLocal(s.term1Start);
                let target = parseDateLocal(targetDateStr);
                while (curr <= target) {
                    let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                    if (isSchoolDay(dStr)) count++;
                    curr.setDate(curr.getDate() + 1);
                }
                return { term: 1, dayCount: count, isSchoolDay: isTargetSchoolDay, status: 'term1', note };
            } else if (targetDateStr >= s.term2Start && targetDateStr <= s.term2End) {
                let t1Total = 0;
                if (logic === 'cont') {
                    let curr = parseDateLocal(s.term1Start);
                    let target = parseDateLocal(s.term1End);
                    while (curr <= target) {
                        let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                        if (isSchoolDay(dStr)) t1Total++;
                        curr.setDate(curr.getDate() + 1);
                    }
                }
                let count = 0;
                let curr = parseDateLocal(s.term2Start);
                let target = parseDateLocal(targetDateStr);
                while (curr <= target) {
                    let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                    if (isSchoolDay(dStr)) count++;
                    curr.setDate(curr.getDate() + 1);
                }
                return { term: 2, dayCount: t1Total + count, isSchoolDay: isTargetSchoolDay, status: 'term2', note };
            }
            return { term: 0, dayCount: 0, isSchoolDay: isTargetSchoolDay, status: 'outside', note }; 
        }



        // 🔁 สร้างข้อความแจ้งเตือนนักเรียนที่ขาด/ลาต่อเนื่อง 2 วันขึ้นไป
        function isAbsentOrLeaveStatus(status) {
            if (!status) return false;
            const s = String(status);
            return s === 'absent' || s === 'leave' || s === 'personal_leave' || s === 'sick' || s === 'sick_leave' || s === 'other';
        }

        function isCountableAttendanceDay(dateStr, roomId) {
            const info = getAttendanceDayInfo(dateStr, roomId);
            return info && info.status !== 'outside' && info.isSchoolDay;
        }

        function getPreviousDateString(dateStr) {
            const d = parseDateLocal(dateStr);
            d.setDate(d.getDate() - 1);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getStudentLineName(student) {
            return student?.first || student?.displayName || student?.name || '-';
        }

        function isLateStatus(status) {
            if (!status) return false;
            const s = String(status);
            return s === 'late' || s.includes('late');
        }

        function isPresentOrLateStatus(status) {
            if (!status) return false;
            const s = String(status);
            return s === 'present' || s === 'on_time' || isLateStatus(s);
        }

        function sortContinuousRows(rows) {
            return rows.sort((a, b) => {
                if (b.days !== a.days) return b.days - a.days;
                return String(a.name).localeCompare(String(b.name), 'th');
            });
        }

        // 🔁 สร้างข้อความแจ้งเตือนนักเรียนที่ขาด/ลาต่อเนื่อง 2 วันขึ้นไป
        // รูปแบบใหม่: 🔁 ขาด/ลาต่อเนื่อง: \n- ไมตรี 2 วันติด
        function buildContinuousAbsentLeaveReport(roomId, dateStr, students, currentStatusByStudentId) {
            const attendanceList = state.roomData?.[roomId]?.attendance || [];
            const attendanceByDate = new Map(attendanceList.map(day => [day.date, day]));
            const rows = [];

            students.forEach(student => {
                if (student.isTransferred && dateStr >= student.transferDate) return;

                const todayStatus = currentStatusByStudentId?.[student.id];
                if (!isAbsentOrLeaveStatus(todayStatus)) return;

                let streak = 1;
                let checkDate = getPreviousDateString(dateStr);
                let guard = 0;

                while (guard < 90) {
                    guard++;

                    if (!isCountableAttendanceDay(checkDate, roomId)) {
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    const dayRecord = attendanceByDate.get(checkDate);
                    if (!dayRecord || !Array.isArray(dayRecord.records)) break;

                    const rec = dayRecord.records.find(r => r.studentId === student.id);
                    if (rec && isAbsentOrLeaveStatus(rec.status)) {
                        streak++;
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    break;
                }

                if (streak >= 2) {
                    rows.push({ name: getStudentLineName(student), days: streak });
                }
            });

            if (rows.length === 0) return '';

            return `🔁 ขาด/ลาต่อเนื่อง:
${sortContinuousRows(rows)
                .map(row => `- ${row.name} ${row.days} วันติด`)
                .join('\n')}`;
        }

        function buildContinuousLateReport(roomId, dateStr, students, currentStatusByStudentId) {
            const attendanceList = state.roomData?.[roomId]?.attendance || [];
            const attendanceByDate = new Map(attendanceList.map(day => [day.date, day]));
            const rows = [];

            students.forEach(student => {
                if (student.isTransferred && dateStr >= student.transferDate) return;

                const todayStatus = currentStatusByStudentId?.[student.id];
                if (!isLateStatus(todayStatus)) return;

                let streak = 1;
                let checkDate = getPreviousDateString(dateStr);
                let guard = 0;

                while (guard < 90) {
                    guard++;

                    if (!isCountableAttendanceDay(checkDate, roomId)) {
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    const dayRecord = attendanceByDate.get(checkDate);
                    if (!dayRecord || !Array.isArray(dayRecord.records)) break;

                    const rec = dayRecord.records.find(r => r.studentId === student.id);
                    if (rec && isLateStatus(rec.status)) {
                        streak++;
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    break;
                }

                if (streak >= 2) {
                    rows.push({ name: getStudentLineName(student), days: streak });
                }
            });

            if (rows.length === 0) return '';

            return `⚠️ สายต่อเนื่อง:
${sortContinuousRows(rows)
                .map(row => `- ${row.name} ${row.days} วันติด`)
                .join('\n')}`;
        }

        function getLastStudentAttendanceRecord(records, studentId) {
            const matched = (records || []).filter(r => r && r.studentId === studentId);
            return matched.length > 0 ? matched[matched.length - 1] : null;
        }

        function getTopArrivalIdsFromRecords(records) {
            // กันข้อมูลนักเรียนคนเดิมซ้ำในวันเดียวกัน โดยยึดรายการสุดท้ายของคนนั้น
            const latestByStudentId = new Map();
            (records || []).forEach(r => {
                if (r && r.studentId) latestByStudentId.set(r.studentId, r);
            });

            return Array.from(latestByStudentId.values())
                .filter(r => isPresentOrLateStatus(r.status) && r.time && r.time !== '-')
                .sort((a, b) => String(a.time).localeCompare(String(b.time)))
                .slice(0, 3)
                .map(r => r.studentId);
        }

        function buildFastTop3ContinuousReport(roomId, dateStr, students, currentStatusByStudentId, currentTimeByStudentId) {
            const attendanceList = state.roomData?.[roomId]?.attendance || [];
            const attendanceByDate = new Map();

            // บางครั้งฐานข้อมูลอาจมีเอกสารวันเดียวกันมากกว่า 1 รายการ
            // จึงเก็บทุกฉบับไว้ตรวจ เพื่อไม่ให้ข้อมูลเก่าที่เคยเป็น "มาเรียน" กลบวันที่ลา/ขาด
            attendanceList.forEach(day => {
                if (!day?.date) return;
                const sameDateRecords = attendanceByDate.get(day.date) || [];
                sameDateRecords.push(day);
                attendanceByDate.set(day.date, sameDateRecords);
            });

            const todayRecords = students
                .filter(student => !(student.isTransferred && dateStr >= student.transferDate))
                .map(student => ({
                    studentId: student.id,
                    status: currentStatusByStudentId?.[student.id],
                    time: currentTimeByStudentId?.[student.id] || '-'
                }));

            const todayTopIds = getTopArrivalIdsFromRecords(todayRecords);
            if (todayTopIds.length === 0) return '';

            const rows = [];

            todayTopIds.forEach((studentId, rankIndex) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;

                let streak = 1;
                let checkDate = getPreviousDateString(dateStr);
                let guard = 0;

                while (guard < 90) {
                    guard++;

                    if (!isCountableAttendanceDay(checkDate, roomId)) {
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    const sameDateRecords = attendanceByDate.get(checkDate);
                    if (!sameDateRecords || sameDateRecords.length === 0) break;

                    let isContinuousTop3 = true;

                    for (const dayRecord of sameDateRecords) {
                        if (!dayRecord || !Array.isArray(dayRecord.records)) {
                            isContinuousTop3 = false;
                            break;
                        }

                        const studentRecord = getLastStudentAttendanceRecord(dayRecord.records, studentId);

                        // ขาด ลา ป่วย ไม่มีเวลา หรือไม่มีข้อมูลในวันนั้น ให้ตัดการต่อเนื่องทันที
                        if (
                            !studentRecord ||
                            !isPresentOrLateStatus(studentRecord.status) ||
                            !studentRecord.time ||
                            studentRecord.time === '-'
                        ) {
                            isContinuousTop3 = false;
                            break;
                        }

                        const topIds = getTopArrivalIdsFromRecords(dayRecord.records);
                        if (!topIds.includes(studentId)) {
                            isContinuousTop3 = false;
                            break;
                        }
                    }

                    if (isContinuousTop3) {
                        streak++;
                        checkDate = getPreviousDateString(checkDate);
                        continue;
                    }

                    break;
                }

                if (streak >= 2) {
                    rows.push({ name: getStudentLineName(student), days: streak, rank: rankIndex + 1 });
                }
            });

            if (rows.length === 0) return '';

            return `🏆 TOP 3 ต่อเนื่อง:
${rows
                .sort((a, b) => a.rank - b.rank)
                .map(row => `- ${row.name} ${row.days} วันติด`)
                .join('\n')}`;
        }
        function getAdvanceCheckStatus(targetDateStr) {
            const today = getTodayString();
            if (targetDateStr <= today) return { allowed: true };

            const s = state.settings;
            let termEnd = null;
            if (targetDateStr >= s.term1Start && targetDateStr <= s.term1End) termEnd = s.term1End;
            else if (targetDateStr >= s.term2Start && targetDateStr <= s.term2End) termEnd = s.term2End;

            if (!termEnd) return { allowed: false, msg: 'อยู่นอกภาคเรียน' };

            const msPerDay = 1000*60*60*24;
            const diffDays = (parseDateLocal(termEnd) - parseDateLocal(today)) / msPerDay;
            
            if (diffDays <= s.advanceCheckDays && targetDateStr <= termEnd) {
                return { allowed: true };
            }
            return { allowed: false, msg: `ล่วงหน้าได้ ${s.advanceCheckDays} วันสุดท้ายของเทอม` };
        }

        // 🐷 วันเริ่มต้นรายงานออมเงิน ให้ยึดวันเปิดภาคเรียนที่ 1 ของปีการศึกษาปัจจุบัน
        function getSavingsDefaultStartDate() {
            return state.settings?.term1Start || DEFAULT_SETTINGS.term1Start || getTodayString();
        }




        // 🤖 ตรวจว่าถึงเวลาส่ง LINE ที่ตั้งไว้แล้วหรือยัง
        function hasAutoLineSendTimePassed(dateStr, timeText) {
            if (!dateStr || !timeText || !timeText.includes(':')) return false;
            const today = getTodayString();
            if (dateStr < today) return true;
            if (dateStr > today) return false;

            const [h, m] = timeText.split(':').map(Number);
            if (Number.isNaN(h) || Number.isNaN(m)) return false;

            const now = new Date();
            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            const sendMinutes = h * 60 + m;
            return nowMinutes > sendMinutes;
        }

        // 🤖 ถ้าภาพล่าสุดถูกสร้างแล้ว สำหรับวัน/เวลานี้ และยังไม่เลยเวลา ให้ซ่อนปุ่ม "สร้างภาพล่าสุด"
        function shouldHideCreateLatestLineButton(roomId, dateStr, sendTime) {
            const prepared = state.settings?.lineLatestPreparedMap?.[roomId];
            if (!prepared) return false;
            if (prepared.date !== dateStr) return false;
            if (prepared.sendTime !== sendTime) return false;
            return !hasAutoLineSendTimePassed(dateStr, sendTime);
        }

        // 2. ดึงข้อมูล Settings และ Classrooms ตามปีการศึกษาที่เลือกอยู่

        // ฟังก์ชันช่วยคำนวณและบันทึกยอดสรุปลง Database ส่วนกลาง (ทำงานเบื้องหลัง)
        async function updateRoomSummaryDB(roomId) {
            const stds = state.roomData[roomId]?.students || [];
            const atts = state.roomData[roomId]?.attendance || [];
            let m = 0, f = 0, p = 0, a = 0, l = 0, sick = 0, t = 0;
            let activeStds = 0; // 🌟 เพิ่มตัวนับเฉพาะนักเรียนปัจจุบัน
            
            stds.forEach(s => {
                if (s.isTransferred) return; // 🌟 ข้ามเด็กย้ายออก ไม่เอามานับยอด
                activeStds++;
                let name = (s.name || '').trim();
                if(name.startsWith('เด็กชาย') || name.startsWith('นาย') || name.startsWith('ด.ช.')) m++;
                else f++;
            });
            atts.forEach(day => {
                day.records.forEach(r => {
                    if (r.status === 'present' || r.status === 'late') p++;
                    else if (r.status === 'absent') a++;
                    else if (r.status && (r.status === 'sick' || r.status.includes('sick'))) sick++;
                    else if (r.status && (r.status === 'leave' || r.status.includes('leave') || r.status === 'other')) l++;
                    t++;
                });
            });

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `summary_${state.activeYear}`, 'all_rooms'), {
                    // 🌟 เปลี่ยนจาก stds.length เป็น activeStds
                    [roomId]: { m, f, totalStds: activeStds, p, a, l, s: sick, totalAtt: t, recordedDays: atts.length }
                }, { merge: true });
            } catch(e) { console.error('Summary update error:', e); }
        }

                if (cls && (!cls.recordedDates || cls.recordedDates.join(',') !== recordedDates.join(','))) {
                    updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `classrooms_${state.activeYear}`, roomId), { recordedDates });

                if (state.activeClassroomId === roomId) {
                    loadAttendanceRecords();
                    state.savedScrollY = window.scrollY; // 🌟 ระงับกะพริบ
                    state.skipAnimation = true;
                    render();
                } else if (state.activeScreen === 'summary' || state.activeScreen === 'public_summary') {
                    state.savedScrollY = window.scrollY; // 🌟 ระงับกะพริบ
                    state.skipAnimation = true;

            const savingsUnsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `savings_${state.activeYear}_${roomId}`), (snap) => {
                state.roomData[roomId].savings = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => new Date(b.date) - new Date(a.date));
                if (state.activeClassroomId === roomId && state.activeClassroomModule === 'savings') {
                    state.savedScrollY = window.scrollY;
                    state.skipAnimation = true;
                    render();
                }
            });

            roomUnsubscribers[roomId].push(stdUnsub, attUnsub, savingsUnsub);

            if (!studentId || !roomId || !dateStr) return;
            loadSavingsDraftsFromSession();
            const key = getSavingsDraftKey(roomId, dateStr);
            state.savingsDrafts[key] = state.savingsDrafts[key] || {};
            state.savingsDrafts[key][studentId] = { ...(state.savingsDrafts[key][studentId] || {}), ...patch };
            saveSavingsDraftsToSession();
        }

        function clearSavingsDraft(roomId = state.activeClassroomId, dateStr = state.savingsDate || getTodayString()) {
            loadSavingsDraftsFromSession();
            const key = getSavingsDraftKey(roomId, dateStr);
            if (state.savingsDrafts && state.savingsDrafts[key]) {
                delete state.savingsDrafts[key];
                saveSavingsDraftsToSession();
            }
        }

        function closeAllModals() {
            document.getElementById('modal-root').innerHTML = '';
        }

        // 🎛️ จุดปรับตำแหน่งภาพแชร์บันทึกการมาเรียน / ภาพจาก LINE bot
        // เลขบวก = ขยับลง, เลขลบ = ขยับขึ้น
        const attendanceShareLayout = {
            dateTextShiftY: -15 // ขยับตัวหนังสือวันที่ในกรอบ “ประจำวัน...” ขึ้น/ลงแบบอิสระ
        };

        window.app = {

            // 🤖 เปิด/ปิด ส่ง LINE อัตโนมัติของห้องนี้
            toggleAutoLineSend: async (roomId, enabled) => {
                if (!roomId) return;

                const lineToken = state.settings?.lineTokens?.[roomId];
                const lineGroupId = state.settings?.lineGroups?.[roomId];
                const sendTime = state.settings?.lineAutoSendTimeMap?.[roomId] || '16:30';

                if (enabled && (!lineToken || !lineGroupId)) {
                    render();
                    return showToast('ยังไม่ได้ตั้งค่า Token หรือ Group ID สำหรับห้องนี้', 'error');
                }

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', state.activeYear), {
                        [`lineAutoSendEnabledMap.${roomId}`]: enabled
                    });

                    await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'saveAutoLineSetting',
                            year: state.activeYear,
                            roomId: roomId,
                            enabled: enabled,
                            sendTime: sendTime,
                            targetId: lineGroupId,
                            channelToken: lineToken
                        })
                    });

                    showToast(enabled ? 'เปิดส่ง LINE อัตโนมัติแล้ว' : 'ปิดส่ง LINE อัตโนมัติแล้ว', 'success');

                } catch (e) {
                    console.error(e);
                    showToast('บันทึกการตั้งค่า LINE อัตโนมัติไม่สำเร็จ', 'error');
                }
            },

            // 🤖 บันทึกเวลาส่ง LINE อัตโนมัติของห้องนี้
            updateAutoLineSendTime: async (roomId, timeText) => {
                if (!roomId || !timeText) return;

                const lineToken = state.settings?.lineTokens?.[roomId];
                const lineGroupId = state.settings?.lineGroups?.[roomId];
                const enabled = state.settings?.lineAutoSendEnabledMap?.[roomId] || false;

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', state.activeYear), {
                        [`lineAutoSendTimeMap.${roomId}`]: timeText
                    });

                    await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'saveAutoLineSetting',
                            year: state.activeYear,
                            roomId: roomId,
                            enabled: enabled,
                            sendTime: timeText,
                            targetId: lineGroupId,
                            channelToken: lineToken
                        })
                    });

                    showToast(`ตั้งเวลาส่ง LINE อัตโนมัติเป็น ${timeText} แล้ว`, 'success');

                } catch (e) {
                    console.error(e);
                    showToast('บันทึกเวลาส่ง LINE อัตโนมัติไม่สำเร็จ', 'error');
                }
            },

            // 🤖 บันทึกสถานะว่าได้สร้างภาพล่าสุดสำหรับวัน/เวลานี้แล้ว
            markLineImagePrepared: async (roomId, sendTime) => {
                if (!roomId) return;
                const preparedData = {
                    date: state.attendanceDate,
                    sendTime: sendTime || state.settings?.lineAutoSendTimeMap?.[roomId] || '16:30',
                    preparedAt: new Date().toISOString()
                };

                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', state.activeYear), {
                    [`lineLatestPreparedMap.${roomId}`]: preparedData
                });

                state.settings.lineLatestPreparedMap = state.settings.lineLatestPreparedMap || {};
                state.settings.lineLatestPreparedMap[roomId] = preparedData;
            },

            // 🤖 ฟังก์ชันส่งรูปและข้อความเข้า Line (LINE Messaging API)
// ✅ เวอร์ชันปรับภาพให้เหมือน "แชร์รูปภาพ"
triggerLineBotCheck: async (mode = 'sendNow', options = {}) => {
    const isSaveOnly = mode === 'saveOnly';
    const silent = options?.silent === true;
    const notifyLineBot = (message, type = 'success') => {
        if (!silent) showToast(message, type);
    };

    if (!silent) {
        toggleLoading(true);
        notifyLineBot(isSaveOnly ? '🤖 กำลังสร้างภาพล่าสุดสำหรับส่ง LINE อัตโนมัติ...' : '🤖 บอทกำลังสร้างภาพและส่งเข้าไลน์ กรุณารอสักครู่...', 'success');
    }

    const roomId = state.activeClassroomId;
    const lineToken = state.settings?.lineTokens?.[roomId];
    const lineGroupId = state.settings?.lineGroups?.[roomId];

    if (!lineToken || !lineGroupId) {
        if (!silent) toggleLoading(false);
        return notifyLineBot('ยังไม่ได้ตั้งค่า Token หรือ Group ID สำหรับห้องนี้', 'error');
    }

    // 🤖 กันไม่ให้สร้าง/ส่ง LINE ในวันที่ไม่สามารถเช็คชื่อได้จริง
    const lineDayInfo = getAttendanceDayInfo(state.attendanceDate, roomId);
    const lineAdvStatus = getAdvanceCheckStatus(state.attendanceDate);
    if (lineDayInfo.status === 'outside' || !lineDayInfo.isSchoolDay || !lineAdvStatus.allowed) {
        if (!silent) toggleLoading(false);
        return notifyLineBot('วันนี้ไม่สามารถเช็คชื่อได้ ระบบจะไม่สร้างหรือส่ง LINE', 'error');
    }

    const cls = state.classrooms.find(c => c.id === roomId) || PREDEFINED_CLASSES.find(c => c.id === roomId);
    const isGeoMode = state.settings?.geoCheckIn?.[roomId] || false;
    const rawDateStr = new Date(state.attendanceDate).toLocaleDateString('th-TH', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
});

const dateStr = rawDateStr.replace('ที่ ', ' ที่ ');

    const shortRoomName = cls.name
        .replace('อนุบาล ', 'อ.')
        .replace('ประถมศึกษาปีที่ ', 'ป.')
        .replace('มัธยมศึกษาปีที่ ', 'ม.');

    // 1) ดึงและคำนวณสถานะนักเรียนให้เหมือน exportAttendanceImage()
    const list = getProcessedStudents();
    let groups = { present: [], late: [], absent: [], leave: [], sick: [] };
    let pCount = 0, lCount = 0, aCount = 0, leaveCount = 0, sickCount = 0;
    const currentStatusByStudentId = {};
    const currentTimeByStudentId = {};

    list.forEach(s => {
        if (s.isTransferred && state.attendanceDate >= s.transferDate) return;

        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === s.id) : null;
        const manualStatus = rosterItem ? rosterItem.manualStatus : null;
        const manualStatusDate = rosterItem ? rosterItem.manualStatusDate : null;

        let defaultStatus = s.isRegularlyAbsent ? 'absent' : 'present';
        if (s.transferInDate && state.attendanceDate < s.transferInDate) defaultStatus = 'present';

        let geoLeaveStatus = null;
        if (manualStatus && manualStatusDate === state.attendanceDate) {
            if (manualStatus.includes('sick')) geoLeaveStatus = 'sick';
            else if (manualStatus.includes('leave') || manualStatus === 'other') geoLeaveStatus = 'leave';
            else if (manualStatus === 'on_time') geoLeaveStatus = 'present';
        }

        let geoCheckInStatus = null;
        let geoCheckInTime = null;

        if (rosterItem && rosterItem.assignedUid && window.app.geoUsersData) {
            const geoUser = window.app.geoUsersData.find(u => u.id === rosterItem.assignedUid);

            if (geoUser && geoUser.checkedIn && geoUser.checkInDate === state.attendanceDate) {
                if (geoUser.status === 'on_time') geoCheckInStatus = 'present';
                else if (geoUser.status === 'absent') geoCheckInStatus = 'absent';
                else if (geoUser.status && geoUser.status.includes('late')) geoCheckInStatus = 'late';

                if (geoUser.checkInTime) {
                    const rawDate = geoUser.checkInTime.toDate ? geoUser.checkInTime.toDate() : new Date(geoUser.checkInTime);
                    geoCheckInTime = `${String(rawDate.getHours()).padStart(2, '0')}:${String(rawDate.getMinutes()).padStart(2, '0')}`;
                }
            }
        }

        if (geoLeaveStatus) defaultStatus = geoLeaveStatus;
        else if (geoCheckInStatus) defaultStatus = geoCheckInStatus;
        else if (isGeoMode) {
            const lateTime = state.geoLateTime || state.settings?.lateTime || '07:30';
            const [lateH, lateM] = lateTime.split(':').map(Number);
            const unlockDateObj = new Date();
            unlockDateObj.setHours(lateH, lateM + 26, 0, 0);

            const now = new Date();
            const isPastUnlockTime =
                state.attendanceDate < getTodayString() ||
                (state.attendanceDate === getTodayString() && now >= unlockDateObj);

            defaultStatus = isPastUnlockTime ? 'absent' : 'pending';
        }

        const finalStatus = state.records[s.id] || defaultStatus;
        currentStatusByStudentId[s.id] = finalStatus;

        let savedTime = geoCheckInTime;
        if (!savedTime) {
            const existingRecord = (state.roomData[state.activeClassroomId]?.attendance || [])
                .find(a => a.date === state.attendanceDate);
            const exRec = existingRecord ? existingRecord.records.find(r => r.studentId === s.id) : null;
            if (exRec && exRec.time) savedTime = exRec.time;
        }

        const studentWithTime = { ...s, timeStr: savedTime || '-' };
        currentTimeByStudentId[s.id] = savedTime || '-';

        if (finalStatus === 'present' || finalStatus === 'on_time') {
            pCount++;
            groups.present.push(studentWithTime);
        } else if (finalStatus === 'late') {
            lCount++;
            groups.late.push(studentWithTime);
        } else if (finalStatus === 'absent') {
            aCount++;
            groups.absent.push(studentWithTime);
        } else if (finalStatus === 'leave' || finalStatus === 'personal_leave') {
            leaveCount++;
            groups.leave.push(studentWithTime);
        } else if (finalStatus === 'sick' || finalStatus === 'sick_leave') {
            sickCount++;
            groups.sick.push(studentWithTime);
        } else if (finalStatus === 'pending') {
            aCount++;
            groups.absent.push(studentWithTime);
        }
    });

    // ถ้าทุกคนปกติ ไม่ต้องสร้างภาพและไม่ต้องส่ง LINE ทั้งโหมดส่งทันทีและโหมดสร้างภาพล่าสุด
    const isAllNormal = lCount === 0 && aCount === 0 && leaveCount === 0 && sickCount === 0;
    if (isAllNormal) {
        if (!silent) toggleLoading(false);
        return notifyLineBot('🎉 มาเรียนตรงเวลาครบทุกคน บอทจะไม่ทำงานครับ', 'success');
    }

    // 2) จัดอันดับเวลาเข้าเรียน เหมือน exportAttendanceImage()
    let topArrivalIds = [];
    if (isGeoMode) {
        let attendees = [...groups.present, ...groups.late].filter(s => s.timeStr !== '-');
        attendees.sort((a, b) => a.timeStr.localeCompare(b.timeStr));
        topArrivalIds = attendees.slice(0, 3).map(s => s.id);

        groups.present.sort((a, b) => a.timeStr.localeCompare(b.timeStr));
        groups.late.sort((a, b) => a.timeStr.localeCompare(b.timeStr));
    }

    // 3) ข้อความรายงาน LINE
    const totalActive = pCount + lCount + aCount + leaveCount + sickCount;
    const percentText = (value, total) => total > 0 ? ((value / total) * 100).toFixed(2) : '0.00';
    const statusLines = [];

    if (isGeoMode) {
        statusLines.push(`✅ มาตรงเวลา: ${pCount} คน`);
        statusLines.push(`⚠️ มาสาย: ${lCount} คน`);
        statusLines.push(`❌ ขาดเรียน: ${aCount} คน`);
        statusLines.push(`📅 ลากิจ: ${leaveCount} คน`);
        statusLines.push(`🤒 ลาป่วย: ${sickCount} คน`);
    } else {
        const attendCount = pCount + lCount;
        statusLines.push(`✅ มาเรียน: ${attendCount} คน`);
        statusLines.push(`❌ ขาดเรียน: ${aCount} คน`);
        statusLines.push(`📅 ลากิจ: ${leaveCount} คน`);
        statusLines.push(`🤒 ลาป่วย: ${sickCount} คน`);
    }

    const normalCount = pCount + lCount;
    const issueCount = aCount + leaveCount + sickCount;
    const percentLines = [
        `- มาเรียน: ${percentText(normalCount, totalActive)}%`,
        `- ขาด/ลา: ${percentText(issueCount, totalActive)}%`
    ];

    const timeLines = [];
    if (isGeoMode) {
        const arrivalTimes = [...groups.present, ...groups.late]
            .map(s => s.timeStr)
            .filter(t => t && t !== '-')
            .sort((a, b) => a.localeCompare(b));

        if (arrivalTimes.length > 0) {
            timeLines.push(`🐎 เร็วสุด: ${arrivalTimes[0]} น.`);
        }

        const lateTimes = groups.late
            .map(s => s.timeStr)
            .filter(t => t && t !== '-')
            .sort((a, b) => a.localeCompare(b));

        if (lateTimes.length > 0) {
            timeLines.push(`🐢 สายสุด: ${lateTimes[lateTimes.length - 1]} น.`);
        }
    }

    const fastTop3ContinuousLines = isGeoMode ? buildFastTop3ContinuousReport(roomId, state.attendanceDate, list, currentStatusByStudentId, currentTimeByStudentId) : '';
    const lateContinuousLines = buildContinuousLateReport(roomId, state.attendanceDate, list, currentStatusByStudentId);
    const continuousLines = buildContinuousAbsentLeaveReport(roomId, state.attendanceDate, list, currentStatusByStudentId);

    const textMessage = [
        `📢 รายงานการมาเรียน ${shortRoomName}
ประจำ${dateStr}`,
        statusLines.join('\n'),
        percentLines.join('\n'),
        timeLines.join('\n'),
        fastTop3ContinuousLines,
        lateContinuousLines,
        continuousLines,
        `(ตรวจสอบรายชื่อในรูปภาพด้านล่างครับ 👇)`
    ].filter(Boolean).join('\n\n');


    // 4) สร้างภาพ HTML ให้เหมือนปุ่มแชร์รูปภาพ
    const container = document.createElement('div');

    container.style.cssText =
        'position: fixed; top: -10000px; left: -10000px; width: 1080px; background-color: #f9fafb; font-family: "Kanit", sans-serif; z-index: -1;';

    const getZoneHtml = (title, count, students, bgColor, textColor, borderColor) => {
        if (count === 0) return '';

        const stdBoxes = students.map(std => {
            let currentBg = bgColor;
            let currentText = textColor;
            let currentBorder = borderColor;
            let medalPrefix = '';

            if (isGeoMode && topArrivalIds.includes(std.id)) {
                const rank = topArrivalIds.indexOf(std.id) + 1;

                if (rank === 1) {
                    currentBg = 'bg-amber-50';
                    currentText = 'text-amber-700';
                    currentBorder = 'border-amber-400';
                    medalPrefix = '🥇 ';
                } else if (rank === 2) {
                    currentBg = 'bg-slate-50';
                    currentText = 'text-slate-700';
                    currentBorder = 'border-slate-400';
                    medalPrefix = '🥈 ';
                } else if (rank === 3) {
                    currentBg = 'bg-orange-50';
                    currentText = 'text-orange-800';
                    currentBorder = 'border-orange-400';
                    medalPrefix = '🥉 ';
                }

                return `
                    <div class="px-4 py-6 rounded-2xl border-2 ${currentBg} ${currentBorder} ${currentText} text-center font-black shadow-sm flex flex-col justify-center items-center min-h-[130px] overflow-hidden">
                        <div class="w-full text-4xl leading-tight pb-1 relative top-[-14px]">
                            ${medalPrefix}${std.first}
                        </div>
                        <div class="w-full flex justify-center items-center text-[1.4rem] opacity-85 gap-1.5 relative top-[-12px]">
                            ⏰ ${std.timeStr}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="px-6 py-5 rounded-2xl border-2 ${currentBg} ${currentBorder} ${currentText} text-center font-black text-4xl truncate shadow-sm">
                    <span class="relative top-[-16px]">${medalPrefix}${std.first}</span>
                </div>
            `;
        }).join('');

        return `
            <div class="mb-10 w-full">
                <div class="flex items-baseline gap-4 mb-6 border-b-2 border-gray-100 pb-3">
                    <h2 class="text-[2.5rem] font-black ${textColor} leading-none">${title}</h2>
                    <span class="text-3xl font-bold text-gray-700 leading-none">${count} คน</span>
                </div>
                <div class="grid grid-cols-3 gap-6 w-full">
                    ${stdBoxes}
                </div>
            </div>
        `;
    };

    container.innerHTML = `
        <div class="w-full flex flex-col p-12 relative overflow-hidden bg-gradient-to-b from-blue-50 to-white">

            <div class="bg-white p-10 rounded-[3rem] shadow-md border border-gray-100 flex flex-col justify-center items-center text-center mb-12 relative z-10 gap-4">
                <h1 class="text-[3.5rem] font-black text-[#2563eb] leading-tight">บันทึกการมาเรียนชั้น ${shortRoomName}</h1>
                <p class="text-3xl font-bold text-gray-500 bg-gray-100 w-max px-6 py-2 rounded-xl"><span style="display:inline-block; transform: translateY(${attendanceShareLayout.dateTextShiftY}px);">ประจำ${dateStr}</span></p>
            </div>

            <div class="grid ${isGeoMode ? 'grid-cols-5' : 'grid-cols-4'} gap-6 mb-12 relative z-10">

                ${isGeoMode ? `
                    <div class="bg-emerald-50 rounded-[2rem] p-6 border-2 border-emerald-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                        <div class="flex flex-col items-center relative top-[-15px]">
                            <span class="text-2xl font-bold text-emerald-600 mb-2">มาตรงเวลา</span>
                            <span class="text-[3.5rem] font-black text-emerald-700 leading-none">${pCount}</span>
                        </div>
                    </div>

                    <div class="bg-yellow-50 rounded-[2rem] p-6 border-2 border-yellow-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                        <div class="flex flex-col items-center relative top-[-15px]">
                            <span class="text-2xl font-bold text-yellow-600 mb-2">มาสาย</span>
                            <span class="text-[3.5rem] font-black text-yellow-700 leading-none">${lCount}</span>
                        </div>
                    </div>
                ` : `
                    <div class="bg-emerald-50 rounded-[2rem] p-6 border-2 border-emerald-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                        <div class="flex flex-col items-center relative top-[-15px]">
                            <span class="text-2xl font-bold text-emerald-600 mb-2">มาเรียน</span>
                            <span class="text-[3.5rem] font-black text-emerald-700 leading-none">${pCount + lCount}</span>
                        </div>
                    </div>
                `}

                <div class="bg-red-50 rounded-[2rem] p-6 border-2 border-red-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                    <div class="flex flex-col items-center relative top-[-15px]">
                        <span class="text-2xl font-bold text-red-600 mb-2">ขาดเรียน</span>
                        <span class="text-[3.5rem] font-black text-red-700 leading-none">${aCount}</span>
                    </div>
                </div>

                <div class="bg-blue-50 rounded-[2rem] p-6 border-2 border-blue-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                    <div class="flex flex-col items-center relative top-[-15px]">
                        <span class="text-2xl font-bold text-blue-600 mb-2">ลากิจ</span>
                        <span class="text-[3.5rem] font-black text-blue-700 leading-none">${leaveCount}</span>
                    </div>
                </div>

                <div class="bg-orange-50 rounded-[2rem] p-6 border-2 border-orange-200 flex flex-col items-center justify-center text-center shadow-sm min-h-[170px]">
                    <div class="flex flex-col items-center relative top-[-15px]">
                        <span class="text-2xl font-bold text-orange-600 mb-2">ลาป่วย</span>
                        <span class="text-[3.5rem] font-black text-orange-700 leading-none">${sickCount}</span>
                    </div>
                </div>

            </div>

            <div class="bg-white rounded-[3rem] p-10 shadow-sm border border-gray-100 flex flex-col relative z-10">

                ${isGeoMode
                    ? getZoneHtml('มาตรงเวลา', pCount, groups.present, 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200')
                    : getZoneHtml('มาเรียน', pCount + lCount, [...groups.present, ...groups.late], 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200')
                }

                ${isGeoMode
                    ? getZoneHtml('มาสาย', lCount, groups.late, 'bg-yellow-50', 'text-yellow-700', 'border-yellow-300')
                    : ''
                }

                ${getZoneHtml('ขาดเรียน', aCount, groups.absent, 'bg-red-50', 'text-red-700', 'border-red-200')}
                ${getZoneHtml('ลากิจ', leaveCount, groups.leave, 'bg-blue-50', 'text-blue-700', 'border-blue-200')}
                ${getZoneHtml('ลาป่วย', sickCount, groups.sick, 'bg-orange-50', 'text-orange-700', 'border-orange-200')}

                ${totalActive === 0
                    ? '<div class="w-full text-center py-20 text-3xl font-bold text-gray-400">ยังไม่มีรายชื่อนักเรียนในวันนี้</div>'
                    : ''
                }

            </div>
        </div>
    `;

    document.body.appendChild(container);

    await new Promise(resolve => setTimeout(resolve, 500));

    try {
        const canvas = await html2canvas(container, {
            scale: 2.5,
            useCORS: true,
            backgroundColor: '#f9fafb'
        });

        const base64Image = canvas.toDataURL('image/png').split(',')[1];

        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: isSaveOnly ? 'saveLatestLineImage' : 'sendLineReport',
                year: state.activeYear,
                roomId: roomId,

ประจำ${dateStr}`,

                ].filter(Boolean).join('\n\n');

                const copyText = async (value) => {
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(value);
                            return true;
                        }
                        const textarea = document.createElement('textarea');
                        textarea.value = value;
                        textarea.setAttribute('readonly', '');
                        textarea.style.position = 'fixed';
                        textarea.style.left = '-9999px';
                        document.body.appendChild(textarea);
                        textarea.focus();
                        textarea.select();
                        const ok = document.execCommand('copy');
                        document.body.removeChild(textarea);
                        return ok;
                    } catch (err) {
                        console.warn('Copy bot reply command failed:', err);
                        return false;
                    }
                };

                                    <label class="block text-sm font-bold text-gray-700 mb-2">เดือนที่ต้องการส่งออก</label>
                                    <input type="month" id="monthlyReportMonth" value="${selectedMonth}" max="${currentMonth}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-base font-semibold focus:ring-2 focus:ring-red-200 focus:outline-none">
                                    <p class="text-xs text-gray-500 mt-2">เลือกได้ถึงเดือนปัจจุบันเท่านั้น หรือกดส่งออกทุกเดือนเพื่อรวมทุกเดือนที่มีข้อมูลในไฟล์เดียว</p>
                                </div>
                                <div class="flex flex-col gap-3 pt-2">
                                    <button type="button" onclick="app.exportMonthlyReportPdf(document.getElementById('monthlyReportMonth').value)" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-2xl transition-colors shadow-sm">ส่งออกเดือนที่เลือก</button>
                                    <button type="button" onclick="app.exportAllMonthlyReportPdfs()" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-2xl transition-colors shadow-sm">ส่งออกทุกเดือนในครั้งเดียว</button>
                                    <button type="button" onclick="app.closeModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl transition-colors">ยกเลิก</button>
