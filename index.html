                        <form onsubmit="app.saveClassroom(event, '${id}')" class="p-6 space-y-6">
                            <div class="bg-gray-50 rounded-2xl p-4 flex items-center gap-4 border border-gray-100">
                                <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-sm ${data.color}">${data.emoji}</div>
                                <div><p class="text-xs text-gray-500 mb-0.5">ห้องเรียน</p><p class="font-semibold text-gray-800">${data.name}</p></div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่านสำหรับให้คุณครูเข้าห้องนี้</label>
                                <input type="text" id="clsPassword" value="${data.password}" placeholder="เช่น 1234" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#3b82f6] transition-all bg-white" required>
                            </div>
                            <div class="pt-4 flex gap-3">
                                <button type="button" onclick="app.closeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl transition-colors">ยกเลิก</button>
                                <button type="submit" class="flex-1 py-3 font-semibold rounded-2xl shadow-sm transition-all text-white bg-[#ec4899] hover:bg-[#d93a86] active:scale-95">บันทึกข้อมูล</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        }

        function renderStudentModal(id = null) {
            const currentStudents = getProcessedStudents();
            const data = id ? currentStudents.find(s => s.id === id) : null;
            
            const formHtml = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${id ? `<div><label class="block text-sm font-medium text-gray-700 mb-1">เลขที่</label><input id="stdNum" value="${data.studentNumber}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]"></div>` : ''}
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">รหัสนักเรียน</label><input id="stdId" value="${data ? (data.studentIdCode || '') : ''}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]"></div>
                    <div class="sm:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">เลขประจำตัวประชาชน</label><input id="natId" value="${data ? (data.nationalId || '') : ''}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]"></div>
                    <div class="sm:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล <span class="text-red-500">*</span></label><input id="stdName" value="${data ? data.fullName : ''}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">วัน/เดือน/ปีเกิด</label><input id="stdDob" value="${data ? (data.dob || '') : ''}" placeholder="01/02/2569" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">ชื่อเล่น</label><input id="stdNick" value="${data ? (data.nickname || '') : ''}" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#3b82f6]"></div>
                    
                    <!-- 🌟 เพิ่มช่องใส่วันที่ย้ายเข้า -->
                    <div class="sm:col-span-2"><label class="block text-sm font-bold text-emerald-600 mb-1">วันที่ย้ายเข้า (ถ้ามี)</label><input type="date" id="stdTransferIn" value="${data ? (data.transferInDate || '') : ''}" class="w-full px-4 py-3 rounded-2xl border border-emerald-200 bg-emerald-50/30 focus:ring-2 focus:ring-emerald-500 text-emerald-700 font-medium cursor-pointer"></div>
                </div>
            `;

            const excelHtml = '';

            const html = `
                <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[50] flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white rounded-[2rem] shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
                        
                        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 shrink-0">
                            <h2 class="text-xl font-bold text-gray-800">${data ? 'แก้ไขข้อมูลนักเรียน' : 'เพิ่มนักเรียน'}</h2>
                            <button type="button" onclick="app.closeModal()" class="p-2 text-gray-400 hover:text-gray-600 bg-white rounded-full shadow-sm"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>

                        <form onsubmit="app.saveStudent(event, '${id || ''}')" class="flex flex-col flex-1 overflow-hidden">
                            
                            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                                ${formHtml}
                                ${excelHtml}
                            </div>
                            
                            <!-- 🌟 เพิ่มแผงจัดการ การย้ายออก (แสดงเฉพาะตอนกดแก้ไขนักเรียนที่มีอยู่แล้ว) -->
                            ${data && !data.isTransferred ? `
                                <div class="px-6 py-4 border-t border-gray-100 bg-red-50/30 flex justify-between items-center shrink-0">
                                    <span class="text-xs font-bold text-red-500">สถานะนักเรียน</span>
                                    <button type="button" onclick="app.handleTransferStudent('${id}', '${data.fullName}')" class="px-4 py-2 bg-white border border-red-200 text-red-600 hover:bg-red-50 rounded-xl text-xs font-bold transition-colors shadow-sm">
                                        <i data-lucide="user-minus" class="w-3.5 h-3.5 inline mb-0.5"></i> ย้ายออก
                                    </button>
                                </div>
                            ` : ''}
                            ${data && data.isTransferred ? `
                                <div class="px-6 py-4 border-t border-gray-100 bg-gray-100 flex justify-between items-center shrink-0">
                                    <span class="text-xs font-bold text-gray-500"><i data-lucide="info" class="w-3.5 h-3.5 inline mb-0.5"></i> ย้ายออกเมื่อ: ${data.transferDate}</span>
                                    <button type="button" onclick="app.handleRestoreStudent('${id}', '${data.fullName}')" class="px-4 py-2 bg-white text-gray-600 hover:bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold transition-colors shadow-sm">
                                        ยกเลิกการย้าย
                                    </button>
                                </div>
                            ` : ''}

                            <div class="p-4 sm:p-6 border-t border-gray-100 bg-gray-50 flex gap-3 shrink-0">
                                <button type="button" onclick="app.closeModal()" class="flex-1 py-3 bg-white border border-gray-200 hover:bg-gray-100 text-gray-700 font-semibold rounded-xl transition-colors">ยกเลิก</button>
                                <button type="submit" ${data && data.isTransferred ? 'disabled class="flex-1 py-3 font-semibold rounded-xl text-white bg-gray-400 opacity-50 cursor-not-allowed"' : 'class="flex-1 py-3 font-semibold rounded-xl shadow-sm transition-all text-white bg-[#3b82f6] hover:bg-[#2563eb] active:scale-95"'}>บันทึกข้อมูล</button>
                            </div>

                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        }

        function renderPromptModal(type, dataStr) {
            // 🌟 จัดกลุ่มว่าคำสั่งไหนใช้ตัวอักษรไหน
            let isD = (type === 'delete' || type === 'delete_student' || type === 'delete_savings');
            let isReset = (type === 'reset' || type === 'clear_room');
            let expectedChar = isD ? 'D' : (isReset ? 'RESET' : 'E');
            
            let title = isD ? 'ยืนยันการลบข้อมูล' : 
                        type === 'reset' ? `ยืนยันการล้างระบบ ปี ${state.activeYear}` : 
                        type === 'clear_room' ? 'ยืนยันการล้างข้อมูลห้องเรียน' : 
                        'ยืนยันการแก้ไขข้อมูล';
            
            // 🌟 แยกข้อความอธิบายให้ชัดเจน
            let desc = '';
            if (type === 'delete') desc = 'พิมพ์ตัวอักษร D ลงในช่องด้านล่างเพื่อยืนยันการลบประวัติการเช็คชื่อของวันนี้';
            else if (type === 'delete_savings') desc = 'พิมพ์ตัวอักษร D ลงในช่องด้านล่างเพื่อยืนยันการลบประวัติออมเงินของวันนี้';
            else if (type === 'delete_student') desc = 'พิมพ์ตัวอักษร D ลงในช่องด้านล่างเพื่อยืนยันการลบรายชื่อนักเรียนคนนี้';
            else if (type === 'reset') desc = `พิมพ์คำว่า RESET ลงในช่องด้านล่างเพื่อยืนยันการลบข้อมูลทุกห้องของปีการศึกษา ${state.activeYear}`;
            else if (type === 'clear_room') desc = 'พิมพ์คำว่า RESET ลงในช่องด้านล่างเพื่อยืนยันการลบรายชื่อนักเรียนและประวัติเช็คชื่อทั้งหมดของห้องนี้';
            else if (type === 'edit_student') desc = 'พิมพ์ตัวอักษร E ลงในช่องด้านล่างเพื่อเข้าสู่โหมดแก้ไขข้อมูลนักเรียน';
            else if (type === 'edit_savings') desc = 'พิมพ์ตัวอักษร E ลงในช่องด้านล่างเพื่อเข้าสู่โหมดแก้ไขออมเงินของวันนี้';
            else desc = 'พิมพ์ตัวอักษร E ลงในช่องด้านล่างเพื่อเข้าสู่โหมดแก้ไขการเช็คชื่อของวันนี้';
            
            let iconBg = (isD || isReset) ? 'bg-red-100 text-red-500' : 'bg-blue-100 text-blue-500';
            let btnBg = (isD || isReset) ? 'bg-[#ef4444] hover:bg-red-600' : 'bg-[#3b82f6] hover:bg-blue-600';
            let maxLength = expectedChar.length;

            const html = `
                <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white rounded-[2rem] shadow-xl w-full max-w-sm p-6 text-center animate-slide-up">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${iconBg}"><i data-lucide="alert-triangle" class="w-8 h-8"></i></div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${title}</h3>
                        <p class="text-gray-500 mb-4 text-sm">${desc}</p>
                        <form onsubmit="app.submitPrompt(event, '${type}', '${expectedChar}', '${dataStr}')">
                            <input type="text" id="promptInput" placeholder="พิมพ์ ${expectedChar} เพื่อยืนยัน" maxlength="${maxLength}" class="w-full px-4 py-3 border border-gray-200 rounded-2xl mb-6 text-center text-xl uppercase font-bold focus:outline-none focus:ring-2 focus:ring-[#3b82f6]" autocomplete="off" autofocus>
                            <div class="flex gap-3">
                                <button type="button" onclick="app.closeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl transition-colors">ยกเลิก</button>
                                <button type="submit" class="flex-1 py-3 text-white font-semibold rounded-2xl shadow-sm transition-all active:scale-95 ${btnBg}">ยืนยัน</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('promptInput').addEventListener('input', function() {
                const btn = this.form.querySelector('button[type="submit"]');
                if(this.value.trim().toUpperCase() === expectedChar) {
                    btn.removeAttribute('disabled');
                    btn.classList.remove('opacity-50');
                } else {
                    btn.setAttribute('disabled', 'true');
                    btn.classList.add('opacity-50');
                }
            });
            document.getElementById('promptInput').dispatchEvent(new Event('input'));
        }

        function renderConfirmModal(title, message, onConfirmCallbackStr) {
            window.app._tempConfirm = async () => {
                closeAllModals();
                await onConfirmCallbackStr();
            };

            const html = `
                <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white rounded-[2rem] shadow-xl w-full max-w-sm p-6 text-center animate-slide-up">
                        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-circle" class="w-8 h-8"></i></div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${title}</h3>
                        <p class="text-gray-500 mb-6">${message}</p>
                        <div class="flex gap-3">
                            <button type="button" onclick="app.closeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl transition-colors">ยกเลิก</button>
                            <button type="button" onclick="app._tempConfirm()" class="flex-1 py-3 bg-[#ef4444] hover:bg-red-600 text-white font-semibold rounded-2xl shadow-sm transition-all active:scale-95">ยืนยัน</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        }

        // Start App
        initApp();

    </script>
</body>
</html>
