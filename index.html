                    const isGeoMode = state.settings?.geoCheckIn?.[state.activeClassroomId] || false;
                    const existing = (state.roomData[state.activeClassroomId]?.attendance || []).find(a => a.date === state.attendanceDate);
                    
                    const shouldNotify = !isAuto && (!existing || !existing.teacherConfirmed);

                    const formatted = studentsList.map(s => {
                        if (s.isTransferred) return null;

                        const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === s.id) : null;
                        const manualStatus = rosterItem ? rosterItem.manualStatus : null;
                        const manualStatusDate = rosterItem ? rosterItem.manualStatusDate : null;

                        // 🌟 ดึงข้อมูลใบลาของเด็กคนนี้ (จากแอป GeoCheck-In) - อัปเดตรองรับทุกสถานะ
                let geoLeaveStatus = null;
                if (manualStatus && manualStatusDate === state.attendanceDate) {
                    if (manualStatus.includes('sick')) geoLeaveStatus = 'sick';
                    else if (manualStatus.includes('leave') || manualStatus === 'other') geoLeaveStatus = 'leave';
                    else if (manualStatus === 'on_time') geoLeaveStatus = 'present';
                }
                        
                        // 🌟 ดึงข้อมูลและเวลาจาก Geo
                        let geoCheckInStatus = null;
                        let geoCheckInTime = null; 
                        if (rosterItem && rosterItem.assignedUid && window.app.geoUsersData) {
                            const geoUser = window.app.geoUsersData.find(u => u.id === rosterItem.assignedUid);
                            if (geoUser && geoUser.checkedIn && geoUser.checkInDate === state.attendanceDate) {
                                if (geoUser.status === 'on_time') geoCheckInStatus = 'present';
                                else if (geoUser.status === 'absent') geoCheckInStatus = 'absent';
                                else if (geoUser.status && geoUser.status.includes('late')) geoCheckInStatus = 'late';
                                
                                if (geoUser.checkInTime) {
                                    const rawDate = geoUser.checkInTime.toDate ? geoUser.checkInTime.toDate() : new Date(geoUser.checkInTime);
                                    geoCheckInTime = `${String(rawDate.getHours()).padStart(2, '0')}:${String(rawDate.getMinutes()).padStart(2, '0')}`;
                                }
                            }
                        }

                        let defaultStatus = s.isRegularlyAbsent ? 'absent' : 'present';
                        
                        if (s.transferInDate && state.attendanceDate < s.transferInDate) {
                            defaultStatus = 'present';
                        } else if (geoLeaveStatus) {
                            defaultStatus = geoLeaveStatus; 
                        } else if (geoCheckInStatus) {
                            defaultStatus = geoCheckInStatus; 
                        } else if (isGeoMode) {
                            const lateTime = state.geoLateTime || state.settings?.lateTime || '07:30'; 
                            const [lateH, lateM] = lateTime.split(':').map(Number);
                            const unlockDateObj = new Date();
                            unlockDateObj.setHours(lateH, lateM + 26, 0, 0);
                            const now = new Date();
                            const isPastUnlockTime = state.attendanceDate < getTodayString() || (state.attendanceDate === getTodayString() && now >= unlockDateObj);
                            defaultStatus = isPastUnlockTime ? 'absent' : 'pending';
                        }
                        
                        const rawStatus = state.records[s.id] || defaultStatus;

                        // 🌟 ใช้เวลาที่ดึงมา หรือใช้เวลาเก่าที่เคยบันทึกไว้
                        let finalTime = geoCheckInTime;
                        if (!finalTime) {
                            const exRec = existing ? existing.records.find(r => r.studentId === s.id) : null;
                            if (exRec && exRec.time) finalTime = exRec.time;
                        }

                        // 🔥 บันทึกเวลาลงไปด้วย!
                        return { studentId: s.id, status: rawStatus, time: finalTime || '-' };
                    }).filter(r => r !== null && r.status !== 'pending');
                    
                    if (existing) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `attendance_${state.activeYear}_${state.activeClassroomId}`, existing.id), { 
                            records: formatted,
                            teacherConfirmed: true 
                        });
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `attendance_${state.activeYear}_${state.activeClassroomId}`), {
                            classroomId: state.activeClassroomId, date: state.attendanceDate, records: formatted, teacherConfirmed: true 
                        });
                    }

                    let countP = 0, countLate = 0, countA = 0, countL = 0, countS = 0;
                    formatted.forEach(r => {
                        if (r.status === 'present') countP++;
                        if (r.status === 'late') {
                            countP++;
                            countLate++;
                        }
                        if (r.status === 'absent') countA++;
                        if (r.status === 'leave') countL++;
                        if (r.status === 'sick') countS++;
                    });
                    
                    const summaryRef = doc(db, 'artifacts', appId, 'public', 'data', `summary_${state.activeYear}`, 'all_rooms');
                    let summaryUpdate = {};
                    
                    if (existing) {
                        let oldP = 0, oldA = 0, oldL = 0, oldS = 0;
                        existing.records.forEach(r => {
                            if (r.status === 'present' || r.status === 'late') oldP++;
                            if (r.status === 'absent') oldA++;
                            if (r.status === 'leave') oldL++;
                            if (r.status === 'sick') oldS++;
                        });
                        summaryUpdate = {
                            [`${state.activeClassroomId}.p`]: increment(countP - oldP),
                            [`${state.activeClassroomId}.a`]: increment(countA - oldA),
                            [`${state.activeClassroomId}.l`]: increment(countL - oldL),
                            [`${state.activeClassroomId}.s`]: increment(countS - oldS)
                        };
                    } else {
                        const activeStudentsCount = studentsList.filter(s => !s.isTransferred).length;
                        summaryUpdate = {
                            [`${state.activeClassroomId}.p`]: increment(countP),
                            [`${state.activeClassroomId}.a`]: increment(countA),
                            [`${state.activeClassroomId}.l`]: increment(countL),
                            [`${state.activeClassroomId}.s`]: increment(countS),
                            [`${state.activeClassroomId}.totalAtt`]: increment(activeStudentsCount),
                            [`${state.activeClassroomId}.recordedDays`]: increment(1)
                        };
                    }
                    await setDoc(summaryRef, summaryUpdate, { merge: true });

                    if (shouldNotify) {
                        showToast(`บันทึกข้อมูลวันที่ ${state.attendanceDate} สำเร็จ`, 'success');
                    }
                    
                    state.isEditingMode = false;

                    const hasLineReportItems = countLate > 0 || countA > 0 || countL > 0 || countS > 0;
                    const hasLineConfigForRoom = Boolean(state.settings?.lineTokens?.[state.activeClassroomId] && state.settings?.lineGroups?.[state.activeClassroomId]);
                    // บันทึกภาพล่าสุดไว้ให้ทั้งระบบส่งอัตโนมัติเดิม และระบบครูแชร์ข้อความให้ bot ตอบรูปกลับมา
                    const shouldPrepareLineImage = hasLineConfigForRoom && hasLineReportItems;

                    if (shouldPrepareLineImage) {
                        try {
                            if (isAuto) {
                                await new Promise(resolve => setTimeout(resolve, 1200));
                            }
                            await window.app.saveLatestLineImageToDrive({ silent: isAuto });
                        } catch (imgErr) {
                            console.error('Save latest LINE image error:', imgErr);
                            if (!isAuto) {
                                showToast('บันทึกเช็คชื่อสำเร็จ แต่สร้างภาพล่าสุดสำหรับ LINE ไม่สำเร็จ', 'error');
                            }
                        }
                    }

                    if (!isAuto) {
                        // 🌟 ดักกะพริบ: ตอนครูกดปุ่มเซฟเสร็จ ให้จอนิ่งๆ ไว้ไม่ต้องเด้ง
                        state.savedScrollY = window.scrollY;
                        state.skipAnimation = true;
                        render(); 
                    }
                } catch (e) {
                    console.error(e); 
                    if (!isAuto) showToast('เกิดข้อผิดพลาด', 'error'); 
                }
                if (!isAuto) toggleLoading(false);
            },

            selectHistoryDate: (date) => {
                state.historySelectedDate = date;
                render();
            },
            backToHistoryList: () => {
                state.historySelectedDate = null;
                render();
            },
            openPrompt: (type, dataStr) => {
                renderPromptModal(type, dataStr);
            },
            submitPrompt: async (e, type, expectedChar, dataStr) => {
                e.preventDefault();
                const val = document.getElementById('promptInput').value.trim().toUpperCase();
                if (val !== expectedChar) return;
                
                closeAllModals(); 
               if (type === 'reset') {
                    await app.resetSystem();
                } else if (type === 'clear_room') {
                    await app.clearRoomData(dataStr);
                } else if (type === 'delete') {
                    toggleLoading(true);
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `attendance_${state.activeYear}_${state.activeClassroomId}`, dataStr));
                        showToast('ลบประวัติการเช็คชื่อสำเร็จ', 'success');
                        state.historySelectedDate = null;
                    } catch(e) { showToast('เกิดข้อผิดพลาดในการลบ', 'error'); }
                    toggleLoading(false);
                } else if (type === 'edit') {
                    state.attendanceDate = dataStr;
                    state.isEditingMode = true;
                    state.activeTab = 'attendance';
                    loadAttendanceRecords();
                    render();
                } else if (type === 'delete_savings') {
                    await app.deleteSavingsDate(dataStr);
                } else if (type === 'edit_savings') {
                    state.savingsDate = dataStr;
                    state.savingsTab = 'daily';
                    state.isSavingsEditingMode = true;
                    state.savingsSelectedDate = null;
                    render();
                // 🌟 เพิ่ม 2 บรรทัดนี้สำหรับจัดการรายชื่อ
                } else if (type === 'edit_student') {
                    app.openStudentModal(dataStr);
                } else if (type === 'delete_student') {
                    await app.deleteStudent(dataStr);
                }
            },

            selectReportStudent: (id) => {
                state.reportSelectedStudentId = id;
                render();
            },
            backToReportList: () => {
                state.reportSelectedStudentId = null;
                render();
            },
            openConfirmModal: (title, msg, fn) => {
                renderConfirmModal(title, msg, fn);
            }
        };

        // --- 7. View Renderers ---
       function render() {
            const root = document.getElementById('app-root');
            let html = '';
            
            try {
                if (!state.hasLoadedClassrooms || !state.hasLoadedSettings) {
                    html = `<div class="min-h-screen flex items-center justify-center"><div class="animate-pulse text-gray-400 font-semibold text-xl">กำลังโหลดข้อมูล...</div></div>`;
                } else if (state.activeScreen === 'dashboard') {
                    html = renderDashboard();
                } else if (state.activeScreen === 'public_summary') { // เพิ่มเงื่อนไขนี้
                    html = renderPublicSummary();
                } else if (state.activeScreen === 'summary') {
                    html = renderSummaryRoom();
                } else if (state.activeScreen === 'classroom' && state.activeClassroomId) {
                    const cls = getDisplayClassrooms().find(c => c.id === state.activeClassroomId);
                    if(cls) {
                        html = renderClassroom(cls);
                        
                        if (!state.isAdmin && cls.password === '1234') {
                            if (!document.getElementById('newUserPassword')) {
                                setTimeout(() => window.app.openUserChangePasswordModal(cls.id), 50);
                            }
                        }
                    } else {
                        html = `<div class="min-h-screen flex items-center justify-center"><div class="animate-pulse text-gray-400 font-semibold text-xl">ไม่พบข้อมูลห้องเรียน</div></div>`;
                    }
                }
            } catch (e) {
                console.error("Render error:", e);
                html = `<div class="min-h-screen flex items-center justify-center"><div class="text-red-500 font-semibold">เกิดข้อผิดพลาดในการแสดงผล กรุณารีเฟรชหน้าต่าง</div></div>`;
            }

            root.innerHTML = html;
            lucide.createIcons();
            
            // 🌟 คืนตำแหน่งหน้าจอให้ที่เดิมเป๊ะ และล้างคำสั่งไม่ให้แอนิเมชันค้าง
            if (state.skipAnimation) {
                window.scrollTo(0, state.savedScrollY || 0);
                state.skipAnimation = false;
            }
        }

        // PATCH-MKMCLASS-DASHBOARD-CUMULATIVE-005:
        // การ์ดห้องเรียนต้องนับวันเรียนที่ผ่านมาสะสมทั้งสองภาคเรียนเสมอ
        // แยกจาก getAttendanceDayInfo() ซึ่งอาจแยกเทอมสำหรับงาน ปพ.5/เช็กชื่อ
        function getDashboardElapsedSchoolDates(asOfDate) {
            const settings = state.settings;
            const elapsedDates = new Set();
            if (!settings) return elapsedDates;

            const terms = [
                [settings.term1Start, settings.term1End],
                [settings.term2Start, settings.term2End]
            ];
            terms.forEach(([start, end]) => {
                if (!start || !end || end < start || asOfDate < start) return;
                const lastDate = asOfDate < end ? asOfDate : end;
                const stop = parseDateLocal(lastDate);
                for (let day = parseDateLocal(start); day <= stop; day.setDate(day.getDate() + 1)) {
                    const dateStr = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
                    if (isSchoolDay(dateStr)) elapsedDates.add(dateStr);
                }
            });
            return elapsedDates;
        }

        function renderDashboard() {

                content = `

                        <h3 class="text-xl font-semibold text-gray-700 mb-2">กำลังเตรียมระบบ...</h3>
                        <p class="text-gray-500 mb-6">ระบบกำลังสร้างห้องเรียนเริ่มต้น 11 ห้องให้คุณ</p>
                    </div>`;
            } else {
                // คำนวณวันเรียนที่ผ่านมาของทั้งปี (ไม่รีเซ็ตวันเมื่อเข้าเทอม 2)
                const elapsedSchoolDates = getDashboardElapsedSchoolDates(getTodayString());
                const passedDays = elapsedSchoolDates.size;

                const cards = cls.map(c => {
                    // นับเฉพาะวันที่เคยบันทึกจริงและเป็นวันเรียนที่ผ่านไปแล้ว

                    const roomRecordedDates = Array.isArray(c.recordedDates) ? c.recordedDates : [];
                    const recordedDays = new Set(roomRecordedDates.filter(date => elapsedSchoolDates.has(date))).size;
                    const pct = passedDays > 0 ? Math.round((recordedDays / passedDays) * 100) : 0;

                                    <div class="flex flex-col truncate">

                                        <p class="text-[9px] sm:text-xs text-gray-500 mt-0.5 truncate">บันทึก ${recordedDays}/${passedDays} วัน</p>
                                    </div>
                                </div>
                                
                                <div class="relative w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center shrink-0 ml-1 sm:ml-2">
                                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path class="text-gray-100" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                        <path style="color: ${strokeColor}; transition: stroke-dasharray 0.5s ease;" stroke-dasharray="${displayPct}, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    </svg>
                                    <div class="absolute inset-0 flex flex-col items-center justify-center text-[8px] sm:text-[10px] font-bold text-gray-700">
                                        ${displayPct}%
                                    </div>
                                </div>
                            </div>
                            
                            ${state.isAdmin ? `
                            <div class="mt-3 sm:mt-4 flex items-center justify-between border-t border-gray-50 pt-2 sm:pt-2.5">
                                <div class="flex items-center gap-1 text-[9px] sm:text-[10px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">
                                    <i data-lucide="key" class="w-2.5 h-2.5 sm:w-3 sm:h-3"></i> ${c.password}
                                </div>
                                <button onclick="event.stopPropagation(); app.openClassroomModal('${c.id}')" class="p-1 sm:p-1.5 text-gray-400 hover:text-[#3b82f6] hover:bg-blue-50 rounded-lg transition-all" title="ตั้งรหัสผ่านห้องเรียน"><i data-lucide="edit-2" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i></button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
                
                const summaryCard = state.isAdmin ? `
                    <div onclick="app.openSummaryRoom()" class="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-[1.25rem] shadow-sm hover:shadow-md transition-all overflow-hidden group flex items-center justify-between cursor-pointer relative p-3 sm:p-4 text-white col-span-1 sm:col-span-2 md:col-span-3 lg:col-span-4 gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-white/20 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="bar-chart-2" class="w-5 h-5 sm:w-6 sm:h-6"></i></div>
                            <div class="flex flex-col truncate">
                                <h3 class="text-sm sm:text-lg font-bold leading-tight mb-0.5">ห้องสรุปข้อมูลรวม (Admin)</h3>
                                <p class="text-[10px] sm:text-xs text-purple-100 truncate">ดูสถิติ จำนวนนักเรียน และความคืบหน้าการเช็คชื่อ</p>
                            </div>
                        </div>
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                            <i data-lucide="chevron-right" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>

                content = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">${summaryCard}${cards}</div>`;

            return `

                                                ${YEARS_LIST.map(y => `<option value="${y}" ${y === state.activeYear ? 'selected' : ''} class="text-gray-800">ปีการศึกษา ${y}</option>`).join('')}
                                            </select>
                                        ` : `
                                            <span class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-widest">ปีการศึกษา ${state.activeYear}</span>
                                        `}
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <!-- เอาปุ่ม Admin ออกทั้งหมดแล้ว -->

        ${state.isAdmin ? `
        <div class="flex gap-2">

        <div class="flex items-center gap-3 sm:gap-4 overflow-hidden">

            </div>

        // ---------- SUMMARY ROOM RENDERERS ----------
        function renderSummaryRoom() {
            const tabs = [
                { id: 'stats_students', icon: 'users', label: 'จำนวนนักเรียน' },
                { id: 'stats_daily', icon: 'calendar-check', label: 'สรุปรายวัน' },
                { id: 'stats_monthly', icon: 'calendar-days', label: 'สรุปรายเดือน' },
                { id: 'stats_yearly', icon: 'bar-chart-2', label: 'สรุปรายปี' },
                { id: 'stats_progress', icon: 'trending-up', label: 'ความคืบหน้า' }
            ];

            const tabsHtml = tabs.map(t => `
                <button onclick="app.setSummaryTab('${t.id}')" class="flex items-center gap-2 px-4 py-3 border-b-2 font-medium transition-colors whitespace-nowrap ${state.summaryTab === t.id ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50 rounded-t-xl'}">
                    <i data-lucide="${t.icon}" class="w-4 h-4"></i> ${t.label}
                </button>
            `).join('');

            let contentHtml = '';
            if (state.summaryTab === 'stats_students') contentHtml = renderSummaryStudents();
            else if (state.summaryTab === 'stats_daily') contentHtml = renderSummaryDaily();
            else if (state.summaryTab === 'stats_monthly') contentHtml = renderSummaryMonthly();
            else if (state.summaryTab === 'stats_yearly') contentHtml = renderSummaryYearly();
            else if (state.summaryTab === 'stats_progress') contentHtml = renderSummaryProgress();

            return `
                <div class="min-h-screen bg-gray-50 flex flex-col ${state.skipAnimation ? '' : 'animate-fade-in'}">
                    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <button onclick="app.closeSummaryRoom()" title="กลับหน้าแรก" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-gray-600 transition-colors">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                            </button>
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-purple-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-purple-100"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
                                <div class="flex flex-col">
                                    <h1 class="text-base sm:text-lg font-bold text-purple-700 leading-tight">ศูนย์ควบคุมข้อมูล (Admin)</h1>
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        โรงเรียนบ้านโคกเมือง <span class="mx-1 text-gray-200">|</span> ปีการศึกษา ${state.activeYear}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </header>
                    <div class="bg-white border-b border-gray-200 px-4 pt-4 flex justify-start sm:justify-center gap-2 sm:gap-8 overflow-x-auto scroll-smooth custom-scrollbar w-full">
                        ${tabsHtml}
                    </div>
                    <main class="flex-1 max-w-3xl mx-auto w-full p-4 sm:p-6">
                        ${contentHtml}
                    </main>
                </div>
            `;
        }

        function renderSummaryStudents() {
            let totalM = 0, totalF = 0, totalAll = 0;
            const rows = PREDEFINED_CLASSES.map(c => {
                const stats = (state.summaryData && state.summaryData[c.id]) ? state.summaryData[c.id] : { m: 0, f: 0, totalStds: 0 };
                
                let m = stats.m || 0;
                let f = stats.f || 0;
                let stdsLen = stats.totalStds || 0;
                
                totalM += m; totalF += f; totalAll += stdsLen;

                let shortName = c.name.replace('อนุบาล ', 'อ.').replace('ประถมศึกษาปีที่ ', 'ป.').replace('มัธยมศึกษาปีที่ ', 'ม.');

                return `
                    <tr onclick="app.requestViewPublicStudents('${c.id}')" class="hover:bg-blue-50/50 transition-colors text-sm sm:text-base cursor-pointer group">
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 font-semibold text-gray-700 whitespace-nowrap group-hover:text-[#2563eb] transition-colors">${shortName}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center text-blue-600 font-medium">${m}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center text-pink-600 font-medium">${f}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center">
                            <div class="flex items-center justify-center gap-1 font-bold text-gray-800">
                                <span>${stdsLen}</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-[#2563eb] transition-colors opacity-0 group-hover:opacity-100"></i>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="animate-slide-up flex flex-col items-center w-full">
                    <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center w-full">ข้อมูลจำนวนนักเรียนทั้งหมด</h2>
                    <div class="flex justify-center w-full">
                        <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-gray-100 w-full sm:w-auto">
                            <div class="p-3 bg-blue-50/50 border-b border-blue-100 text-center">
                                <p class="text-xs text-blue-600 font-medium"><i data-lucide="info" class="w-3.5 h-3.5 inline mb-0.5"></i> กดที่แถวของห้องเรียนเพื่อดูรายชื่อนักเรียน</p>
                            </div>
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full sm:w-auto text-left mx-auto">
                                    <thead class="bg-gray-50 text-gray-600 text-sm whitespace-nowrap border-b border-gray-200">
                                        <tr>
                                            <th class="px-4 sm:px-6 py-3 font-bold">ชั้น</th>
                                            <th class="px-4 sm:px-6 py-3 font-bold text-center">ชาย</th>
                                            <th class="px-4 sm:px-6 py-3 font-bold text-center">หญิง</th>
                                            <th class="px-4 sm:px-6 py-3 font-bold text-center">รวม</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${rows}
                                    </tbody>
                                    <tfoot class="bg-blue-50 border-t-2 border-blue-100">
                                        <tr>
                                            <td class="px-4 sm:px-6 py-3 font-black text-blue-800 text-right">ยอดรวม</td>
                                            <td class="px-4 sm:px-6 py-3 text-center font-black text-blue-700 text-base">${totalM}</td>
                                            <td class="px-4 sm:px-6 py-3 text-center font-black text-pink-700 text-base">${totalF}</td>
                                            <td class="px-4 sm:px-6 py-3 text-center font-black text-[#2563eb] text-xl">
                                                <!-- เติมกล่องเปล่าๆ w-4 h-4 ลงไปถ่วงน้ำหนักให้ตรงกับลูกศรแถวบน -->
                                                <div class="flex items-center justify-center gap-1">
                                                    <span>${totalAll}</span>
                                                    <div class="w-4 h-4 shrink-0"></div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
		
		function renderPublicSummary() {
            let totalM = 0, totalF = 0, totalAll = 0;
            const currentTab = state.publicSummaryTab || 'overview';
            
            // --- โค้ดสร้างตารางข้อมูลรวม (Overview) ---
            const overviewRows = PREDEFINED_CLASSES.map(c => {
                const stats = (state.summaryData && state.summaryData[c.id]) ? state.summaryData[c.id] : { m: 0, f: 0, totalStds: 0 };
                let m = stats.m || 0; let f = stats.f || 0; let stdsLen = stats.totalStds || 0;
                totalM += m; totalF += f; totalAll += stdsLen;
                let shortName = c.name.replace('อนุบาล ', 'อ.').replace('ประถมศึกษาปีที่ ', 'ป.').replace('มัธยมศึกษาปีที่ ', 'ม.');
                return `
                    <tr onclick="app.requestViewPublicStudents('${c.id}')" class="hover:bg-blue-50/50 transition-colors text-sm sm:text-base cursor-pointer group">
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 font-semibold text-gray-700 whitespace-nowrap group-hover:text-[#2563eb] transition-colors">${shortName}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center text-blue-600 font-medium">${m}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center text-pink-600 font-medium">${f}</td>
                        <td class="px-4 sm:px-6 py-2 sm:py-2.5 text-center">
                            <div class="flex items-center justify-center gap-1 font-bold text-gray-800">${stdsLen}<i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-[#2563eb] transition-colors opacity-0 group-hover:opacity-100"></i></div>
                        </td>
                    </tr>
                `;
            }).join('');

            // --- ส่วนปุ่ม Tabs แบบเลื่อนได้ (Scrollable Tabs) ---
            const tabsList = [
                { id: 'overview', icon: 'users', label: 'สรุปจำนวน' },
                { id: 'transfers', icon: 'arrow-right-left', label: 'ประวัติย้ายเข้า-ออก' },
                { id: 'daily', icon: 'calendar-check', label: 'สรุปรายวัน' },
                { id: 'monthly', icon: 'calendar-days', label: 'สรุปรายเดือน' },
                { id: 'yearly', icon: 'bar-chart-2', label: 'สรุปรายปี' },
                { id: 'progress', icon: 'trending-up', label: 'ความคืบหน้า' }
            ];

            const tabsHtml = `
                <div class="flex overflow-x-auto custom-scrollbar w-full mb-6 pb-2 gap-2 sm:gap-4 justify-start md:justify-center px-1">
                    ${tabsList.map(t => `
                        <button onclick="app.setPublicSummaryTab('${t.id}')" class="shrink-0 px-4 sm:px-6 py-2.5 rounded-full font-bold transition-all text-sm sm:text-base flex items-center justify-center gap-2 ${currentTab === t.id ? 'bg-[#3b82f6] text-white shadow-md' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}">
                            <i data-lucide="${t.icon}" class="w-4 h-4"></i> ${t.label}
                        </button>
                    `).join('')}
                </div>
            `;

            let contentHtml = '';
            
            // --- เงื่อนไขการแสดงผลแต่ละ Tab ---
            if (currentTab === 'overview') {
                contentHtml = `
                    <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-gray-100 animate-slide-up w-full sm:w-auto mx-auto max-w-3xl">
                        <div class="p-3 bg-blue-50/50 border-b border-blue-100 text-center"><p class="text-xs text-blue-600 font-medium"><i data-lucide="info" class="w-3.5 h-3.5 inline mb-0.5"></i> กดที่แถวของห้องเรียนเพื่อดูรายชื่อนักเรียน</p></div>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full sm:w-auto text-left mx-auto">
                                <thead class="bg-gray-50 text-gray-600 text-sm whitespace-nowrap border-b border-gray-200">
                                    <tr>
                                        <th class="px-4 sm:px-6 py-3 font-bold">ชั้น</th>
                                        <th class="px-4 sm:px-6 py-3 font-bold text-center">ชาย</th>
                                        <th class="px-4 sm:px-6 py-3 font-bold text-center">หญิง</th>
                                        <th class="px-4 sm:px-6 py-3 font-bold text-center">รวม</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">${overviewRows}</tbody>
                                <tfoot class="bg-blue-50 border-t-2 border-blue-100">
                                    <tr>
                                        <td class="px-4 sm:px-6 py-3 font-black text-blue-800 text-right">ยอดรวม</td>
                                        <td class="px-4 sm:px-6 py-3 text-center font-black text-blue-700 text-base">${totalM}</td>
                                        <td class="px-4 sm:px-6 py-3 text-center font-black text-pink-700 text-base">${totalF}</td>
                                        <td class="px-4 sm:px-6 py-3 text-center font-black text-[#2563eb] text-xl">
                                            <!-- 🌟 เติมกล่องเปล่าๆ w-4 h-4 ลงไปถ่วงน้ำหนักให้ตรงกับลูกศรแถวบน 🌟 -->
                                            <div class="flex items-center justify-center gap-1">
                                                <span>${totalAll}</span>
                                                <div class="w-4 h-4 shrink-0"></div>
                                            </div>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'transfers') { // ท่อนนี้และด้านล่างปล่อยไว้เหมือนเดิมครับ
                const transferRecords = [];
                (state.allStudentsData || []).forEach(s => {
                    if (s.transferInDate) transferRecords.push({ type: 'in', date: s.transferInDate, name: s.name || s.fullName, roomName: s.roomName });
                    if (s.isTransferred && s.transferDate) transferRecords.push({ type: 'out', date: s.transferDate, name: s.name || s.fullName, roomName: s.roomName });
                });
                transferRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (transferRecords.length === 0) {
                    contentHtml = `<div class="bg-white rounded-[2rem] p-12 text-center text-gray-500 border border-gray-100 w-full animate-slide-up"><i data-lucide="info" class="w-12 h-12 mx-auto mb-3 opacity-20"></i>ไม่มีประวัตินักเรียนย้ายเข้า-ออก ในปีการศึกษานี้</div>`;
                } else {
                    const trRows = transferRecords.map(r => {
                        const badge = r.type === 'out' ? `<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold border border-gray-200 shadow-sm"><i data-lucide="log-out" class="w-3 h-3 inline mr-1"></i>ย้ายออก</span>` : `<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-xs font-bold border border-emerald-200 shadow-sm"><i data-lucide="log-in" class="w-3 h-3 inline mr-1"></i>ย้ายเข้า</span>`;
                        let dateDisplay = r.date;
                        try {
                            const [y, m, d] = r.date.split('-');
                            dateDisplay = new Date(y, m-1, d).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                        } catch(e) {}
                        let shortRoom = r.roomName.replace('อนุบาล ', 'อ.').replace('ประถมศึกษาปีที่ ', 'ป.').replace('มัธยมศึกษาปีที่ ', 'ม.');
                        return `
                            <tr class="hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-0 whitespace-nowrap">
                                <td class="px-4 sm:px-6 py-3 font-semibold text-gray-800">${r.name}</td>
                                <td class="px-4 sm:px-6 py-3 text-gray-600">${shortRoom}</td>
                                <td class="px-4 sm:px-6 py-3 text-center">${badge}</td>
                                <td class="px-4 sm:px-6 py-3 text-right text-gray-500 font-medium">${dateDisplay}</td>
                            </tr>
                        `;
                    }).join('');

                    contentHtml = `
                        <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-gray-100 animate-slide-up w-full max-w-3xl mx-auto">
                            <div class="p-4 bg-gray-50 border-b border-gray-100 font-bold text-gray-700 flex justify-between items-center">
                                <span>ประวัติการย้ายเข้า - ย้ายออก</span><span class="text-xs bg-white px-2.5 py-1 rounded-lg shadow-sm border border-gray-200 text-blue-600">${transferRecords.length} รายการ</span>
                            </div>
                            <div class="overflow-x-auto custom-scrollbar max-h-[500px] overflow-y-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-white sticky top-0 shadow-sm"><tr class="text-xs text-gray-400 border-b border-gray-100"><th class="px-4 py-3 font-medium">ชื่อ-นามสกุล</th><th class="px-4 py-3 font-medium">ระดับชั้น</th><th class="px-4 py-3 font-medium text-center">สถานะ</th><th class="px-4 py-3 font-medium text-right">วันที่ทำรายการ</th></tr></thead>
                                    <tbody>${trRows}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
            } else if (currentTab === 'daily') {
                const dateStr = state.summaryDate || getTodayString();
                const dateDisplay = new Date(dateStr).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                let gP=0, gA=0, gL=0, gS=0, gT=0;
                
                const dRows = PREDEFINED_CLASSES.map(c => {
                    const att = state.dailyAttData ? state.dailyAttData[c.id] : null;
                    let p=0, a=0, l=0, s=0;
                    if (att && att.records) {
                        att.records.forEach(r => {
                            if(r.status==='present' || r.status==='late') p++;
else if(r.status==='absent') a++;
else if(r.status && (r.status==='sick' || r.status.includes('sick'))) s++;
else if(r.status && (r.status==='leave' || r.status.includes('leave') || r.status==='other')) l++;
                        });
                    }
                    const rowTotal = p + a + l + s;
                    gP+=p; gA+=a; gL+=l; gS+=s; gT+=rowTotal; 
                    const isChecked = !!att;
                    const statusBadge = isChecked ? `<span class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md text-[10px] font-bold">บันทึกแล้ว</span>` : `<span class="text-red-500 bg-red-50 px-2 py-1 rounded-md text-[10px] font-bold">ยังไม่บันทึก</span>`;
                    let shortName = c.name.replace('อนุบาล ', 'อ.').replace('ประถมศึกษาปีที่ ', 'ป.').replace('มัธยมศึกษาปีที่ ', 'ม.');
                    return `
                        <tr class="hover:bg-blue-50/50 transition-colors text-sm sm:text-base group">
                            <td class="px-4 sm:px-6 py-2 sm:py-2.5 font-semibold text-gray-700 flex items-center gap-2 whitespace-nowrap">${shortName} ${statusBadge}</td>
                            <td class="px-2 sm:px-4 py-2 sm:py-2.5 text-center font-bold ${p>0?'text-emerald-600':'text-gray-400'}">${isChecked ? p : '-'}</td>
                            <td class="px-2 sm:px-4 py-2 sm:py-2.5 text-center font-bold ${a>0?'text-red-600':'text-gray-400'}">${isChecked ? a : '-'}</td>
                            <td class="px-2 sm:px-4 py-2 sm:py-2.5 text-center font-bold ${l>0?'text-blue-600':'text-gray-400'}">${isChecked ? l : '-'}</td>
                            <td class="px-2 sm:px-4 py-2 sm:py-2.5 text-center font-bold ${s>0?'text-orange-600':'text-gray-400'}">${isChecked ? s : '-'}</td>
                            <td class="px-4 py-2 sm:py-2.5 text-center font-bold text-gray-800">${isChecked ? rowTotal : '-'}</td>
                        </tr>
                    `;
                }).join('');

                contentHtml = `
                    <div class="animate-slide-up flex flex-col items-center w-full max-w-4xl mx-auto">
                        <div class="flex justify-between items-center mb-6 w-full">
                            <label class="relative flex items-center gap-2 bg-white px-4 py-2 rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer overflow-hidden mx-auto">
                                <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
                                <span class="text-indigo-700 font-bold whitespace-nowrap">${dateDisplay}</span>
                                <input type="date" value="${dateStr}" onclick="this.showPicker && this.showPicker()" onchange="app.setPublicSummaryDate(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 date-picker-input">
                            </label>
                        </div>
                        <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-gray-100 w-full sm:w-auto">
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full sm:w-auto text-left mx-auto">
                                    <thead class="bg-gray-50 text-gray-600 text-sm whitespace-nowrap border-b border-gray-200">
                                        <tr><th class="px-4 sm:px-6 py-4 font-medium">ชั้น</th><th class="px-2 sm:px-4 py-4 font-medium text-center">มา</th><th class="px-2 sm:px-4 py-4 font-medium text-center">ขาด</th><th class="px-2 sm:px-4 py-4 font-medium text-center">ลา</th><th class="px-2 sm:px-4 py-4 font-medium text-center">ป่วย</th><th class="px-4 sm:px-6 py-4 font-medium text-center">รวม</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">${dRows}</tbody>
                                    <tfoot class="bg-indigo-50 border-t-2 border-indigo-100">
                                        <tr><td class="px-4 sm:px-6 py-4 font-bold text-indigo-800">รวมทั้งหมด</td><td class="px-2 sm:px-4 py-4 text-center font-bold text-emerald-600">${gP}</td><td class="px-2 sm:px-4 py-4 text-center font-bold text-red-600">${gA}</td><td class="px-2 sm:px-4 py-4 text-center font-bold text-blue-600">${gL}</td><td class="px-2 sm:px-4 py-4 text-center font-bold text-orange-600">${gS}</td><td class="px-4 sm:px-6 py-4 text-center font-black text-indigo-900 text-lg">${gT}</td></tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'monthly') {
                const monthStr = state.summaryMonth || getTodayString().substring(0, 7);
                const [y, m] = monthStr.split('-');
                const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        function renderSummaryProgress() {
            const set = state.settings;
            let todayStr = getTodayString();
            if (todayStr > set.term2End) todayStr = set.term2End;
            else if (todayStr > set.term1End && todayStr < set.term2Start) todayStr = set.term1End;
            
            const rows = PREDEFINED_CLASSES.map(c => {
                const todayInfo = getAttendanceDayInfo(todayStr, c.id);
                const passedDays = todayInfo.dayCount;
                
                // ดึงจำนวนวันที่บันทึกแล้วจากข้อมูลห้องโดยตรง
                const dbRoom = state.classrooms.find(room => room.id === c.id);
                const recordedDays = dbRoom && dbRoom.recordedDates ? dbRoom.recordedDates.length : 0;
                
                const pct = passedDays > 0 ? Math.round((recordedDays / passedDays) * 100) : 0;
                const displayPct = Math.min(pct, 100);
                const color = displayPct >= 80 ? 'bg-emerald-500' : displayPct >= 50 ? 'bg-orange-500' : 'bg-red-500';
                
                return `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col sm:flex-row sm:items-center gap-4">
                        <div class="w-full sm:w-48 shrink-0 flex items-center gap-3">

                            <div>
                                <h3 class="font-bold text-gray-800 leading-tight">${c.name}</h3>
                                <p class="text-xs text-gray-500">บันทึก ${recordedDays} / เปิดเรียน ${passedDays} วัน</p>
                            </div>
                        </div>
                        <div class="flex-1 w-full">
                            <div class="flex justify-between text-xs mb-1 font-bold">

                                <span class="${displayPct >= 80 ? 'text-emerald-600' : displayPct >= 50 ? 'text-orange-600' : 'text-red-600'}">${displayPct}%</span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">

            return `

        function renderClassroom(cls) {
            // --- 1. คำนวณสถานะแจ้งเตือนสำหรับแท็บ (วิบวับ) ---
            const s = state.settings;
            let todayStr = getTodayString();
            let shouldCheckToday = false;
            let hasUnrecorded = false;

            if (s) {
                // ตรวจสอบว่าวันนี้ต้องเช็คชื่อไหม (อยู่ในเทอม, เป็นวันเปิดเรียน, และยังไม่ได้เช็ค)
                if ((todayStr >= s.term1Start && todayStr <= s.term1End) || (todayStr >= s.term2Start && todayStr <= s.term2End)) {
                    if (isSchoolDay(todayStr)) {
                        const todayAtt = (state.roomData[cls.id]?.attendance || []).find(a => a.date === todayStr);
                        const isGeoMode = state.settings?.geoCheckIn?.[cls.id] || false;
                        
                        // 🌟 ถ้ายิ่งไม่มีข้อมูลเลย = ต้องเตือนวิบวับ
                        if (!todayAtt) {
                            shouldCheckToday = true;
                        } 
                        // 🌟 หรือถ้ามีข้อมูลแล้ว แต่เป็นโหมด Geo และครูยังไม่กดยืนยัน = ต้องเตือนวิบวับ!
                        else if (isGeoMode && !todayAtt.teacherConfirmed) {
                            shouldCheckToday = true;
                        }
                    }
                }

                // ตรวจสอบว่ามีค้างเช็คชื่อในวันก่อนๆ หรือไม่
                if (todayStr >= s.term1Start) {
                    let checkEnd = todayStr > s.term2End ? s.term2End : todayStr;
                    let curr = parseDateLocal(s.term1Start);
                    let target = parseDateLocal(checkEnd);
                    const recordedDates = new Set((state.roomData[cls.id]?.attendance || []).map(a => a.date));
                    
                    while (curr <= target) {
                        let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                        if (dStr > s.term1End && dStr < s.term2Start) {
                            curr.setDate(curr.getDate() + 1);
                            continue;
                        }
                        // นับเฉพาะวันที่ไม่ใช่ "วันนี้" เพราะวันนี้ไปแจ้งเตือนที่แท็บแรกแล้ว
                        if (isSchoolDay(dStr) && !recordedDates.has(dStr) && dStr !== todayStr) {
                            hasUnrecorded = true;
                            break; // เจอแค่วันเดียวก็สั่งให้แท็บวิบวับได้เลย
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                }
            }

            const tabs = [
                { id: 'attendance', icon: 'check-circle', label: 'เช็คชื่อ' },
                { id: 'unrecorded', icon: 'calendar-x', label: 'ค้างเช็คชื่อ' },
                { id: 'history', icon: 'history', label: 'ประวัติรายวัน' },
                { id: 'report', icon: 'pie-chart', label: 'รายงาน' }
            ];

            const tabsHtml = tabs.map(t => {
                let isHot = false;
                if (t.id === 'attendance' && shouldCheckToday) isHot = true;
                if (t.id === 'unrecorded' && hasUnrecorded) isHot = true;

                // กำหนดคลาส CSS สีปกติ
                let activeClass = 'border-[#3b82f6] text-[#3b82f6] font-bold';
                let inactiveClass = 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50 rounded-t-xl font-medium';
                
                // กำหนดคลาส CSS สีร้อนแรงวิบวับ
                let hotActiveClass = 'border-red-500 text-red-600 bg-red-50 font-bold';
                let hotInactiveClass = 'border-transparent text-red-500 hover:bg-red-50 rounded-t-xl font-bold';

                let currentClass = '';
                if (state.activeTab === t.id) {
                    currentClass = isHot ? hotActiveClass : activeClass;
                } else {
                    currentClass = isHot ? hotInactiveClass : inactiveClass;
                }

                // เอฟเฟกต์จุดแดงกระพริบวิบวับ (Ping Animation ของ Tailwind)
                const pingBadge = isHot ? `<span class="relative flex h-2.5 w-2.5 ml-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600"></span></span>` : '';

                return `
                    <button onclick="app.setTab('${t.id}')" class="flex items-center justify-center gap-1.5 px-3 sm:px-4 py-3 border-b-2 transition-colors whitespace-nowrap text-sm sm:text-base ${currentClass}">
                        <i data-lucide="${t.icon}" class="w-4 h-4 ${isHot ? 'animate-pulse' : ''}"></i> ${t.label} ${pingBadge}
                    </button>
                `;
            }).join('');

            let contentHtml = '';
            if (state.activeClassroomModule === 'savings') {
                contentHtml = renderSavingsModule();
            } else if (state.activeTab === 'students') contentHtml = renderStudentsTab();
            else if (state.activeTab === 'attendance') contentHtml = renderAttendanceTab();
            else if (state.activeTab === 'unrecorded') contentHtml = renderUnrecordedTab();
            else if (state.activeTab === 'history') contentHtml = renderHistoryTab();
            else if (state.activeTab === 'report') contentHtml = renderReportTab();

            const safePassword = cls.password.replace(/'/g, "\'");
            const drawerHtml = `
                ${state.isClassroomMenuOpen ? `<div onclick="app.closeClassroomMenu()" class="fixed inset-0 bg-black/30 backdrop-blur-[1px] z-30 animate-fade-in"></div>` : ''}
                <aside class="fixed top-0 left-0 h-full w-[310px] max-w-[86vw] bg-white z-40 shadow-2xl border-r border-gray-100 transform transition-transform duration-300 ${state.isClassroomMenuOpen ? 'translate-x-0' : '-translate-x-full'}">
                    <div class="h-full flex flex-col">
                        <div class="p-6 border-b border-gray-100 bg-gradient-to-br from-violet-50 to-white">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-11 h-11 rounded-2xl bg-violet-100 text-violet-700 flex items-center justify-center font-black text-xl">${cls.emoji}</div>
                                    <div>
                                        <div class="text-2xl font-black text-violet-600">MKMCLASS</div>
                                        <div class="text-xs font-bold text-gray-400">${cls.name}</div>
                                    </div>
                                </div>
                                <button onclick="app.closeClassroomMenu()" class="p-2 rounded-xl hover:bg-white text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">เมนู</div>
                        </div>
                        <nav class="flex-1 p-4 space-y-2">
                            <button onclick="app.setClassroomModule('attendance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition-all ${state.activeClassroomModule === 'attendance' ? 'bg-violet-100 text-violet-700' : 'text-gray-600 hover:bg-gray-50'}">
                                <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                                <span>บันทึกการมาเรียน</span>
                            </button>
                            <button onclick="app.setClassroomModule('savings')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition-all ${state.activeClassroomModule === 'savings' ? 'bg-emerald-100 text-emerald-700' : 'text-gray-600 hover:bg-gray-50'}">
                                <i data-lucide="piggy-bank" class="w-5 h-5"></i>
                                <span>ออมเงินนักเรียน</span>
                            </button>
                            <button onclick="app.requestLeaveRoom('${cls.id}', '${safePassword}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold text-red-500 hover:bg-red-50 transition-all">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                                <span>ออกจากระบบ</span>
                            </button>
                        </nav>
                        <div class="p-5 border-t border-gray-100">
                            <div class="flex items-center gap-2 text-violet-600 font-black text-sm"><i data-lucide="database" class="w-4 h-4"></i> MKMCLASS STORAGE</div>
                            <div class="mt-3 h-2 rounded-full bg-gray-100 overflow-hidden"><div class="h-full w-[6%] bg-violet-500 rounded-full"></div></div>
                        </div>
                    </div>
                </aside>
            `;

            return `
                <div class="min-h-screen bg-gray-50 flex flex-col ${state.skipAnimation ? '' : 'animate-fade-in'}">
                    ${drawerHtml}
                    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <button onclick="app.toggleClassroomMenu()" title="เมนูห้องเรียน" class="w-12 h-12 rounded-full bg-amber-50 hover:bg-amber-100 text-gray-700 flex items-center justify-center transition-all shadow-sm border border-amber-100 active:scale-95">
                                <i data-lucide="panel-left" class="w-6 h-6"></i>
                            </button>
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${cls.emoji}</span>
                                <div>
                                    <h1 class="text-xl font-bold text-gray-800">${cls.name}</h1>
                                    <p class="text-xs font-semibold text-gray-400">${state.activeClassroomModule === 'savings' ? 'ออมเงินนักเรียน' : 'บันทึกการมาเรียน'}</p>
                                </div>
                            </div>
                        </div>
                        ${state.isAdmin ? `
                        <button onclick="app.setTab('students')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${state.activeTab === 'students' ? 'bg-[#3b82f6] text-white shadow-md' : 'bg-blue-50 text-[#3b82f6] hover:bg-blue-100'}">
                            <i data-lucide="users" class="w-4 h-4"></i> <span class="hidden sm:inline">รายชื่อนักเรียน</span>
                        </button>
                        ` : (() => {
                            // 🌟 ส่วนที่เพิ่มใหม่: คำนวณจำนวนวันที่ค้างเช็คชื่อ
                            let missingCount = 0;
                            const recordedDates = new Set((state.roomData[cls.id]?.attendance || []).map(a => a.date));
                            if (s && todayStr >= s.term1Start) {
                                let checkEnd = todayStr > s.term2End ? s.term2End : todayStr;
                                let curr = parseDateLocal(s.term1Start);
                                let target = parseDateLocal(checkEnd);
                                while (curr <= target) {
                                    let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                                    if (!(dStr > s.term1End && dStr < s.term2Start) && isSchoolDay(dStr) && !recordedDates.has(dStr)) {
                                        missingCount++;
                                    }
                                    curr.setDate(curr.getDate() + 1);
                                }
                            }

                            const isBlocked = missingCount >= 2;

                            return isBlocked ? `
                                <button onclick="app.showRandomBlockedWarning(${missingCount})" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all bg-gray-100 text-gray-400 border border-gray-200 cursor-not-allowed">
                                    <i data-lucide="lock" class="w-4 h-4"></i> <span class="hidden sm:inline">สุ่มชื่อ (ถูกล็อก)</span>

                                    <i data-lucide="dices" class="w-4 h-4"></i> <span class="hidden sm:inline">สุ่มชื่อ</span>
                                </button>
                            `;
                        })()}
                    </header>
                    ${state.activeClassroomModule === 'attendance' ? `
                    <div class="bg-white border-b border-gray-200 px-4 pt-4 flex justify-center sm:justify-start gap-2 sm:gap-6 overflow-x-auto custom-scrollbar">
                        ${tabsHtml}
                    </div>` : ''}
                    <main class="flex-1 max-w-5xl mx-auto w-full p-4 sm:p-6">
                        ${contentHtml}
                    </main>
                </div>
            `;
        }


        function formatMoney(value) {
            const n = Number(value || 0);
            return n.toLocaleString('th-TH', {
                minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
                maximumFractionDigits: 2
            });
        }

        function getStudentSavingsBalanceMap(roomId, excludeDate = null) {
            const balances = {};
            const savings = state.roomData[roomId]?.savings || [];
            savings.forEach(day => {
                if (excludeDate && day.date === excludeDate) return;
                (day.records || []).forEach(r => {
                    const deposit = Number(r.deposit || 0) || 0;
                    const withdraw = Number(r.withdraw || 0) || 0;
                    balances[r.studentId] = (balances[r.studentId] || 0) + deposit - withdraw;
                });
            });
            return balances;
        }

        function renderSavingsModule() {
            const tab = state.savingsTab || 'daily';
            const roomId = state.activeClassroomId;
            const totalBalanceMap = getStudentSavingsBalanceMap(roomId);

            const tabBtn = (key, label, icon) => `

                    <span>${label}</span>

            return `

                    </div>

                    <div class="bg-white rounded-[1.5rem] shadow-sm border border-gray-100 overflow-x-auto custom-scrollbar">
                        <div class="flex min-w-max px-2">
                            ${tabBtn('daily', 'บันทึกออมเงิน', 'edit-3')}
                            ${tabBtn('history', 'ประวัติรายวัน', 'history')}
                            ${tabBtn('report', 'รายงาน', 'file-text')}
                        </div>
                    </div>

                    ${tab === 'history' ? renderSavingsHistoryTab() : tab === 'report' ? renderSavingsReportTab() : renderSavingsDailyTab()}

            `;
        }

        function renderSavingsDailyTab() {
            const roomId = state.activeClassroomId;
            const dateStr = state.savingsDate || getTodayString();

            const existingRecord = savings.find(a => a.date === dateStr);
            const recordMap = new Map((existingRecord?.records || []).map(r => [r.studentId, r]));
            const draft = getSavingsDraft(roomId, dateStr);
            const isSaved = !!existingRecord?.teacherConfirmed && !state.isSavingsEditingMode;
            const totalDeposit = (existingRecord?.records || []).reduce((sum, r) => sum + (Number(r.deposit || 0) || 0), 0);
            const totalWithdraw = (existingRecord?.records || []).reduce((sum, r) => sum + (Number(r.withdraw || 0) || 0), 0);
            const savedCount = (existingRecord?.records || []).filter(r => (Number(r.deposit || 0) || 0) > 0 || (Number(r.withdraw || 0) || 0) > 0).length;

            const rows = list.map((s, index) => {
                const rec = recordMap.get(s.id) || {};
                const draftItem = (!isSaved && draft?.[s.id]) ? draft[s.id] : {};

                const manualDeposit = draftItem.deposit !== undefined ? (Number(draftItem.deposit || 0) || 0) : (Number(rec.deposit || 0) || 0);
                const draftWithdraw = draftItem.withdraw !== undefined ? (Number(draftItem.withdraw || 0) || 0) : (Number(rec.withdraw || 0) || 0);

                };

                const amountMiddleButtons = [15, 20, 30, 40].map(buildAmountButton).join('');
                const amountBottomButtons = [50, 100].map(buildAmountButton).join('');

                return `
                    <tr class="hover:bg-gray-50/70 transition-colors border-b-2 border-gray-200 last:border-0">
                        <td class="p-2 sm:p-4 text-center text-sm font-bold text-gray-400 w-12 sm:w-16">${s.studentNumber || index + 1}</td>

                                ${amountMiddleButtons}
                                ${amountBottomButtons}
                                <input id="saving-deposit-${s.id}" type="number" min="0" step="1" value="${manualDeposit || ''}" placeholder="ฝาก" ${disabledAttr} oninput="app.updateSavingManualAmount('${s.id}', 'deposit', this.value)" class="w-full min-w-[54px] sm:min-w-[64px] py-1.5 sm:py-2 text-center px-1 rounded-xl border border-gray-200 bg-white focus:ring-2 focus:ring-emerald-200 focus:outline-none font-bold text-emerald-700 text-xs sm:text-sm ${isSaved ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : ''}">
                                <input id="saving-withdraw-${s.id}" type="number" min="0" step="1" value="${withdraw || ''}" placeholder="ถอน" ${disabledAttr} oninput="app.updateSavingManualAmount('${s.id}', 'withdraw', this.value)" class="w-full min-w-[54px] sm:min-w-[64px] py-1.5 sm:py-2 text-center px-1 rounded-xl border border-red-100 bg-white focus:ring-2 focus:ring-red-200 focus:outline-none font-bold text-red-600 text-xs sm:text-sm ${isSaved ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : ''}">
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-[3rem] shadow-sm border border-gray-100 overflow-hidden flex-1 mb-10">

                        <div>
                            <h3 class="text-base sm:text-xl font-black text-gray-800 leading-tight">บันทึกออมเงินประจำวัน</h3>
                            <p class="text-xs sm:text-sm text-gray-500 font-medium">เลือกจำนวนเงินฝากแบบเร็ว หรือกรอกฝาก/ถอนรายคน</p>

                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="date" value="${dateStr}" onchange="app.setSavingsDate(this.value)" class="px-4 py-2.5 rounded-xl border border-gray-200 font-bold text-gray-700 bg-white">

                            <button onclick="app.saveSavingsRecord()" ${isSaved ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl ${isSaved ? 'bg-gray-300 text-white cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white active:scale-95'} font-black shadow-sm transition-all flex items-center justify-center gap-2">
                                <i data-lucide="${isSaved ? 'lock' : 'save'}" class="w-4 h-4"></i> ${isSaved ? 'บันทึกแล้ว' : (state.isSavingsEditingMode ? 'บันทึกการแก้ไข' : 'บันทึกออมเงิน')}
                            </button>
                        </div>
                    </div>
                    ${existingRecord ? `
                        <div class="px-5 py-3 bg-gray-50 border-b border-gray-100 text-gray-600 font-bold text-xs sm:text-sm flex flex-wrap gap-4">
                            <span class="text-emerald-700">ฝาก ${formatMoney(totalDeposit)} บาท</span>
                            <span class="text-red-600">ถอน ${formatMoney(totalWithdraw)} บาท</span>
                            <span>มีรายการ ${savedCount} คน</span>
                            ${state.isSavingsEditingMode ? '<span class="text-orange-600">กำลังแก้ไขรายการเดิม</span>' : ''}
                        </div>
                    ` : ''}
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left min-w-[100px]">

                                    <th class="py-4 px-2 sm:px-4 font-bold min-w-[100px]">ชื่อ</th>
                                    <th class="py-4 px-2 sm:px-4 font-bold text-center min-w-[140px] sm:min-w-[260px]">${isSaved ? 'จำนวนเงิน' : 'ฝาก / ถอน'}</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y-2 divide-gray-200">

                            </tbody>
                        </table>
                    </div>
                </div>
            `;

        function renderSavingsHistoryTab() {
            const roomId = state.activeClassroomId;
            const savings = [...(state.roomData[roomId]?.savings || [])].sort((a, b) => b.date.localeCompare(a.date));
            const students = getProcessedStudents().filter(std => !std.isTransferred);
            const studentMap = new Map(students.map(std => [std.id, std]));
            const thaiMonthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const formatShortThaiDate = (dateStr) => {
                const d = parseDateLocal(dateStr);
                return `${d.toLocaleDateString('th-TH', { weekday: 'long' })} ${d.getDate()} ${thaiMonthsShort[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            if (savings.length === 0) {
                return `<div class="bg-white rounded-[1.5rem] p-12 text-center text-gray-500 shadow-sm border border-gray-100 flex flex-col items-center"><i data-lucide="history" class="w-16 h-16 text-gray-300 mb-4"></i>ยังไม่มีประวัติออมเงินรายวัน</div>`;
            }

            if (state.savingsSelectedDate) {
                const day = savings.find(d => d.date === state.savingsSelectedDate);
                if (!day) return '';
                let depositTotal = 0, withdrawTotal = 0;
                const rows = (day.records || [])
                    .filter(r => (Number(r.deposit || 0) || 0) > 0 || (Number(r.withdraw || 0) || 0) > 0)
                    .map(r => {
                        const std = studentMap.get(r.studentId);
                        const deposit = Number(r.deposit || 0) || 0;
                        const withdraw = Number(r.withdraw || 0) || 0;
                        depositTotal += deposit;
                        withdrawTotal += withdraw;
                        const heart = std?.gender === 'F' ? '🩷' : (std?.gender === 'M' ? '🩵' : '🤍');
                        return `
                            <tr class="hover:bg-gray-50/70 transition-colors border-b-2 border-gray-200 last:border-0">
                                <td class="p-3 sm:p-4 text-center text-sm font-bold text-gray-400 w-14">${std?.studentNumber || '-'}</td>
                                <td class="p-3 sm:p-4 whitespace-nowrap"><div class="flex items-center gap-3 min-w-[120px]"><span class="text-lg leading-none">${heart}</span><span class="text-sm font-bold text-gray-800">${std?.displayName || std?.first || r.studentId}</span></div></td>
                                <td class="p-3 sm:p-4 text-center text-sm font-black text-gray-800 whitespace-nowrap">${deposit ? formatMoney(deposit) : '-'}</td>
                                <td class="p-3 sm:p-4 text-center text-sm font-black text-gray-800 whitespace-nowrap">${withdraw ? formatMoney(withdraw) : '-'}</td>

                        <div class="flex items-center justify-between gap-3 px-1">
                            <button onclick="app.backToSavingsHistoryList()" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i> กลับ</button>
                            <div class="flex gap-2">
                                <button onclick="app.openPrompt('edit_savings', '${day.date}')" class="px-3 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-xs flex items-center gap-1"><i data-lucide="edit-3" class="w-4 h-4"></i> แก้ไข</button>
                                <button onclick="app.openPrompt('delete_savings', '${day.date}')" class="px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i> ลบ</button>

                                <div class="flex items-center gap-3 min-w-0"><div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i data-lucide="calendar-days" class="w-5 h-5"></i></div><div class="min-w-0"><h3 class="text-base sm:text-lg font-black text-gray-800 leading-tight truncate">${formatShortThaiDate(day.date)}</h3><p class="text-xs text-gray-400 font-bold">ยอดฝาก/ถอนรายคน</p></div></div>
                                <div class="text-right text-xs sm:text-sm font-black text-gray-800 shrink-0"><div>ฝาก ${formatMoney(depositTotal)}</div><div>ถอน ${formatMoney(withdrawTotal)}</div></div>
                            </div>
                            <div class="overflow-x-auto custom-scrollbar"><table class="w-full text-left min-w-[440px]"><thead class="bg-gray-50/50 text-gray-500 text-sm whitespace-nowrap border-b border-gray-100"><tr><th class="py-4 px-3 text-center font-bold">เลขที่</th><th class="py-4 px-3 font-bold">ชื่อ</th><th class="py-4 px-3 text-center font-bold">ฝาก</th><th class="py-4 px-3 text-center font-bold">ถอน</th></tr></thead><tbody class="divide-y-2 divide-gray-200">${rows || `<tr><td colspan="4" class="px-4 py-12 text-center text-gray-400 font-bold">ไม่มีรายการฝาก/ถอนในวันนี้</td></tr>`}</tbody></table></div>
                        </div>

            const cards = savings.map(day => {
                let depositTotal = 0;
                let withdrawTotal = 0;
                let depositCount = 0;
                (day.records || []).forEach(r => {
                    const dep = Number(r.deposit || 0) || 0;
                    const wit = Number(r.withdraw || 0) || 0;
                    depositTotal += dep;
                    withdrawTotal += wit;
                    if (dep > 0) depositCount++;
                });
                const netTotal = depositTotal - withdrawTotal;
                return `
                    <button onclick="app.selectSavingsHistoryDate('${day.date}')" class="bg-white rounded-[1.5rem] shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-all text-left w-full active:scale-[0.99]">

        function renderSavingsReportTab() {
            const roomId = state.activeClassroomId;
            const list = getProcessedStudents().filter(std => !std.isTransferred);
            const startDate = state.savingsReportStart || getSavingsDefaultStartDate();
            const endDate = state.savingsReportEnd || getTodayString();
            const currentMonth = getTodayString().substring(0, 7);
            const reportMonth = (state.savingsReportMonth || currentMonth) > currentMonth ? currentMonth : (state.savingsReportMonth || currentMonth);
            const savings = (state.roomData[roomId]?.savings || []).filter(day => day.date >= startDate && day.date <= endDate);
            const rangeMap = {};
            savings.forEach(day => {
                (day.records || []).forEach(r => {
                    if (!rangeMap[r.studentId]) rangeMap[r.studentId] = { deposit: 0, withdraw: 0 };
                    rangeMap[r.studentId].deposit += Number(r.deposit || 0) || 0;
                    rangeMap[r.studentId].withdraw += Number(r.withdraw || 0) || 0;
                });
            });
            const totalBalanceMap = getStudentSavingsBalanceMap(roomId);
            const totalDeposit = Object.values(rangeMap).reduce((sum, r) => sum + (Number(r.deposit || 0) || 0), 0);
            const totalWithdraw = Object.values(rangeMap).reduce((sum, r) => sum + (Number(r.withdraw || 0) || 0), 0);
            const totalBalance = Object.values(totalBalanceMap).reduce((sum, v) => sum + (Number(v) || 0), 0);
            const rows = list.map((std, index) => {
                const rec = rangeMap[std.id] || { deposit: 0, withdraw: 0 };
                const dep = Number(rec.deposit || 0) || 0;
                const wit = Number(rec.withdraw || 0) || 0;
                const net = dep - wit;
                const balance = Number(totalBalanceMap[std.id] || 0) || 0;
                const heart = std.gender === 'F' ? '🩷' : (std.gender === 'M' ? '🩵' : '🤍');

                    <div class="bg-white rounded-[1.5rem] border border-gray-100 shadow-sm p-4 sm:p-5 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
