                        </div>
                    </div>
                `;
                document.getElementById('modal-root').innerHTML = html;
                lucide.createIcons();
            },

            // 📅 ส่งออก PDF รายเดือนแบบข้อความจริง: วันที่ 1-31 + สรุปสถานะ
            buildMonthlyReportPdfHtml: (monthValues, options = {}) => {
                const roomId = state.activeClassroomId;
                const cls = state.classrooms.find(c => c.id === roomId) || PREDEFINED_CLASSES.find(c => c.id === roomId);
                if (!roomId || !cls) {
                    throw new Error('ยังไม่ได้เลือกห้องเรียน');
                }

                const list = getProcessedStudents().filter(std => !std.isTransferred);
                if (list.length === 0) {
                    throw new Error('ยังไม่มีรายชื่อนักเรียนสำหรับส่งออก PDF');
                }

                const currentAttendance = state.roomData[roomId]?.attendance || [];
                const isGeoMode = state.settings?.geoCheckIn?.[roomId] === true;
                const fullClassName = cls.name.startsWith('ชั้น') ? cls.name : `ชั้น${cls.name}`;
                const shortRoomName = cls.name
                    .replace('อนุบาล ', 'อ.')
                    .replace('ประถมศึกษาปีที่ ', 'ป.')
                    .replace('มัธยมศึกษาปีที่ ', 'ม.');
                const reportSchoolName = state.settings?.reportSchoolName || 'โรงเรียนบ้านโคกเมือง';
                const reportDirectorName = state.settings?.reportDirectorName || 'นายวัฒนา งอกงาม';
                const reportAcademicHeadName = state.settings?.reportAcademicHeadName || 'นางสาววิไลพร ดอกแก้ว';
                const reportClassTeacherName = state.settings?.reportClassTeacherNames?.[roomId] || 'นายอมรเทพ จันทร์ครบ';
                const thaiMonthsFull = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
                const esc = (value) => String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

                const normalizeStatusMark = (status) => {
                    if (status === 'present' || status === 'on_time') return '/';
                    if (status === 'late') return 'ส';
                    if (status === 'absent') return 'ข';
                    if (status === 'leave' || status === 'personal_leave' || status === 'other') return 'ล';
                    if (status === 'sick' || status === 'sick_leave') return 'ป';
                    if (status && String(status).includes('sick')) return 'ป';
                    if (status && String(status).includes('leave')) return 'ล';
                    return '';
                };

                const percentText = (value, total) => total > 0 ? ((value / total) * 100).toFixed(2) : '0.00';
                const makeMonthlySummaryCells = (summary) => {
                    const attended = summary.present + summary.late;
                    const totalRecorded = attended + summary.absent + summary.leave + summary.sick;
                    const attendPercent = percentText(attended, totalRecorded);

                    if (isGeoMode) {
                        return `
                            <td>${summary.present}</td>
                            <td>${summary.late}</td>
                            <td>${summary.absent}</td>
                            <td>${summary.leave}</td>
                            <td>${summary.sick}</td>
                            <td>${attended}</td>
                            <td>${attendPercent}</td>
                        `;
                    }

                    return `
                        <td>${attended}</td>
                        <td>${summary.absent}</td>
                        <td>${summary.leave}</td>
                        <td>${summary.sick}</td>
                        <td>${attendPercent}</td>
                    `;
                };

                const makeRowsHtml = (pageRows) => pageRows.map(r => `
                    <tr>
                        <td>${r.no}</td>
                        <td>${esc(r.code)}</td>
                        <td class="name-cell">${esc(r.name)}</td>
                        ${r.marks.map(item => `<td class="day-cell${item.isHoliday ? ' holiday-col' : ''}">${esc(item.mark)}</td>`).join('')}
                        ${makeMonthlySummaryCells(r.summary)}
                    </tr>
                `).join('');

                const buildMonthSection = (monthValue) => {
                    const [yearText, monthText] = monthValue.split('-');
                    const yearNum = Number(yearText);
                    const monthNum = Number(monthText);
                    const daysInMonth = new Date(yearNum, monthNum, 0).getDate();
                    const monthStart = `${yearText}-${monthText}-01`;
                    const monthEnd = `${yearText}-${monthText}-${String(daysInMonth).padStart(2, '0')}`;
                    const monthAttendance = currentAttendance.filter(day => day?.date >= monthStart && day?.date <= monthEnd);

                    if (monthAttendance.length === 0) return null;

                    const monthTitle = `${thaiMonthsFull[monthNum - 1]} พ.ศ. ${yearNum + 543}`;
                    const attendanceByDate = {};
                    monthAttendance.forEach(day => { attendanceByDate[day.date] = day; });

                    const dayMeta = Array.from({ length: daysInMonth }, (_, i) => {
                        const dayNo = i + 1;
                        const dateStr = `${yearText}-${monthText}-${String(dayNo).padStart(2, '0')}`;
                        const dayInfo = getAttendanceDayInfo(dateStr, roomId);
                        return {
                            dayNo,
                            dateStr,
                            isHoliday: dayInfo.status === 'outside' || !dayInfo.isSchoolDay,
                            note: dayInfo.note || 'วันหยุด'
                        };
                    });

                    const rows = [...list]
                        .sort((a, b) => Number(a.studentNumber) - Number(b.studentNumber))
                        .map((std, index) => {
                            const marks = [];
                            const summary = { present: 0, absent: 0, late: 0, leave: 0, sick: 0 };
                            for (const day of dayMeta) {
                                const att = attendanceByDate[day.dateStr];
                                let mark = '';
                                if (att && Array.isArray(att.records)) {
                                    const rec = att.records.find(r => r.studentId === std.id);
                                    mark = normalizeStatusMark(rec?.status || '');
                                }
                                if (mark === '/') summary.present++;
                                else if (mark === 'ข') summary.absent++;
                                else if (mark === 'ส') summary.late++;
                                else if (mark === 'ล') summary.leave++;
                                else if (mark === 'ป') summary.sick++;
                                marks.push({ mark, isHoliday: day.isHoliday });
                            }
                            return {
                                no: index + 1,
                                code: std.studentIdCode || std.studentNumber || '-',
                                name: std.fullName || std.name || std.displayName || '-',
                                marks,
                                summary
                            };
                        });

                    const dayHeaders = dayMeta.map(day => `<th class="day-col${day.isHoliday ? ' holiday-col' : ''}">${day.dayNo}</th>`).join('');
                    const dayCols = Array.from({ length: daysInMonth }, () => `<col class="day-col">`).join('');
                    const rowsPerPage = 25;
                    const pages = [];
                    for (let i = 0; i < rows.length; i += rowsPerPage) {
                        pages.push(rows.slice(i, i + rowsPerPage));
                    }
                    if (pages.length === 0) pages.push([]);

                    return {
                        monthValue,
                        monthTitle,
                        daysInMonth,
                        dayHeaders,
                        dayCols,
                        pages: pages.map((pageRows, pageIndex) => ({
                            monthValue,
                            monthTitle,
                            daysInMonth,
                            dayHeaders,
                            dayCols,
                            pageRows,
                            isLastPageOfMonth: pageIndex === pages.length - 1
                        }))
                    };
                };

                const sections = monthValues
                    .map(buildMonthSection)
                    .filter(Boolean);

                if (sections.length === 0) {
                    throw new Error(options.allMonths ? 'ยังไม่มีข้อมูลเช็คชื่อรายเดือนสำหรับส่งออก' : 'ยังไม่มีข้อมูลเช็คชื่อในเดือนที่เลือก');
                }

                const reportPages = sections.flatMap(section => section.pages);
                const totalPages = reportPages.length;
                const showPageNumbers = totalPages > 1;

                const makeSignaturesHtml = () => `
                    <section class="signatures">
                        <div class="sig-block">
                            <div>ลงชื่อ ...............................................</div>
                            <div>(${esc(reportClassTeacherName)})</div>
                            <div>ตำแหน่ง ครูประจำชั้น</div>
                            <div class="date-line">วันที่ ....... เดือน ............................ พ.ศ. ...........</div>
                        </div>
                        <div class="sig-block">
                            <div>ลงชื่อ ...............................................</div>
                            <div>(${esc(reportAcademicHeadName)})</div>
                            <div>ตำแหน่ง หัวหน้าฝ่ายวิชาการ</div>
                            <div class="date-line">วันที่ ....... เดือน ............................ พ.ศ. ...........</div>
                        </div>
                        <div class="sig-block">
                            <div>ลงชื่อ ...............................................</div>
                            <div>(${esc(reportDirectorName)})</div>
                            <div>ตำแหน่ง ผู้อำนวยการ${esc(reportSchoolName)}</div>
                            <div class="date-line">วันที่ ....... เดือน ............................ พ.ศ. ...........</div>
                        </div>
                    </section>
                `;

                const summaryColCount = isGeoMode ? 7 : 5;
                const summaryColsHtml = Array.from({ length: summaryColCount }, () => `<col class="sum-col">`).join('');
                const summaryHeadersHtml = isGeoMode
                    ? '<th>ตรง</th><th>สาย</th><th>ขาด</th><th>ลากิจ</th><th>ลาป่วย</th><th>รวมมา</th><th>มาร้อยละ</th>'
                    : '<th>มา</th><th>ขาด</th><th>ลากิจ</th><th>ลาป่วย</th><th>มาร้อยละ</th>';

                const makeTableHtml = (page) => `
                    <table>
                        <colgroup>
                            <col class="no-col">
                            <col class="code-col">
                            <col class="name-col">
                            ${page.dayCols}
                            ${summaryColsHtml}
                        </colgroup>
                        <thead>
                            <tr>
                                <th rowspan="2">ที่</th>
                                <th rowspan="2">รหัสนักเรียน</th>
                                <th rowspan="2">ชื่อ-นามสกุล</th>
                                <th colspan="${page.daysInMonth}">เช็คเวลาเรียนรายวัน</th>
                                <th colspan="${summaryColCount}">สรุป</th>
                            </tr>
                            <tr>
                                ${page.dayHeaders}
                                ${summaryHeadersHtml}
                            </tr>
                        </thead>
                        <tbody>${makeRowsHtml(page.pageRows)}</tbody>
                    </table>
                `;

                const makeReportPageHtml = (page, pageIndex) => `
                    <main class="report-page">
                        <div class="title">รายงานผลสรุปเวลาเรียนรายเดือน</div>
                        <div class="school">${esc(reportSchoolName)} สังกัด สำนักงานเขตพื้นที่การศึกษาประถมศึกษาสุรินทร์ เขต 1</div>
                        <div class="school">ปีการศึกษา ${esc(state.activeYear)}</div>
                        <div class="meta">${esc(fullClassName)} | ประจำเดือน${esc(page.monthTitle)}</div>
                        <div class="legend">/ = มา &nbsp;&nbsp; ข = ขาด &nbsp;&nbsp; ส = สาย &nbsp;&nbsp; ล = ลากิจ &nbsp;&nbsp; ป = ลาป่วย</div>
                        <div class="rule"></div>
                        ${makeTableHtml(page)}
                        ${page.isLastPageOfMonth ? makeSignaturesHtml() : ''}
                        ${showPageNumbers ? `<div class="page-number">หน้า ${pageIndex + 1} / ${totalPages}</div>` : ''}
                    </main>
                `;

                const firstMonth = sections[0].monthValue;
                const lastMonth = sections[sections.length - 1].monthValue;
                const fileTitle = options.allMonths
                    ? `รายงานรายเดือนทั้งหมด_${shortRoomName}_${firstMonth}_ถึง_${lastMonth}`
                    : `รายงานรายเดือน_${shortRoomName}_${firstMonth}`;

                const reportHtml = `<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${esc(fileTitle)}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4 landscape; margin: 8mm 6mm 10mm 6mm; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #ffffff;
            color: #000000;
            font-family: 'Kanit', 'Tahoma', 'Noto Sans Thai', sans-serif;
            font-size: 8.4px;
            line-height: 1.25;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .report-page { width: 100%; page-break-after: always; break-after: page; color: #000000; }
        .report-page:last-child { page-break-after: auto; break-after: auto; }
        .title { text-align: center; font-size: 16px; font-weight: 700; margin: 2px 0 7px 0; color: #000000; }
        .school { text-align: center; font-size: 10.5px; line-height: 1.5; color: #000000; }
        .meta { text-align: center; font-size: 11px; font-weight: 600; margin-top: 6px; color: #000000; }
        .legend { text-align: center; font-size: 9px; margin-top: 4px; color: #000000; }
        .rule { border-top: 1.6px solid #000000; margin: 8px 0 6px 0; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 7.2px; color: #000000; }
        thead { display: table-header-group; }
        tr { page-break-inside: avoid; }
        th { background: #f1f5f9; color: #000000; font-weight: 600; padding: 2.5px 1px; border: 1px solid #000000; text-align: center; vertical-align: middle; }
        td { color: #000000; padding: 2.2px 1px; border: 1px solid #000000; text-align: center; vertical-align: middle; }
        tbody tr:nth-child(even) td { background: #fcfcfd; }
        th.holiday-col, td.holiday-col, tbody tr:nth-child(even) td.holiday-col { background: #e5e7eb !important; }
        .no-col { width: 3%; }
        .code-col { width: 7%; }
        .name-col { width: 19%; }
        .day-col { width: 1.75%; }
        .sum-col { width: 3%; }
        .name-cell { text-align: left; padding-left: 4px; word-break: break-word; font-size: 7.5px; }
        .day-cell { font-weight: 600; }
        .signatures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            text-align: center;
            font-size: 9px;
            line-height: 1.75;
            margin-top: 18px;
            break-inside: avoid;
            page-break-inside: avoid;
            color: #000000;
        }
        .date-line { margin-top: 4px; color: #000000; }
        .page-number { margin-top: 6px; text-align: right; font-size: 8px; color: #000000; }
        .print-help { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
        .print-help button { border: 0; border-radius: 999px; padding: 9px 15px; font-family: inherit; font-weight: 600; cursor: pointer; background: #2563eb; color: white; box-shadow: 0 8px 20px rgba(37,99,235,0.22); }
        .print-help .secondary { background: #64748b; }
        @media print { .print-help { display: none; } body { background: #ffffff; } }
    </style>
</head>
<body>
    ${reportPages.map((page, pageIndex) => makeReportPageHtml(page, pageIndex)).join('')}
    <div class="print-help">
        <button onclick="window.print()">บันทึก/พิมพ์ PDF</button>
        <button class="secondary" onclick="window.close()">ปิด</button>
    </div>
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () { window.print(); }, 500);
        });
    <\/script>
</body>
</html>`;

                return { reportHtml, fileTitle, monthCount: sections.length, pageCount: totalPages };
            },

            openMonthlyReportPdfHtml: (reportHtml, fileTitle, toastMessage) => {
                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${fileTitle}.html`;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast('เบราว์เซอร์บล็อกหน้าต่างใหม่ จึงบันทึกไฟล์ HTML รายงานให้แทน', 'success');
                } else {
                    printWindow.document.open();
                    printWindow.document.write(reportHtml);
                    printWindow.document.close();
                    showToast(toastMessage || 'เปิดรายงานรายเดือนแล้ว เลือก “บันทึกเป็น PDF”', 'success');
                }
            },

            exportMonthlyReportPdf: async (monthValue) => {
                if (!monthValue || !/^\d{4}-\d{2}$/.test(monthValue)) {
                    return showToast('กรุณาเลือกเดือนก่อนส่งออก PDF', 'error');
                }

                const today = new Date();
                const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                if (monthValue > currentMonth) {
                    return showToast('เลือกเดือนได้ถึงเดือนปัจจุบันเท่านั้น', 'error');
                }

                app.closeModal();
                toggleLoading(true);
                showToast('กำลังจัดรูปแบบรายงาน PDF รายเดือน...', 'success');

                try {
                    const result = app.buildMonthlyReportPdfHtml([monthValue], { allMonths: false });
                    app.openMonthlyReportPdfHtml(result.reportHtml, result.fileTitle, 'เปิดรายงานรายเดือนแล้ว เลือก “บันทึกเป็น PDF”');
                } catch (e) {
                    console.error('Monthly PDF export error:', e);
                    showToast(e.message || 'เกิดข้อผิดพลาดในการเปิดรายงาน PDF รายเดือน', 'error');
                } finally {
                    toggleLoading(false);
                }
            },

            exportAllMonthlyReportPdfs: async () => {
                const roomId = state.activeClassroomId;
                if (!roomId) return showToast('ยังไม่ได้เลือกห้องเรียน', 'error');

                const today = new Date();
                const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                const attendance = state.roomData[roomId]?.attendance || [];
                const monthValues = [...new Set(
                    attendance
                        .map(day => day?.date ? day.date.substring(0, 7) : '')
                        .filter(month => month && /^\d{4}-\d{2}$/.test(month) && month <= currentMonth)
                )].sort();

                if (monthValues.length === 0) {
                    return showToast('ยังไม่มีข้อมูลเช็คชื่อรายเดือนสำหรับส่งออก', 'error');
                }

                app.closeModal();
                toggleLoading(true);
                showToast('กำลังรวมรายงาน PDF ทุกเดือน...', 'success');

                try {
                    const result = app.buildMonthlyReportPdfHtml(monthValues, { allMonths: true });
                    app.openMonthlyReportPdfHtml(result.reportHtml, result.fileTitle, `เปิดรายงานรวม ${result.monthCount} เดือนแล้ว เลือก “บันทึกเป็น PDF”`);
                } catch (e) {
                    console.error('All monthly PDF export error:', e);
                    showToast(e.message || 'เกิดข้อผิดพลาดในการเปิดรายงาน PDF ทุกเดือน', 'error');
                } finally {
                    toggleLoading(false);
                }
            },

			// 🌟 ฟังก์ชันแชร์รูปภาพรายงานสรุปสถิติสะสมแยกตามเกณฑ์เปอร์เซ็นต์ (คืนค่าระยะเยื้อง top-[-19px] และ top-[-24px] ของคุณครูแล้ว)
            exportReportImage: async () => {
                toggleLoading(true);
                showToast('กำลังประมวลผลรูปภาพรายงาน กรุณารอสักครู่...', 'success');

                const roomId = state.activeClassroomId;
                const cls = state.classrooms.find(c => c.id === roomId) || PREDEFINED_CLASSES.find(c => c.id === roomId);
                const isGeoMode = state.settings?.geoCheckIn?.[roomId] === true; 
                const s = state.settings;
                let todayStr = getTodayString();
                if (todayStr > s.term2End) todayStr = s.term2End;
                else if (todayStr > s.term1End && todayStr < s.term2Start) todayStr = s.term1End;
                
                const currentAttendance = state.roomData[roomId]?.attendance || [];
                const todayInfo = getAttendanceDayInfo(todayStr, roomId);
                const passedDays = todayInfo.dayCount > 0 ? todayInfo.dayCount : 1;
                const recordedDays = currentAttendance.length;
                const shortRoomName = cls.name.replace('อนุบาล ', 'อ.').replace('ประถมศึกษาปีที่ ', 'ป.').replace('มัธยมศึกษาปีที่ ', 'ม.');

                // 1. ประมวลผลคำนวณสถิติสะสมรายบุคคล
                const list = getProcessedStudents();
                const studentStats = {};
                list.forEach(std => { studentStats[std.id] = { p: 0, late: 0, l: 0, s: 0, a: 0, t: 0, student: std }; });

                currentAttendance.forEach(day => {
                    const recordedIds = [];
                    day.records.forEach(r => {
                        recordedIds.push(r.studentId);
                        if (!studentStats[r.studentId]) return;
                        studentStats[r.studentId].t++;
                        if (r.status === 'present') { studentStats[r.studentId].p++; }
                        else if (r.status === 'late') { studentStats[r.studentId].late++; }
                        else if (r.status === 'absent') { studentStats[r.studentId].a++; }
                        else if (r.status && (r.status === 'sick' || r.status.includes('sick'))) { studentStats[r.studentId].s++; }
                        else if (r.status && (r.status === 'leave' || r.status.includes('leave') || r.status === 'other')) { studentStats[r.studentId].l++; }
                    });

                    if (day.date < getTodayString()) {
                        list.forEach(std => {
                            if (recordedIds.includes(std.id) || !studentStats[std.id]) return;
                            if (std.isTransferred && day.date >= std.transferDate) return;
                            if (std.transferInDate && day.date < std.transferInDate) {
                                studentStats[std.id].t++; studentStats[std.id].p++;
                            } else if (isGeoMode) {
                                studentStats[std.id].t++; studentStats[std.id].a++;
                            }
                        });
                    } else if (day.date === getTodayString() && isGeoMode) {
                        list.forEach(std => {
                            if (recordedIds.includes(std.id) || !studentStats[std.id]) return;
                            const rosterItem = window.app.rosterData ? window.app.rosterData.find(r => r.id === std.id) : null;
                            if (rosterItem && rosterItem.manualStatus && rosterItem.manualStatusDate === getTodayString()) {
                                studentStats[std.id].t++;
                                const ms = rosterItem.manualStatus;
                                if (ms.includes('sick')) { studentStats[std.id].s++; }
                                else if (ms.includes('leave') || ms === 'other') { studentStats[std.id].l++; }
                                else if (ms === 'on_time') { studentStats[std.id].p++; }
                            }
                        });
                    }
                });

                // 2. จัดกลุ่มนักเรียนตามเกณฑ์กระทรวงศึกษาธิการ (80%)
                let zones = { safe: [], warning: [], danger: [] };
                Object.values(studentStats).forEach(sData => {
                    if (sData.student.isTransferred) return; 
                    
                    const totalPresentStudent = sData.p + sData.late;
                    const pct = sData.t ? Math.round((totalPresentStudent / sData.t) * 100) : 0;
                    const preparedData = { ...sData, pct };

                    if (pct >= 85) zones.safe.push(preparedData); 
                    else if (pct >= 80) zones.warning.push(preparedData); 
                    else zones.danger.push(preparedData); 
                });

                zones.safe.sort((a,b) => Number(a.student.studentNumber) - Number(b.student.studentNumber));
                zones.warning.sort((a,b) => Number(a.student.studentNumber) - Number(b.student.studentNumber));
                zones.danger.sort((a,b) => Number(a.student.studentNumber) - Number(b.student.studentNumber));

                // 3. วาดโครงสร้างภาพ HTML
                const container = document.createElement('div');
                container.style.cssText = 'position: fixed; top: -10000px; left: -10000px; width: 1080px; background-color: #f9fafb; font-family: "Kanit", sans-serif; z-index: -1;';
                
                const getReportZoneHtml = (title, students, theme) => {
                    if (students.length === 0) return '';
                    
                    const stdBoxes = students.map(sData => {
                        const std = sData.student;
                        const presentCount = isGeoMode ? sData.p : sData.p + sData.late;
                        const lateDetail = (isGeoMode && sData.late > 0) ? `+สาย${sData.late}` : '';

                        return `
                            <div class="p-6 rounded-3xl border-2 bg-white ${theme.border} text-left flex flex-col items-center justify-center shadow-sm">
                                <span class="text-4xl font-black text-gray-800 truncate w-full text-center leading-normal pb-2 relative top-[-19px]">${std.first}</span>
                                
                                <span class="text-5xl font-black ${theme.text} my-2 relative top-[-24px]">${sData.pct}%</span>
                                
                                <div class="flex justify-center items-center gap-2 text-[17px] font-black text-gray-400 mt-1 w-full relative top-[0px] pb-2">
                                    <span class="text-emerald-600">มา:${presentCount}${lateDetail}</span>
                                    <span class="text-red-500">ขาด:${sData.a}</span>
                                    <span class="text-blue-500">ลา:${sData.l}</span>
                                    <span class="text-orange-500">ป่วย:${sData.s}</span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="mb-12 w-full">
                            <div class="flex items-baseline gap-4 mb-6 border-b-2 border-gray-100 pb-3">
                                <h2 class="text-[2.5rem] font-black ${theme.title} leading-none">${title}</h2>
                                <span class="text-3xl font-bold text-gray-700 leading-none">${students.length} คน</span>
                            </div>
                            <div class="grid grid-cols-3 gap-6 w-full">
                                ${stdBoxes}
                            </div>
                        </div>
                    `;
                };

                container.innerHTML = `
                    <div class="w-full flex flex-col p-12 relative overflow-hidden bg-gradient-to-b from-blue-50 to-white">
                        <div class="bg-white p-10 rounded-[3rem] shadow-md border border-gray-100 flex flex-col justify-center items-center text-center mb-12 relative z-10 gap-4">
                            <h1 class="text-[3.5rem] font-black text-[#2563eb] leading-tight">รายงานสรุปเวลาเรียนสะสมชั้น ${shortRoomName}</h1>
                            <p class="text-3xl font-bold text-gray-500 bg-gray-100 w-max px-6 py-2 rounded-xl">สถิติสะสมเปิดเรียน ${passedDays} วัน (บันทึกข้อมูล ${recordedDays} วัน)</p>
                        </div>

                        <div class="bg-white rounded-[3rem] p-10 shadow-sm border border-gray-100 flex flex-col relative z-10">
                            ${getReportZoneHtml('ผ่านเกณฑ์ (ปลอดภัย 85% - 100%)', zones.safe, { border: 'border-emerald-200', text: 'text-emerald-600', title: 'text-emerald-600' })}
                            ${getReportZoneHtml('เฝ้าระวัง (เสี่ยงหมดสิทธิ์สอบ 80% - 84%)', zones.warning, { border: 'border-orange-200', text: 'text-orange-600', title: 'text-orange-600' })}
                            ${getReportZoneHtml('ไม่ผ่านเกณฑ์ (หมดสิทธิ์สอบ ต่ำกว่า 80%)', zones.danger, { border: 'border-red-200', text: 'text-red-600', title: 'text-red-600' })}
                        </div>
                    </div>
                `;

                document.body.appendChild(container);
                await new Promise(resolve => setTimeout(resolve, 500));

                try {
                    const canvas = await html2canvas(container, { scale: 1.5, useCORS: true, backgroundColor: '#f9fafb' });
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    if (!blob) throw new Error('Cannot create image blob');

                    const fileName = `รายงานเวลาเรียนสะสม_${shortRoomName}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: `รายงานสรุปเวลาเรียนสะสม ${shortRoomName}`,
                                text: `สรุปสถิติเวลาเรียนชั้น ${shortRoomName} สะสม ${recordedDays} วัน`,
                                files: [file]
                            });
                            showToast('เปิดหน้าต่างแชร์รายงานสำเร็จ', 'success');
                        } catch (err) {
                            if (err.name !== 'AbortError') fallbackDownload(blob, fileName);
                        }
                    } else {
                        fallbackDownload(blob, fileName);
                    }

                    function fallbackDownload(b, name) {
                        const url = URL.createObjectURL(b);
                        const link = document.createElement('a');
                        link.download = name; link.href = url; link.click();
                        URL.revokeObjectURL(url);
                        showToast('บันทึกรูปรายงานลงเครื่องสำเร็จ', 'success');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('เกิดข้อผิดพลาดในการสร้างรูปรายงาน', 'error');
                } finally {
                    document.body.removeChild(container);
                    toggleLoading(false);
                }
            },

            toggleNameDisplay: async (roomId) => {

            showRandomBlockedWarning: (count) => {

                // สั่งให้กระโดดไปแท็บ "ค้างเช็คชื่อ" อัตโนมัติเพื่อให้ครูเห็นว่าวันไหนบ้าง

            },
		
		// PATCH-MKMCLASS-SHEET-BACKFILL-002: temporary, reviewable export suggestions.
        // IMPORTANT: only known attendance is authoritative. Suggested missing-day symbols require teacher confirmation.
        // This logic never persists guesses into Firebase, and normal sync continues to use only recorded status.
        getSheetBackfillProposal: (std, attendanceDocs, begin, finish, minimumAbsences) => {
            const entriesByDay = new Map();
            attendanceDocs.forEach(day => {
                const record = Array.isArray(day.records) ? day.records.find(r => r.studentId === std.id) : null;
                if (record) entriesByDay.set(day.date, record.status);
            });
            const known = new Set(['present', 'late', 'on_time', 'absent', 'leave', 'personal_leave', 'other', 'sick', 'sick_leave']);
            const proposed = new Map();
            let confirmedAbsentRun = 0;
            let inferAbsenceForward = false;
            const validTransferIn = /^\d{4}-\d{2}-\d{2}$/.test(std.transferInDate || '') ? std.transferInDate : null;
            const validTransferOut = /^\d{4}-\d{2}-\d{2}$/.test(std.transferDate || '') ? std.transferDate : null;
            const cursor = parseDateLocal(begin);
            const finalDay = parseDateLocal(finish);
            for (; cursor <= finalDay; cursor.setDate(cursor.getDate() + 1)) {
                const dStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}-${String(cursor.getDate()).padStart(2, '0')}`;
                if (!isSchoolDay(dStr)) continue;
                if ((validTransferIn && dStr < validTransferIn) || (std.isTransferred && validTransferOut && dStr >= validTransferOut)) {
                    confirmedAbsentRun = 0;
                    inferAbsenceForward = false;
                    continue;
                }
                const status = entriesByDay.get(dStr);
                if (known.has(status)) {
                    if (status === 'absent') {
                        confirmedAbsentRun++;
                        if (confirmedAbsentRun >= minimumAbsences) inferAbsenceForward = true;
                    } else {
                        confirmedAbsentRun = 0;
                        inferAbsenceForward = false;
                    }
                } else {
                    // If an actual run of absences reached the threshold, suggest ข until a later actual status breaks it.
                    // Otherwise suggest /; both are clearly labelled unverified until teacher approves.
                    proposed.set(dStr, inferAbsenceForward ? 'ข' : ' /');
                    if (!inferAbsenceForward) confirmedAbsentRun = 0;
                }
            }
            return proposed;
        },

        // Fingerprint the exact term-specific source used during review; reject stale approval.
        sheetBackfillFingerprint: (students, attendanceDocs, begin, finish) => JSON.stringify({
            students: students.map(std => [std.id, std.studentNumber, std.name, std.transferInDate || '', !!std.isTransferred, std.transferDate || '']),
            attendance: attendanceDocs.filter(a => a.date >= begin && a.date <= finish).map(a => [
                a.date,
                (Array.isArray(a.records) ? a.records : []).map(r => [r.studentId, r.status]).sort((a, b) => String(a[0]).localeCompare(String(b[0])))
            ]).sort((a, b) => String(a[0]).localeCompare(String(b[0])))
        }),

        // PATCH-MKMCLASS-SHEET-BACKFILL-003: use the saved academic calendar as the ONLY date source.
        // Do not use DEFAULT_SETTINGS directly or override dates for a particular academic year.
        getSheetBackfillCalendar: (term) => {
            if (!state.hasLoadedSettings) throw new Error('ยังโหลดปฏิทินการศึกษาจากระบบไม่เสร็จ กรุณารอสักครู่');
            if (!['1', '2'].includes(term)) throw new Error('กรุณาเลือกภาคเรียนให้ถูกต้อง');
            const s = state.settings || {};
            const start = term === '1' ? s.term1Start : s.term2Start;
            const termEnd = term === '1' ? s.term1End : s.term2End;
            const validDate = /^\d{4}-\d{2}-\d{2}$/;
            if (!validDate.test(start || '') || !validDate.test(termEnd || '') || start > termEnd ||
                (term === '1' && validDate.test(s.term2Start || '') && termEnd >= s.term2Start)) {
                throw new Error('ช่วงวันที่ในปฏิทินการศึกษาไม่ถูกต้อง กรุณาตรวจสอบการตั้งค่าระบบ');
            }
            const today = getTodayString();
            const end = termEnd <= today ? termEnd : today;
            // Snapshot the calendar and school-day exceptions, so a changed calendar invalidates a review.
            const signature = JSON.stringify({
                year: state.activeYear,
                term1Start: s.term1Start, term1End: s.term1End,
                term2Start: s.term2Start, term2End: s.term2End,
                holidays: s.holidays || [], makeups: s.makeups || [],
                term, start, termEnd, end
            });
            return { term, start, termEnd, end, signature };
        },

                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', `attendance_${state.activeYear}_${room.id}`))
                    ]);
                    const stds = stdSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => Number(a.studentNumber) - Number(b.studentNumber)).slice(0, 35);
                    const atts = attSnap.docs.map(d => d.data());
                    fingerprints[room.id] = app.sheetBackfillFingerprint(stds, atts, start, end);
                    if (!atts.some(a => a.date >= start && a.date <= end)) roomsWithNoAttendance++;
                    let roomTotal = 0, roomAbsent = 0;
                    const candidates = [];
                    for (const std of stds) {
                        const proposal = app.getSheetBackfillProposal(std, atts, start, end, threshold);
                        let absCount = 0;
                        proposal.forEach((symbol, day) => {
                            const isAbsent = symbol === 'ข';
                            auditRows.push([room.name, std.studentNumber ?? '', std.name || '', day, symbol.trim(), 'รอตรวจสอบ', isAbsent ? 'เสนอ ข ตามการขาดจริงต่อเนื่อง' : 'เสนอ / เพราะไม่มีประวัติ']);
                            roomTotal++;
                            if (isAbsent) { roomAbsent++; absCount++; }
                        });
                        if (absCount) candidates.push({ id: std.id, name: std.name || '-', absentCount: absCount, missingCount: proposal.size });
                    }
                    totalSuggestions += roomTotal;
                    suggestedAbsences += roomAbsent;
                    roomReviews.push({ id: room.id, name: room.name, roomTotal, roomAbsent, candidates });
                }
                if (calendar.signature !== app.getSheetBackfillCalendar(term).signature) {
                    throw new Error('ปฏิทินการศึกษาเปลี่ยนระหว่างวิเคราะห์ กรุณาวิเคราะห์ใหม่');
                }
                state.backfillSheetPreview = { term, start, end, threshold, year: state.activeYear,
                    calendarSignature: calendar.signature, roomReviews, auditRows, fingerprints };
                const safe = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                const roomMarkup = roomReviews.map((room, ri) => `
                    <div class="rounded-xl border border-gray-200 p-3 space-y-2">
                        <label class="font-semibold flex gap-2 items-center text-sm">
                            <input type="checkbox" class="backfill-room-reviewed" data-review-index="${ri}" ${room.roomTotal ? '' : 'checked disabled'}/>
                            ${safe(room.name)} — รอตรวจ ${room.roomTotal} ช่อง (เสนอ ข ${room.roomAbsent} ช่อง)
                        </label>
                        ${room.candidates.length ? `<div class="pl-4 text-xs text-gray-600">นักเรียนที่ระบบเสนอให้ต่อเนื่องเป็น ข (ให้ตรวจจากหลักฐานจริง):</div>
                        <div class="pl-4 space-y-2">${room.candidates.map((std, si) => `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1 sm:gap-3 items-center">
                                <span class="text-xs">${safe(std.name)} — เสนอ ข ${std.absentCount} วัน จากช่องว่าง ${std.missingCount} วัน</span>
                                <select class="backfill-student-choice border rounded-lg p-1 text-xs" data-review-index="${ri}" data-student-index="${si}">
                                    <option value="suggested">ตามข้อเสนอ (ต้องตรวจสอบ)</option>
                                    <option value="present">ใช้ / สำหรับวันที่ขาดข้อมูลทั้งหมด</option>
                                    <option value="blank">เว้นช่องที่ไม่มีข้อมูลไว้</option>
                                </select>
                            </div>`).join('')}</div>` : ''}
                    </div>`).join('');
                previewEl.innerHTML = `
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-sm">พบช่องที่ไม่มีข้อมูล <strong>${totalSuggestions}</strong> ช่อง จากทุกห้อง
                        (เสนอ / จำนวน ${totalSuggestions - suggestedAbsences} ช่อง และเสนอ ข จำนวน ${suggestedAbsences} ช่อง)
                        ${roomsWithNoAttendance ? `<p class="text-red-700 mt-1 font-semibold">มี ${roomsWithNoAttendance} ห้องที่ไม่มีประวัติการเช็กชื่อในช่วงนี้เลย ต้องสอบทานกับหลักฐานภายนอกก่อน</p>` : ''}
                    </div>
                    <button type="button" onclick="app.downloadBackfillSheetAudit()" class="text-sm px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl font-semibold">2. ดาวน์โหลดรายการเสนอเติม CSV เพื่อตรวจสอบรายวัน</button>
                    <p class="text-xs text-gray-600">เมื่อครูตรวจสอบรายการจากหลักฐานแล้ว ให้ทำเครื่องหมายยืนยันในแต่ละห้องที่มีช่องว่าง</p>
                    <div class="max-h-64 overflow-y-auto space-y-2 border rounded-xl p-2">${roomMarkup}</div>
                    <label class="flex gap-2 items-start text-sm text-amber-900 bg-amber-50 rounded-xl p-3">
                        <input type="checkbox" id="backfillAttestation" class="mt-1" />
                        <span>ข้าพเจ้าได้ตรวจสอบและรับรองรายการที่เสนอเติมย้อนหลังกับหลักฐานของครูประจำชั้นแล้ว และเข้าใจว่าข้อมูลนี้จะเขียนทับแท็บ Google Sheet เดิม (ปุ่มส่งออกปกติจะคืนช่องว่างตามข้อมูลจริง)</span>
                    </label>
                    <button type="button" onclick="app.confirmBackfillSheetExport()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold">3. ยืนยันและส่งออกชั่วคราวไป Google Sheet</button>`;
            } catch (e) {
                console.error('Backfill preview error',e);
                previewEl.textContent = 'ไม่สามารถอ่านข้อมูลสำหรับตรวจทานได้ กรุณาลองใหม่';
                showToast('ไม่สามารถวิเคราะห์ข้อมูลได้', 'error');
            }
        },

        downloadBackfillSheetAudit: () => {
            const preview = state.backfillSheetPreview;
            if (!preview) return;
            const escapeField = (value) => {
                let s = String(value ?? '');
                // Prevent spreadsheet formula injection from imported student names.
                if (/^[=+@\-]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            };
            const csv = '\uFEFF' + preview.auditRows.map(row => row.map(escapeField).join(',')).join('\r\n');
            const link = document.createElement('a');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `MKMCLASS_Backfill_Review_${preview.year}_T${preview.term}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        },

        confirmBackfillSheetExport: async () => {
            const preview = state.backfillSheetPreview;
            if (!preview || !state.isAdmin) return;
            let calendar;
            try { calendar = app.getSheetBackfillCalendar(preview.term); }
            catch (e) { showToast(e.message, 'error'); return; }
            if (preview.year !== state.activeYear ||
                document.getElementById('backfillTerm')?.value !== preview.term ||
                preview.calendarSignature !== calendar.signature ||
                preview.start !== calendar.start || preview.end !== calendar.end ||
                Number(document.getElementById('backfillThreshold')?.value) !== preview.threshold) {
                showToast('ปฏิทินการศึกษาหรือเงื่อนไขเปลี่ยน กรุณาวิเคราะห์ใหม่ก่อนส่งออก', 'error'); return;
            }
            const requiredChecks = [...document.querySelectorAll('.backfill-room-reviewed:not(:disabled)')];
            if (!requiredChecks.every(e => e.checked) || !document.getElementById('backfillAttestation')?.checked) {
                showToast('กรุณาตรวจสอบและยืนยันทุกห้องที่มีรายการค้างก่อน', 'error'); return;
            }
            const overrides = {};
            document.querySelectorAll('.backfill-student-choice').forEach(el => {
                const ri = Number(el.dataset.reviewIndex), si = Number(el.dataset.studentIndex);
                const room = preview.roomReviews[ri];
                const student = room?.candidates[si];
                if (student && el.value !== 'suggested') {
                    if (!overrides[room.id]) overrides[room.id] = {};
                    overrides[room.id][student.id] = el.value;
                }
            });
            await app.syncToGoogleSheet({ approved: true, term: preview.term, start: preview.start, end: preview.end,
                threshold: preview.threshold, year: preview.year, overrides, fingerprints: preview.fingerprints,
                calendarSignature: preview.calendarSignature });
        },

        
			
			// ==========================================
            // 🌟 ฟีเจอร์ใหม่: ระบบสุ่มชื่อนักเรียน (Randomizer)
            // ==========================================
            openRandomizerModal: async () => {
                const rs = state.randomizerState;
                toggleLoading(true);
                try {
                    // ดึงข้อมูลเด็กจากทุกห้องมาเก็บไว้ (ถ้าเปลี่ยนปี หรือยังไม่เคยดึง ให้ดึงใหม่)
                    if (rs.allStudents.length === 0 || rs.dataYear !== state.activeYear) {
                        const promises = PREDEFINED_CLASSES.map(async (c) => {
                            const qSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', `students_${state.activeYear}_${c.id}`));
                            return qSnap.docs.map(d => ({ ...d.data(), id: d.id, roomId: c.id, roomName: c.name }));
                        });
                        const allArrays = await Promise.all(promises);
                        let allStds = [];
                        allArrays.forEach(arr => allStds = allStds.concat(arr));
                        rs.allStudents = allStds;
                        rs.dataYear = state.activeYear;

                        // ตั้งค่าเริ่มต้น: เลือกห้องที่กำลังเปิดอยู่
                        if (state.activeClassroomId && !rs.selectedRooms.includes(state.activeClassroomId)) {
                            rs.selectedRooms = [state.activeClassroomId];
                        }
                    }
                    rs.activeTab = 'play';
                    rs.resultName = 'พร้อมสุ่ม!';
                    
                    // 🌟 วาดกรอบนอกและพื้นหลังแค่ครั้งเดียวตอนเปิด เพื่อไม่ให้กะพริบ
                    document.getElementById('modal-root').innerHTML = `
                        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-fade-in">
                            <div id="randomizer-inner-root" class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden flex flex-col animate-slide-up relative">
                                </div>
                        </div>
                    `;
                    
                    app.renderRandomizerContent();
                } catch(e) {
                    showToast('เกิดข้อผิดพลาดในการดึงข้อมูลรายชื่อ', 'error');
                }
                toggleLoading(false);
            },
			
			// เพิ่มฟังก์ชันนี้เพื่อล้างประวัติการสุ่ม
            resetRandomizerDrawn: () => {
                state.randomizerState.drawnStudents = {};
                state.randomizerState.resultName = 'พร้อมสุ่ม!';
                app.renderRandomizerContent();
                showToast('ล้างประวัติ! ทุกคนกลับลงกล่องสุ่มแล้ว', 'success');
            },

            setRandomizerTab: (tab) => {
                if (state.randomizerState.isSpinning) return;
                state.randomizerState.activeTab = tab;
                app.renderRandomizerContent();
            },

            toggleRandomizerRoomOpen: (roomId) => {
                const rs = state.randomizerState;
                if (rs.openRooms.includes(roomId)) {
                    rs.openRooms = rs.openRooms.filter(id => id !== roomId);
                } else {
                    rs.openRooms.push(roomId);
                }
                app.renderRandomizerContent();
            },

            toggleRandomizerRoomCheck: (roomId, isChecked) => {
                const rs = state.randomizerState;
                if (isChecked) {
                    if (!rs.selectedRooms.includes(roomId)) rs.selectedRooms.push(roomId);
                    // ลบเด็กทุกคนในห้องนี้ออกจาก unselected (แปลว่าเลือกทุกคน)
                    const roomStds = rs.allStudents.filter(s => s.roomId === roomId);
                    roomStds.forEach(s => delete rs.unselectedStudents[s.id]);
                } else {
                    rs.selectedRooms = rs.selectedRooms.filter(id => id !== roomId);
                }
                app.renderRandomizerContent();
            },

            toggleRandomizerStudentCheck: (stdId, roomId, isChecked) => {
                const rs = state.randomizerState;
                if (isChecked) {
                    delete rs.unselectedStudents[stdId];
                    // ถ้าห้องยังไม่ถูกติ๊กเลือก ให้ติ๊กเลือกห้องด้วย
                    if (!rs.selectedRooms.includes(roomId)) rs.selectedRooms.push(roomId);
                } else {
                    rs.unselectedStudents[stdId] = true;
                }
                app.renderRandomizerContent();
            },

            startRandomizer: () => {
                const rs = state.randomizerState;
                if (rs.isSpinning) return;

                // กรองเด็ก (อยู่ห้องที่เลือก + ไม่โดนติ๊กออก + "ยังไม่เคยโดนสุ่ม" + ไม่ได้ย้ายออก)
                const pool = rs.allStudents.filter(s => 
                    rs.selectedRooms.includes(s.roomId) && 
                    !rs.unselectedStudents[s.id] &&
                    !rs.drawnStudents[s.id] &&
                    !s.isTransferred
                );

                if (pool.length === 0) {
                    return showToast('สุ่มครบทุกคนแล้ว! กรุณากดล้างประวัติเพื่อเริ่มใหม่', 'error');
                }

                // อัปเดตเวลาสุ่มจาก Input
                const durationInput = document.getElementById('rand-duration');
                if (durationInput) {
                    let val = parseInt(durationInput.value);
                    if (isNaN(val) || val < 1) val = 1;
                    if (val > 60) val = 60;
                    rs.duration = val;
                }

                rs.isSpinning = true;
                
                // 🌟 [แก้ปัญหาจอกะพริบ] อัปเดต UI โดยตรงแทนการเรียก app.renderRandomizerContent()
                const startBtn = document.getElementById('btn-start-randomizer');
                if (startBtn) {
                    startBtn.disabled = true;
                    startBtn.innerHTML = '<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> กำลังสุ่ม...';
                }
                
                if (durationInput) durationInput.disabled = true;
                
                const closeBtn = document.getElementById('btn-close-modal');
                if (closeBtn) {
                    closeBtn.disabled = true;
                    closeBtn.classList.add('opacity-50');
                }
                
                const resetBtn = document.getElementById('btn-reset-randomizer');
                if (resetBtn) resetBtn.disabled = true;

                // วาดไอคอนใหม่เฉพาะจุดที่เปลี่ยน (ไอคอนหมุนโหลด)
                lucide.createIcons();

                const nameDisplay = document.getElementById('randomizer-result-name');
                const endTime = Date.now() + (rs.duration * 1000);

                // เอฟเฟกต์หมุนชื่อ (และเสียงแต๊กๆ)
                const spinInterval = setInterval(() => {
                    app.playRandomizerSound('tick');
                    const randStd = pool[Math.floor(Math.random() * pool.length)];
                    if (nameDisplay) {
                        // 🌟 ใช้ฟังก์ชันตัดคำนำหน้าชื่อตอนหมุน
                        nameDisplay.textContent = app.removeTitleFromName(randStd.name || randStd.fullName);

                    // บันทึกว่าคนนี้ถูกสุ่มไปแล้ว จะไม่โดนสุ่มอีก
                    rs.drawnStudents[winner.id] = true; 
                    // 🌟 ใช้ฟังก์ชันตัดคำนำหน้าชื่อตอนแสดงผลลัพธ์

                    app.renderRandomizerContent();
                    
                    showToast(`🎉 สุ่มได้: ${rs.resultName} !`, 'success');
                }, rs.duration * 1000);
            },

				// 🌟 จำตำแหน่งที่เลื่อนไว้ (กันมันเด้งกลับไปบนสุดตอนกดติ๊ก)

            // ==========================================
			
			// 🌟 เพิ่มฟังก์ชันสร้างเสียงสังเคราะห์ (ไม่ต้องใช้ไฟล์ MP3)
            playRandomizerSound: (type) => {
                try {
                    // เรียกใช้ระบบเสียงของเบราว์เซอร์
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!app.audioCtx) app.audioCtx = new AudioContext();
                    const ctx = app.audioCtx;
                    
                    // ปลุก AudioContext ให้ตื่น (จำเป็นสำหรับบางเบราว์เซอร์เช่น Safari/iOS)
                    if (ctx.state === 'suspended') ctx.resume();

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    const now = ctx.currentTime;

                    if (type === 'tick') {
                        // เสียงแต๊กสั้นๆ
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(600, now); // ความถี่เสียง
                        gain.gain.setValueAtTime(0.05, now);    // ความดัง (เบาๆ พอ)
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03); // ค่อยๆ หายไปใน 30ms
                        osc.start(now);
                        osc.stop(now + 0.03);
                    } else if (type === 'tada') {
                        // เสียงปิ๊งงง! (ใช้ 2 เสียงซ้อนกันให้ดูมีมิติ)
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523.25, now); // โน้ต C5
                        osc.frequency.setValueAtTime(1046.50, now + 0.1); // ดีดขึ้นเป็น C6
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5); // ลากเสียงยาว 1.5 วินาที
                        osc.start(now);
                        osc.stop(now + 1.5);
                        
                        // เสียงคอร์ดประสาน
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.type = 'triangle';
                        osc2.frequency.setValueAtTime(659.25, now); // โน้ต E5
                        osc2.frequency.setValueAtTime(1318.51, now + 0.1); // E6
                        gain2.gain.setValueAtTime(0.15, now);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                        osc2.start(now);
                        osc2.stop(now + 1.5);
                    }
                } catch(e) {
                    // ป้องกัน Error กรณีเบราว์เซอร์ไม่รองรับ
                    console.warn('เบราว์เซอร์ไม่รองรับระบบเสียง', e);
                }
            },

                return name.replace(/^(ด\.ช\.|ด\.ญ\.|เด็กชาย|เด็กหญิง|นาย|นางสาว|นาง)\s*/, '').trim();

                    if (monthRecords.length === 0) return null;

                    const byDate = new Map(monthRecords.map(day => [day.date, day]));
                    const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

                    const rows = list.map((std, index) => {
                        let depositTotal = 0;
                        let withdrawTotal = 0;
                        const dayCells = days.map(dayNum => {
                            const dateStr = `${yy}-${String(mm).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                            const rec = byDate.get(dateStr)?.records?.find(r => r.studentId === std.id);
                            const dep = Number(rec?.deposit || 0) || 0;
                            const wit = Number(rec?.withdraw || 0) || 0;
                            depositTotal += dep;
                            withdrawTotal += wit;
                            if (dep > 0 && wit > 0) return `${dep}/-${wit}`;
                            if (dep > 0) return String(dep);
                            if (wit > 0) return `-${wit}`;
                            return '';
                        });
                        return {
                            no: index + 1,
                            code: std.studentIdCode || std.studentNumber || '-',
                            name: std.fullName || std.name || std.displayName || '-',
                            dayCells,
                            depositTotal,
                            withdrawTotal,
                            netTotal: depositTotal - withdrawTotal
                        };
                    });

                    const rowsPerPage = 25;
                    const pages = [];
                    for (let i = 0; i < rows.length; i += rowsPerPage) {
                        pages.push(rows.slice(i, i + rowsPerPage));
                    }
                    if (pages.length === 0) pages.push([]);

                    const dayHeaders = days.map(d => `<th class="day-col">${d}</th>`).join('');
                    const dayCols = days.map(() => '<col class="day-col">').join('');

                    return pages.map((pageRows, pageIndex) => ({
                        monthStr,
                        monthTitle: `${monthName} พ.ศ. ${yearBE}`,
                        daysInMonth,
                        dayHeaders,

                        isLastPageOfMonth: pageIndex === pages.length - 1
                    }));

            addSpecialDate: (type) => {
                const startVal = document.getElementById('specialDateStart').value;
                const endVal = document.getElementById('specialDateEnd').value;
                let noteVal = document.getElementById('specialDateNote').value.trim();
                
                if(!startVal) return showToast('กรุณาเลือกวันที่เริ่มต้น', 'error');
                if(!noteVal) noteVal = type === 'holiday' ? 'วันหยุดพิเศษ' : 'วันชดเชย';
                
                let datesToAdd = [];
                if (endVal && endVal >= startVal) {
                    let curr = parseDateLocal(startVal);
                    let target = parseDateLocal(endVal);
                    while (curr <= target) {
                        let dStr = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
                        datesToAdd.push(dStr);
                        curr.setDate(curr.getDate() + 1);
                    }
                } else {
                    datesToAdd.push(startVal);
                }

                const targetList = type === 'holiday' ? state.settings.holidays : state.settings.makeups;
                const otherList = type === 'holiday' ? state.settings.makeups : state.settings.holidays;

                datesToAdd.forEach(dStr => {
                    const otherIdx = otherList.findIndex(item => (typeof item === 'string' ? item : item.date) === dStr);
                    if (otherIdx > -1) otherList.splice(otherIdx, 1);

                    const existingIdx = targetList.findIndex(item => (typeof item === 'string' ? item : item.date) === dStr);
                    if (existingIdx > -1) {
                        targetList[existingIdx] = { date: dStr, note: noteVal };
                    } else {
                        targetList.push({ date: dStr, note: noteVal });
                    }
                });

                app.reRenderSettingsList();
                document.getElementById('specialDateStart').value = '';
                document.getElementById('specialDateEnd').value = '';
                document.getElementById('specialDateNote').value = '';
            },

            addBulkSpecialDates: (type) => {
                const text = document.getElementById('bulkSpecialDates').value.trim();
                if (!text) return showToast('กรุณากรอกข้อมูลวันที่', 'error');

                const lines = text.split('\n');
                let addedCount = 0;
                let errCount = 0;

                const targetList = type === 'holiday' ? state.settings.holidays : state.settings.makeups;
                const otherList = type === 'holiday' ? state.settings.makeups : state.settings.holidays;

                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    const match = line.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(.*)$/);
                    if (match) {
                        let [ , d, m, y, note ] = match;
                        let yearAD = parseInt(y);
                        if (yearAD > 2500) yearAD -= 543;

                        const dStr = `${yearAD}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                        note = note.trim();

                        const otherIdx = otherList.findIndex(item => (typeof item === 'string' ? item : item.date) === dStr);
                        if (otherIdx > -1) otherList.splice(otherIdx, 1);

                        const existingIdx = targetList.findIndex(item => (typeof item === 'string' ? item : item.date) === dStr);
                        if (existingIdx > -1) {
                            targetList[existingIdx] = { date: dStr, note: note };
                        } else {
                            targetList.push({ date: dStr, note: note });
                        }
                        addedCount++;
                    } else {
                        errCount++;
                    }
                });

                app.reRenderSettingsList();
                document.getElementById('bulkSpecialDates').value = '';
                
                if (addedCount > 0) {
                    showToast(`เพิ่มสำเร็จ ${addedCount} รายการ ${errCount > 0 ? `(รูปแบบผิด ${errCount} รายการ)` : ''}`, 'success');
                } else {
                    showToast('ไม่มีข้อมูลถูกเพิ่ม กรุณาตรวจสอบรูปแบบ', 'error');
                }
            },

                if(type === 'holiday') {
                    state.settings.holidays = state.settings.holidays.filter(d => (typeof d === 'string' ? d : d.date) !== dateStr);

            reRenderSettingsList: () => {
                const hList = document.getElementById('holidayList');
                const mList = document.getElementById('makeupList');

                const renderItem = (item, type) => {
                    const dateStr = typeof item === 'string' ? item : item.date;
                    const note = (typeof item === 'object' && item.note) ? item.note : (type === 'holiday' ? 'วันหยุดพิเศษ' : 'วันชดเชย');
                    
                    const bgClass = type === 'holiday' ? 'bg-red-50' : 'bg-blue-50';
                    const textDateClass = type === 'holiday' ? 'text-red-700' : 'text-blue-700';
                    const textNoteClass = type === 'holiday' ? 'text-red-600' : 'text-blue-600';
                    const btnClass = type === 'holiday' ? 'text-red-400 hover:text-red-600' : 'text-blue-400 hover:text-blue-600';
                    
                    const dateObj = new Date(dateStr);
                    return `<div class="flex justify-between items-center ${bgClass} px-3 py-2 rounded-lg mb-2 border border-transparent">
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm font-bold ${textDateClass}">${dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            <span class="text-xs ${textNoteClass} truncate max-w-[140px] sm:max-w-[200px]" title="${note}">${note}</span>
                        </div>
                        <button type="button" onclick="app.removeSpecialDate('${dateStr}', '${type}')" class="${btnClass} shrink-0 p-1 bg-white rounded-md shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>`;
                };

                if(hList) {
                    const sortedH = [...state.settings.holidays].sort((a, b) => {
                        const da = typeof a === 'string' ? a : a.date;
                        const db = typeof b === 'string' ? b : b.date;
                        return new Date(da) - new Date(db);
                    });
                    hList.innerHTML = sortedH.map(d => renderItem(d, 'holiday')).join('');
                }
                if(mList) {
                    const sortedM = [...state.settings.makeups].sort((a, b) => {
                        const da = typeof a === 'string' ? a : a.date;
                        const db = typeof b === 'string' ? b : b.date;
                        return new Date(da) - new Date(db);
                    });
                    mList.innerHTML = sortedM.map(d => renderItem(d, 'makeup')).join('');
                }
                lucide.createIcons();
            },

                            if(!isNaN(n) && n > maxNum) maxNum = n;
                        });

                        const addPromises = [];
                        let totalAdded = 0;
                        let totalSkipped = 0;

                        // วนลูปอ่านข้อมูลทีละบรรทัด
                        for (let i = 0; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length < 2) continue; 
                            
                            let stuId = String(row[1] || '').trim();
                            if (stuId === 'รหัสนักเรียน' || stuId === 'รหัสประจำตัว' || stuId === '') continue; 
                            
                            let natId = String(row[2] || '').trim();
                            let name = String(row[3] || '').trim();
                            let dob = String(row[4] || '').trim();
                            let nickname = String(row[5] || '').trim();
                            
                            if (name) {
                                const uniqueId = natId || stuId;
                                if (!existingNums.has(uniqueId) || uniqueId === '') {
                                    maxNum++;
                                    addPromises.push(
                                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', `students_${state.activeYear}_${roomId}`, uniqueId || `temp_${Date.now()}_${totalAdded}`), {

                                            nationalId: natId,
                                            name: name,
                                            dob: dob,
                                            nickname: nickname,
                                            createdAt: Date.now() + totalAdded 
                                        })
                                    );
                                    totalAdded++;
                                    if(uniqueId) existingNums.add(uniqueId);
                                } else {
                                    totalSkipped++;
                                }
                            }
                        }
                        
                        await Promise.all(addPromises);
                        
                        if (totalAdded > 0) {
                            showToast(`นำเข้าสำเร็จ ${totalAdded} คน (ข้ามชื่อซ้ำ ${totalSkipped} คน)`, 'success');
                            await app.syncAllSummaries(); // ซิงค์ยอดสรุป
                        } else {
                            showToast('ไม่มีข้อมูลถูกเพิ่ม (อาจจะมีรายชื่อนี้ในห้องอยู่แล้ว)', 'error');
                        }
                        
                    } catch (error) {
                        console.error(error);
                        showToast('เกิดข้อผิดพลาดในการอ่านไฟล์ Excel', 'error');
                    }
                    document.getElementById('csvRoomUpload').value = '';
                    toggleLoading(false);

            saveAttendance: async (isAuto = false) => {

                if (!dayInfo.isSchoolDay) return !isAuto && showToast('เป็นวันหยุด ไม่สามารถบันทึกได้', 'error');

                const advStatus = getAdvanceCheckStatus(state.attendanceDate);

                    return !isAuto && showToast(advStatus.msg, 'error');
                }

                if (!isAuto) toggleLoading(true);
